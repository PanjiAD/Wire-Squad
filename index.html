}
@media (max-width: 640px) {
  .equip-sheet-layout {
    flex-direction: column;
    align-items: center;
  }
  .equip-sheet-card-preview {
    flex: none;
    margin-bottom: 0;
  }
}
.modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.modal-head h3 { margin: 0; }
.modal-head .btn { margin-left: auto; }
.card-text { background: var(--cream); border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
.equip-owner { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
.equip-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 8px; }
.equip-tab { font: inherit; font-size: 11px; font-weight: 700; padding: 5px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: 2px 2px 0 var(--ink); }
.equip-tab.active { background: var(--ink); color: var(--paper); }
.equip-subhead { margin: 8px 0 4px; font-size: 12px; font-weight: 700; }
.equip-empty { background: var(--cream); border: 2px dashed var(--ink); border-radius: 8px; padding: 10px; font-size: 12px; }

/* How to play guide. Art is ported from the design handoff generators. */
.help-card {
  width: min(980px, 100%);
  max-width: min(980px, 100%);
  text-align: left;
  padding: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.help-head {
  flex: none;
  margin: 0;
  padding: 14px 18px 10px;
  background: var(--paper);
  border-bottom: 2px dashed rgba(30, 31, 36, 0.25);
}
.help-scroll {
  min-height: 0;
  overflow: auto;
  padding: 14px 18px 4px;
}
.help-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 210px;
  gap: 14px;
  align-items: center;
  background: var(--cream);
  border: 2px solid var(--ink);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 14px;
}
.help-hero-copy p { margin: 0 0 8px; font-size: 13px; }
.help-hero-copy p:last-child { margin-bottom: 0; }
.help-figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.help-figure figcaption { max-width: 210px; font-size: 10.5px; line-height: 1.3; color: #4a4c57; }
.help-blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.help-block { min-width: 0; background: var(--cream); border: 2px solid var(--ink); border-radius: 10px; padding: 10px 12px; }
.help-block h4 { margin: 0 0 6px; font-size: 12px; }
.help-block p { margin: 0 0 8px; font-size: 12px; }
.help-block p:last-child { margin-bottom: 0; }
.help-span { grid-column: 1 / -1; }
.help-caption { margin: 6px 0 0 !important; font-size: 10.5px !important; line-height: 1.35; color: #4a4c57; }
.help-legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; align-items: start; margin: 8px 0 10px; }
.help-legend-item { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; }
.help-legend-item figcaption { font-size: 10px; line-height: 1.25; }
.help-stand { display: flex; justify-content: center; padding: 2px 0 4px; overflow-x: auto; }
.help-token-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 14px; margin: 8px 0 2px; }
.help-token-row .help-figure figcaption { max-width: 112px; }
.help-cut-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; margin: 10px 0 2px; }
.help-cut-icon { display: inline-flex; padding: 0 4px; color: var(--ink); }
.help-miss-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 0; }
.help-miss-icon { display: inline-flex; color: var(--orange); }
.help-special-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.help-special { background: var(--paper); border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; }
.help-special p { margin: 6px 0 0; font-size: 11.5px; }
.help-special-art { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 84px; }
.help-equip { display: flex; align-items: flex-start; gap: 16px; }
.help-eq-wrap { width: 168px; height: 236px; flex: none; overflow: hidden; }
.help-eq-wrap .eqc { transform: scale(0.665); transform-origin: 0 0; }
.help-equip-copy { padding-top: 4px; }
.help-end-row { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 12px; margin-top: 8px; }
.help-crew { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin: 8px 0 2px; }
.help-crew-item { width: 58px; margin: 0; text-align: center; }
.help-crew-item figcaption { font-size: 9.5px; font-weight: 700; }
.help-first { margin: 12px 0 0; background: #fdeccb; border: 2px solid var(--ink); border-radius: 9px; padding: 8px 10px; font-size: 12px; font-weight: 700; }
.help-actions {
  flex: none;
  display: flex;
  justify-content: flex-end;
  margin: 0;
  padding: 10px 18px 14px;
  background: var(--paper);
  border-top: 2px dashed rgba(30, 31, 36, 0.25);
}

/* Stand rack, exact layout from generators/rack.py. */
.help-art .tn { font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-weight: 700; }
.help-art .rack { display: inline-block; position: relative; padding: 0 calc(var(--bb-tile-w) * 0.35); }
.help-art .rk-row { display: flex; gap: var(--bb-slot-gap, 0); height: calc(var(--bb-tile-w) * 2.95); overflow: hidden; align-items: flex-start; }
.help-art .rk-row svg { display: block; flex: none; width: calc(var(--bb-tile-w) * 1.2222); height: auto; margin: 0 calc(var(--bb-tile-w) * -0.1); }
.help-art .rk-lip {
  position: relative;
  height: calc(var(--bb-tile-w) * 0.72);
  margin-top: -3px;
  border: 3px solid #0b0b0e;
  border-radius: 6px 6px 14px 14px;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(var(--bb-tile-w) * 1.022 - 2px), #0b0b0e calc(var(--bb-tile-w) * 1.022 - 2px) calc(var(--bb-tile-w) * 1.022)) calc(var(--bb-tile-w) * 0.35) 0 / auto 38% no-repeat,
    #1E1F24;
  box-shadow: 4px 4px 0 rgba(30, 31, 36, 0.35);
}
.help-art .rk-lip:before { content: ''; position: absolute; left: 8px; right: 8px; top: 4px; height: 3px; border-radius: 2px; background: #3d3f4a; }
.help-art .shelf { display: flex; padding: 0 calc(var(--bb-tile-w) * 0.35); margin-top: 8px; }
.help-art .shelf .sl { position: relative; display: flex; flex: none; justify-content: center; align-items: flex-start; width: calc(var(--bb-tile-w) * 1.022); height: calc(var(--bb-tile-w) * 1.3); }
.help-art .shelf .sl svg { width: calc(var(--bb-tile-w) * 0.82); height: auto; }
.help-art .shelf .sl i { position: absolute; top: -6px; left: 50%; width: 2px; height: 4px; background: rgba(30, 31, 36, 0.55); }
.help-art .shelf-bg { border: 2px dashed rgba(30, 31, 36, 0.4); border-radius: 8px; background: rgba(255, 255, 255, 0.28); padding-top: 4px; }
.help-art .cutstrip { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; min-height: calc(var(--bb-tile-w) * 0.62); margin-top: 8px; padding: 4px calc(var(--bb-tile-w) * 0.35); border: 2px solid rgba(30, 31, 36, 0.35); border-radius: 8px; background: rgba(30, 31, 36, 0.14); }
.help-art .cutstrip svg { width: calc(var(--bb-tile-w) * 1.5); height: auto; }

/* Equipment card, exact composition from generators/p7.py. */
.eqc, .help-art .eqc {
  position: relative;
  width: 252px;
  height: 352px;
  flex: none;
  overflow: hidden;
  border: 3px solid #1E1F24;
  border-radius: 16px;
  background: linear-gradient(160deg, #F9A850, #F28C28 45%, #DB7414);
  box-shadow: 4px 4px 0 #1E1F24;
}
.eqc:before, .help-art .eqc:before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255, 255, 255, 0.28) 1.2px, transparent 1.6px); background-size: 8px 8px; }
.eqc > *, .help-art .eqc > * { position: absolute; }
.eqc .bd, .help-art .eqc .bd { left: 10px; top: 10px; display: flex; align-items: center; gap: 4px; padding: 2px 8px; border: 2px solid #0b0b0e; border-radius: 10px; background: #1E1F24; color: #F6F1E7; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-size: 28px; line-height: 34px; }
.eqc .il, .help-art .eqc .il { left: 26px; top: 14px; }
.eqc .nm, .help-art .eqc .nm { left: 0; right: 0; top: 136px; text-align: center; font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; font-size: 25px; letter-spacing: 0.03em; text-transform: uppercase; color: #1E1F24; }
.eqc .tb, .help-art .eqc .tb { left: 12px; right: 12px; top: 176px; height: 128px; overflow: hidden; border: 2.5px solid #1E1F24; border-radius: 8px; background: #fff; padding: 9px 11px; font-size: 13px; line-height: 1.38; color: #1E1F24; }
.eqc .ft, .help-art .eqc .ft { left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; height: 36px; background: #1E1F24; color: #F6F1E7; font-size: 12.5px; font-weight: 700; }

@media (max-width: 700px) {
  .help-hero { grid-template-columns: 1fr; }
  .help-hero .help-figure { order: -1; }
  .help-blocks { grid-template-columns: 1fr; }
  .help-span { grid-column: auto; }
  .help-special-grid { grid-template-columns: 1fr; }
  .help-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .help-equip { flex-direction: column; align-items: center; }
}
@media (max-width: 420px) {
  .help-legend { grid-template-columns: 1fr; }
}

.overlay-card {
  width: min(480px, 100%);
  background: var(--paper);
  border: 4px solid var(--ink);
  border-radius: 16px;
  box-shadow: 8px 8px 0 var(--ink);
  padding: 24px;
  text-align: center;
}
.overlay-card.won { border-color: #1d7c36; }
.overlay-card.lost { border-color: var(--red); }
.overlay-card h2 { font-size: 24px; margin: 6px 0; }
.overlay-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

/* --------------------------------------------------------- home / online */

.home-main,
.online-main {
  width: 100%;
  max-width: 1099px;
  margin: 0 auto;
  padding: 22px clamp(16px, 4vw, 48px) 48px;
  display: grid;
  gap: 18px;
  align-items: start;
}

.online-main {
  grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr);
}

.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }

.mode-card { display: flex; flex-direction: column; gap: 6px; }
.mode-card .btn.big { margin-top: auto; }
.mode-card.online { background: #fff8dc; }

.resume-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.resume-card p { margin: 2px 0 0; }

.help-entry { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.help-entry p { margin: 2px 0 0; }

.trust-note {
  margin: 0;
  background: #e8eef2;
  border: 2px dashed #7d94a3;
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 11px;
  color: #3d5261;
}

.online-panel { display: flex; flex-direction: column; gap: 10px; }
.online-panel .name-field { margin-top: 4px; }
.online-panel .btn.big { margin-top: 0; }
.or-rule { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin: 2px 0; }
.or-rule::before, .or-rule::after { content: ""; flex: 1; border-top: 2px dashed #c9c3b4; }
.online-how { margin: 8px 0; }
.online-how li { margin-bottom: 8px; }

.lobby-code { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #c9c3b4; }
.lobby-code strong {
  font: 700 22px/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  letter-spacing: 0.18em;
  background: var(--yellow);
  color: var(--ink);
  border-radius: 8px;
  padding: 5px 12px;
}

.lobby-list { list-style: none; margin: 8px 0 4px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lobby-seat {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 2px solid var(--ink);
  border-radius: 9px;
  background: var(--cream);
  padding: 7px 10px;
}
.lobby-seat.me { background: #fff4c9; }
.lobby-seat .seat-tag { font-size: 10px; }
.lobby-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
.mission-list.compact { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }

.notice-box {
  background: #dff7e3;
  border: 2px solid #1d7c36;
  border-radius: 9px;
  padding: 7px 10px;
  font-size: 12px;
  font-weight: 700;
  color: #1d5c31;
}

.online-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  background: #2c2e36;
  color: var(--cream);
  border-bottom: 3px solid var(--ink);
  padding: 6px 16px;
  font-size: 12px;
}
.online-strip .room-code b { letter-spacing: 0.16em; color: var(--yellow); }
.online-strip .muted { color: #b8b3a8; }
.online-strip-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.conn { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: #cfc9bb; }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.conn.offline { color: #f1b9c1; }
.conn.offline::before { background: var(--red); }
.conn.connecting::before { background: var(--orange); }
.waiting-pill {
  background: #7a3b45;
  color: #fff;
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 10px;
  font-weight: 700;
}
.waiting-box {
  background: #fdeccb;
  border: 2px dashed var(--orange);
  border-radius: 9px;
  padding: 9px 11px;
  font-size: 12px;
  font-weight: 700;
  margin: 0;
}
.overlay-card.paused { border-color: var(--orange); }

/* ------------------------------------------------------------- responsive */

@media (max-width: 1099px) {
  .board, .table { grid-template-columns: minmax(0, 1fr); }
  .board-center { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
  .action-panel { max-height: none; }
  .log-panel { max-height: 220px; }
}

@media (max-width: 699px) {
  .setup-main { grid-template-columns: minmax(0, 1fr); }
  .online-main { grid-template-columns: minmax(0, 1fr); }
  .setup-help { position: static; }
  .players { grid-template-columns: minmax(0, 1fr); }
  .wire { width: 34px; height: 48px; }
  .wire-num { font-size: 17px; }
  .stand-label { flex-basis: 38px; padding-top: 14px; }
  .statusbar { padding: 6px 10px; }
  .board { padding: 4px 10px 20px; }
  .online-strip-actions { margin-left: 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}


/* ------------------------------------------------------------ table layout
   Opponents on top, the shared board in the middle, "you" at the bottom, and
   the action panel plus log on the right (P6a table composition). */

.table {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 370px;
  gap: 14px;
  padding: 12px 16px 24px;
  align-items: start;
}
.table-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.opponents {
  display: grid;
  grid-template-columns: repeat(var(--opps, 1), minmax(0, 1fr));
  gap: 12px;
}
.turn-banner {
  align-self: center;
  background: var(--cream);
  color: var(--ink);
  border: var(--line);
  border-radius: 999px;
  box-shadow: var(--shadow);
  padding: 4px 22px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-size: 13px;
}
.turn-banner.mine { background: var(--yellow); }

.board-center {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 16px;
  background: var(--paper);
  border: var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 12px 14px;
}
.board-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.board-dial { align-items: center; justify-content: center; }
.board-block { display: flex; flex-direction: column; gap: 6px; }
.board-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #37424a; }
.board-empty { margin: 0; font-size: 12px; color: var(--muted); }
.board-equip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.board-equip {
  position: relative;
  background: var(--cream);
  border: 2.5px solid var(--ink);
  border-radius: 10px;
  box-shadow: 2px 2px 0 var(--ink);
  padding: 4px 6px 2px;
  cursor: pointer;
  opacity: 0.55;
  line-height: 0;
}
.board-equip.ready { opacity: 1; outline: 3px solid var(--valid, #3fbf5e); outline-offset: 1px; }
.board-equip.used { opacity: 0.3; filter: grayscale(1); }
.board-equip-no {
  position: absolute;
  top: -8px;
  left: -8px;
  background: var(--ink);
  color: var(--cream);
  border-radius: 999px;
  font: 800 10px/1 system-ui, sans-serif;
  padding: 3px 6px;
}
.board-mission {
  background: var(--cream);
  border: 2.5px dashed var(--ink);
  border-radius: 10px;
  padding: 6px 10px;
  font-size: 12px;
  max-width: 190px;
  text-align: center;
}
.board-mission small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
.board-dial .dial-container { flex-direction: column; text-align: center; }
.board-dial .dial-svg-box {
  flex: 0 0 var(--dial-size, 104px);
  width: var(--dial-size, 104px);
  height: var(--dial-size, 104px);
}
.board-dial .dial { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.board-dial .dial-label, .board-dial .dial-start { color: #37424a; }
.me-seat .stands { flex-direction: column; gap: 10px; }

/* Responsive overrides for the table. They sit last so they beat the base
   .table rules above. */
@media (max-width: 1099px) {
  .table { grid-template-columns: minmax(0, 1fr); }
  .board-center { grid-template-columns: minmax(0, 1fr); }
  .board-dial { flex-direction: row; justify-content: space-around; flex-wrap: wrap; gap: 12px; }
  .table .side { position: static; }
}
@media (max-width: 699px) {
  .table { padding: 8px 8px 20px; gap: 10px; }
  .table-main { gap: 10px; }
  .turn-banner { font-size: 12px; padding: 3px 14px; text-align: center; }
  /* Opponents become a swipeable strip, one card at a time. */
  .opponents {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding-bottom: 6px;
    scroll-snap-type: x proximity;
  }
  .opponents .player { flex: 0 0 min(300px, 84vw); scroll-snap-align: start; }
  .board-center { padding: 10px; gap: 10px; }
  .board-dial .dial-container { flex-direction: row; }
  .board-mission { max-width: none; flex: 1 1 100%; }
}
@media (max-width: 699px) {
  .board-dial .dial-track { flex-wrap: wrap; justify-content: center; }
  .board-dial .dial { min-width: 0; flex: 1 1 140px; }
}


/* ------------------------------------------------------ seats around the board
   Desktop: .opponents dissolves so each seat is a grid item of .arena. Four
   and five players get a left and right seat whose racks run vertically. */
@media (min-width: 1100px) {
  .arena {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "a b" "board board";
    gap: 12px;
    align-items: start;
  }
  .arena .opponents { display: contents; }
  .arena .board-center { grid-area: board; }
  .arena [data-slot="top"] { grid-column: 1 / -1; grid-row: 1; max-width: 640px; justify-self: center; width: 100%; }
  .arena [data-slot="topL"] { grid-column: 1; grid-row: 1; }
  .arena [data-slot="topR"] { grid-column: 2; grid-row: 1; }
  .arena.has-sides {
    grid-template-columns: 200px minmax(0, 1fr) minmax(0, 1fr) 200px;
  }
  .arena.has-sides .board-center { grid-column: 2 / 4; grid-row: 2; }
  .arena.has-sides [data-slot="top"] { grid-column: 2 / 4; grid-row: 1; }
  .arena.has-sides [data-slot="topL"] { grid-column: 2; grid-row: 1; }
  .arena.has-sides [data-slot="topR"] { grid-column: 3; grid-row: 1; }
  .arena.has-sides [data-slot="left"] { grid-column: 1; grid-row: 1 / span 2; }
  .arena.has-sides [data-slot="right"] { grid-column: 4; grid-row: 1 / span 2; }
}

/* Side seats: the rack is a vertical column of rotated tiles (desktop only). */
@media (min-width: 1100px) {
  .side-seat .player-head { gap: 4px; }
  .side-seat .personal-pill { display: none; }
  .side-seat .stand { flex-direction: column; align-items: flex-start; gap: 2px; }
  .side-seat .stand-label { flex-basis: auto; }
  .side-seat .stand {
    --ww: min(30px, max(14px, calc((340px - 6px * var(--u, 8)) / var(--u, 8))));
  }
  .side-seat .stand .rack { padding: 0 6px; }
  .side-seat .stand .rk-row {
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    min-height: 0;
    overflow: visible;
  }
  .side-seat .stand .rk-lip { display: none; }
  .side-seat .stand .wire:not(.cut) {
    width: calc(var(--ww) * 3.12);
    height: var(--ww);
    position: relative;
  }
  .side-seat .stand .wire:not(.cut) .wire-art svg {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--ww);
    height: auto;
    transform: translate(-50%, -50%) rotate(90deg);
  }
  .side-seat.side-right .stand .wire:not(.cut) .wire-art svg {
    transform: translate(-50%, -50%) rotate(-90deg);
  }
  .side-seat .stand .wire.cut {
    width: calc(var(--ww) * 3.12);
    height: auto;
    min-height: calc(var(--ww) * 0.6);
    justify-content: center;
  }
  .side-seat .stand .wire.cut .wire-art svg { width: calc(var(--ww) * 2.4); height: auto; }
  .side-seat .stand .wire-tokens { bottom: auto; left: auto; right: -6px; top: 50%; transform: translateY(-50%); }

}


/* Mid-size desktops: slimmer side column and a one-column board so the seats
   and the shared board keep enough room. */
@media (min-width: 1100px) and (max-width: 1500px) {
  .table { grid-template-columns: minmax(0, 1fr) 320px; }
  .arena.has-sides { grid-template-columns: 170px minmax(0, 1fr) minmax(0, 1fr) 170px; }
  .arena.has-sides .board-center { grid-template-columns: minmax(0, 1fr); }
  .arena.has-sides .board-dial { flex-direction: row; flex-wrap: wrap; justify-content: space-around; gap: 12px; }
  .arena.has-sides .board-dial .dial-container { flex-direction: row; }
}


/* ----------------------------------------------------------- V4 completion */

/* Nameplate: avatar disc, name, crown, wire count. */
.nameplate { cursor: default; }
.avatar {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--av, var(--blue));
  border: 2.5px solid var(--ink);
  box-shadow: 1px 1px 0 var(--ink);
  overflow: hidden;
  display: inline-flex;
  align-items: flex-end;
  justify-content: center;
  line-height: 0;
}
.avatar svg { margin-bottom: -4px; }
.captain-mark { display: inline-flex; line-height: 0; }
.player.is-active .nameplate .avatar { box-shadow: 0 0 0 3px var(--yellow), 1px 1px 0 3px var(--ink); }
.side-seat .seat-tag { display: none; }

/* Action dock: sits under the board, buttons laid out in a row. */
.action-dock .action-panel {
  max-height: none;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
}
.action-dock .action-panel .action-head { flex: 0 0 auto; }
.action-dock .action-panel.draft,
.action-dock .action-panel.pending,
.action-dock .action-panel.setup { display: flex; flex-direction: column; align-items: stretch; overflow: visible; }
.action-dock .action-panel h4 { margin: 0; flex-basis: 100%; }
.action-dock .action-panel .muted.small { flex: 1 1 220px; margin: 0; }
.action-dock .action-panel .action-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.table .side { position: sticky; top: 12px; }
.table .side .log-panel { max-height: 78vh; }

/* Facing racks: online, an opponent's rack is seen from the other side. */

/* Board trays (P5): info tokens on a blue tray, validation on a green one. */
.board-center .supply,
.board-center .valid {
  border: 3px solid var(--ink);
  border-radius: 12px;
  padding: 8px 10px;
  box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.55);
}
.board-center .supply { background: #dbe8f7; border-color: var(--blue); }
.board-center .valid { background: #dff2e3; border-color: var(--valid, #3fbf5e); }
.board-center .supply .supply-title,
.board-center .valid .valid-title { flex: 0 0 100%; }
.board-mission {
  background: var(--cream) repeating-linear-gradient(135deg, transparent 0 8px, rgba(30, 31, 36, 0.05) 8px 9px);
  border-width: 3px;
  padding: 10px 14px;
}
.board-mission b { background: var(--ink); color: var(--cream); border-radius: 6px; padding: 1px 7px; }

/* Dual Cut target pin: a yellow arrow and dashed outline on the pointed wire. */
.wire.selected { outline: 3px dashed var(--yellow); outline-offset: 3px; border-radius: 6px; }
.wire.selected::before {
  content: '';
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 7px solid transparent;
  border-right: 7px solid transparent;
  border-top: 10px solid var(--yellow);
  filter: drop-shadow(0 1px 0 var(--ink));
  z-index: 4;
}

/* Phone: opponents are mini cards; tap a nameplate to open the stand. The
   action dock sticks to the bottom like a sheet. */
@media (max-width: 699px) {
  .opponents .player:not(.expanded) .stands,
  .opponents .player:not(.expanded) .badges { display: none; }
  .opponents .player:not(.expanded) { flex-basis: min(190px, 56vw); }
  .opponents .player:not(.expanded) .personal-pill { display: none; }
  .opponents .player .nameplate { cursor: pointer; }
  .table-main { display: flex; }
  .me-seat { order: 3; }
  .action-dock { order: 4; position: sticky; bottom: 0; z-index: 20; margin: 0 -8px -20px; padding: 6px 8px 14px; background: linear-gradient(to top, var(--desk, #9fb4c2) 70%, transparent); }
  .action-dock .action-panel { max-height: 46vh; overflow: auto; }
  .table .side { position: static; }
}


/* ------------------------------------------------------------ V5 character card */
.char-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 320px; margin: auto; }
.char-card {
  position: relative;
  width: 260px;
  background: #faf6ec;
  border: 4px solid var(--ink);
  border-radius: 18px;
  box-shadow: 5px 5px 0 var(--ink);
  overflow: hidden;
}
.char-art { display: flex; justify-content: center; padding: 14px 0 0; height: 210px; overflow: hidden; line-height: 0; }
.char-ribbon {
  position: absolute;
  left: -6px;
  top: 168px;
  background: var(--ink);
  color: var(--cream);
  padding: 4px 16px 4px 18px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transform: rotate(-2deg);
}
.char-captain {
  position: absolute;
  right: 8px;
  top: 8px;
  background: var(--yellow);
  border: 2.5px solid var(--ink);
  border-radius: 999px;
  padding: 2px 9px 2px 5px;
  font: 800 10px/1.4 system-ui, sans-serif;
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.char-item {
  background: linear-gradient(160deg, #fbab50, #ee8420);
  border-top: 4px solid var(--ink);
  padding: 10px 12px 14px;
  text-align: center;
  position: relative;
}
.char-item small { display: block; font-weight: 800; }
.char-item strong { font-size: 20px; font-weight: 600; }
.char-card.used .char-item { filter: grayscale(1) brightness(1.1); }
.char-used {
  position: absolute;
  right: 10px;
  top: 8px;
  border: 3px solid var(--red);
  color: var(--red);
  border-radius: 6px;
  padding: 0 6px;
  font-weight: 800;
  text-transform: uppercase;
  transform: rotate(8deg);
  background: rgba(255, 255, 255, 0.85);
}
.char-text { margin: 0; text-align: center; color: var(--ink); background: var(--cream); border: 2.5px solid var(--ink); border-radius: 10px; padding: 6px 10px; font-size: 12px; }
.avatar[data-act] { cursor: pointer; }

/* ================================================================ V6 screens */

/* Focus ring (P10a button states): 4px blue ring with a 3px offset. */
.btn:focus-visible, .choice:focus-visible, .value-btn:focus-visible, .target-btn:focus-visible,
.mission-card:focus-visible, .crew-btn:focus-visible, .size-btn:focus-visible, .switch:focus-visible,
.avatar:focus-visible, .wire:focus-visible {
  outline: 4px solid #2f6fb5;
  outline-offset: 3px;
}

/* Welcome: wordmark, tagline, two primary buttons, decor on both sides. */
.welcome { min-height: 100vh; display: flex; flex-direction: column; }
.welcome-hero {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(280px, 420px) minmax(0, 1fr);
  align-items: center;
  gap: 16px;
  padding: 40px 24px 12px;
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
}
.welcome-center { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.wordmark {
  text-transform: uppercase;
  margin: 0;
  font-size: clamp(56px, 11vw, 104px);
  line-height: 0.95;
  font-weight: 400;
  letter-spacing: 0.02em;
  color: var(--cream);
  text-shadow: 3px 3px 0 var(--ink), -1px -1px 0 var(--ink), 1px -1px 0 var(--ink), -1px 1px 0 var(--ink);
  -webkit-text-stroke: 2px var(--ink);
  paint-order: stroke fill;
}
.tagline {
  margin: 0;
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 12px;
  box-shadow: 3px 3px 0 var(--ink);
  padding: 8px 14px;
  font-weight: 700;
}
.welcome-center .btn.big { margin-top: 0; max-width: 340px; }
.btn.primary { background: var(--yellow); }
.mode-notes { display: flex; flex-direction: column; gap: 2px; margin: 0; font-size: 11px; color: #37424a; max-width: 340px; }
.welcome-decor { position: relative; display: flex; align-items: center; justify-content: center; min-height: 240px; }
.welcome-decor .tilt { position: absolute; line-height: 0; filter: drop-shadow(3px 4px 0 rgba(30, 31, 36, 0.35)); }
.welcome-decor.left .a { transform: rotate(-16deg) translate(-18px, -10px); }
.welcome-decor.left .b { transform: rotate(9deg) translate(52px, 52px); }
.welcome-decor.right .c { transform: rotate(14deg) translate(70px, 80px); }
.welcome-foot { max-width: 699px; width: 100%; margin: 0 auto; padding: 8px 24px 28px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
@media (max-width: 860px) {
  .welcome-hero { grid-template-columns: 1fr; padding-top: 24px; }
  .welcome-decor { min-height: 0; order: 3; }
  .welcome-decor.left { display: none; }
  .welcome-decor.right .c { display: none; }
  .welcome-decor.right svg { width: 130px; height: 130px; }
}

/* Mission select: locked tiles and chips */
.mission-card.locked { opacity: 0.55; cursor: not-allowed; background: #e7e3d8; border-style: dashed; box-shadow: none; }
.mission-card.locked:hover { background: #e7e3d8; }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.info-chip { background: var(--ink); color: var(--cream); border-radius: 999px; padding: 2px 10px; font-size: 11px; font-weight: 700; }

/* Setup progress strip: Shuffle, Deal, Sort, Info tokens */
.progress-strip { display: flex; gap: 4px; align-self: stretch; }
.progress-strip span {
  flex: 1;
  text-align: center;
  border: 2.5px solid var(--ink);
  border-radius: 6px;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 800;
  background: #d9d6cc;
}
.progress-strip span.done { background: #3fbf5e; }
.progress-strip span.active { background: var(--yellow); }

/* Settings and rules sheets */
.settings-card { width: min(420px, 100%); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet-head h3 { margin: 0; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 2px solid rgba(30, 31, 36, 0.12); font-weight: 700; }
.set-row.off { opacity: 0.5; }
.set-row em { font-weight: 500; font-size: 11px; }
.switch { width: 52px; height: 28px; border-radius: 999px; border: 3px solid var(--ink); background: #d9d6cc; padding: 0; position: relative; cursor: pointer; }
.switch i { position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); transition: transform 0.15s; }
.switch.on { background: #3fbf5e; }
.switch.on i { transform: translateX(24px); }
.size-row { display: inline-flex; gap: 6px; }
.size-btn { min-width: 36px; min-height: 36px; border: 3px solid var(--ink); border-radius: 8px; background: var(--paper); font-weight: 800; cursor: pointer; }
.size-btn.on { background: var(--yellow); }
.mission-rules-card { background: var(--ink); color: var(--cream); border-radius: 12px; padding: 12px 14px; }
.mission-rules-card .muted { color: #cfc9b8; }
.mission-rules-card .mission-no { background: var(--yellow); color: var(--ink); }

/* End screens (P10c): DEFUSED, BOOM, WRONG WIRE */
.overlay.end { background: rgba(159, 180, 194, 0.97); }
.overlay.end.boom { background: radial-gradient(circle at 50% 35%, #e98aa0, #b44a68); }
.overlay.end.wrong { background: #7a1020; }
.end-card { background: transparent; border: none; box-shadow: none; width: min(560px, 100%); padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.end-title {
  margin: 0;
  font-size: clamp(44px, 9vw, 84px);
  font-weight: 400;
  letter-spacing: 0.04em;
  line-height: 1;
  color: var(--cream);
  -webkit-text-stroke: 2.5px var(--ink);
  paint-order: stroke fill;
  text-shadow: 4px 4px 0 var(--ink);
}
.end-sub { margin: 0; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; padding: 6px 14px; font-weight: 700; max-width: 440px; }
.end-stats { display: flex; gap: 10px; }
.end-stats span { background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 12px; padding: 4px 12px; font-size: 11px; text-align: center; display: flex; flex-direction: column; box-shadow: 2px 2px 0 var(--ink); }
.end-stats b { font-size: 24px; line-height: 1.1; }
.end-dial, .end-wire { line-height: 0; margin: 6px 0; }
.end.boom .end-dial { animation: boomshake 0.5s 1; }
.end.wrong .end-wire svg { width: 90px; height: auto; filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.5)); }
@keyframes boomshake { 0%,100% { transform: translate(0); } 20% { transform: translate(-8px, 4px); } 40% { transform: translate(7px, -5px); } 60% { transform: translate(-5px, -3px); } 80% { transform: translate(4px, 5px); } }

/* Text size setting and reduced motion */
html[data-text="S"] body { font-size: 13px; }
html[data-text="L"] body { font-size: 16px; }
html.reduced-motion *, html.reduced-motion *::before, html.reduced-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}


/* ---------------------------------------------- setup / deal screen (P10a-5) */
.deal-main { max-width: 980px; margin: 0 auto; padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 12px; }
.setup-deal .progress-strip span { padding: 4px 8px; }
.deal-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.deal-card { background: var(--cream); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink); padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; max-width: 520px; }
.deal-card .setup-callout { background: none; border: none; padding: 0; margin: 0; text-transform: uppercase; letter-spacing: 0.03em; }
.deal-card small { color: var(--muted); }
.deal-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.deal-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--cream); border: 3px solid var(--ink); border-radius: 999px; padding: 3px 12px 3px 4px; font-weight: 800; font-size: 12px; }
.deal-chip.active { box-shadow: 0 0 0 4px var(--yellow); }
.deal-chip.done { background: #dff2e3; }
.avatar.sm { width: 26px; height: 26px; border-width: 2px; }
.avatar.sm svg { margin-bottom: -3px; }
.deal-stage .player { background: transparent; border: none; box-shadow: none; padding: 26px 0 0; }
.deal-stage .player-head, .deal-stage .badges { display: none; }
.deal-stage .stands { align-items: center; }
.deal-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: stretch; justify-content: space-between; }
.deal-tray { flex: 1 1 260px; min-height: 76px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; border: 3px dashed rgba(30, 31, 36, 0.4); border-radius: 12px; background: rgba(246, 241, 231, 0.55); font-weight: 700; }
.deal-token { line-height: 0; filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.3)); }
.deal-foot .btn.big { width: auto; min-width: 200px; margin-top: 0; align-self: center; }
.deal-stage .player.is-active { outline: none; }
.deal-stage .stand .rk-row { padding-top: 18px; }

/* Pass-the-device curtain (hotseat) */
.curtain { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.curtain-card { background: var(--cream); border: 4px solid var(--ink); border-radius: 18px; box-shadow: 8px 8px 0 var(--ink); padding: 28px 28px 24px; max-width: 460px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.curtain-card h2 { margin: 4px 0 0; font-size: 24px; }
.curtain-why { margin: 0; font-weight: 800; background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; padding: 4px 12px; }
.curtain-card .btn.big { margin-top: 10px; }
.avatar.xl { width: 110px; height: 110px; border-width: 4px; box-shadow: 3px 3px 0 var(--ink); }
.avatar.xl svg { margin-bottom: -8px; }


/* P10b: banners, shake, cleared hands, confirm line */
.banner-stack { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.ban { display: inline-block; background: var(--ink); color: var(--cream); border: 3px solid var(--yellow); border-radius: 20px; padding: 5px 16px; font-weight: 800; font-size: 14px; box-shadow: 3px 3px 0 rgba(0,0,0,.35); animation: ban-in .28s ease-out; }
.ban.ok { border-color: var(--valid, #3fbf5e); }
.ban.warn { border-color: #f28c28; }
.ban.equip { border-color: #f28c28; background: #3a2410; }
@keyframes ban-in { from { transform: translateY(-14px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shk { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.shk { animation: shk .4s linear 1; }
.player.cleared { opacity: .72; filter: saturate(.6); }
.badge.cleared-badge { background: #d9d6cc; color: #3a3c45; border: 2px solid #6b6d76; }
.confirm-line { margin: 6px 0 0; padding: 6px 10px; background: var(--yellow); border: 3px solid var(--ink); border-radius: 10px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .ban, .shk { animation: none; } }
body.reduce-motion .ban, body.reduce-motion .shk { animation: none; }


/* P10a: lobby avatars, leave modal, field errors */
.avatar.sm { width: 38px; height: 38px; border-width: 3px; box-shadow: 2px 2px 0 var(--ink); flex: none; }
.lobby-seat .conn { margin-left: auto; color: #3a3c45; }
.lobby-seat .conn.connecting::before { background: var(--orange); }
.name-field input.invalid { border-color: var(--red); background: #fdeaed; }
.overlay-card.modal-card { max-width: 380px; text-align: center; }
.btn.dng { background: var(--red); color: #fff; }


/* P10b components, ported from Spec/WireSquad_design_handoff/generators/p10b.py.
   Action pills (.mb), value chips (.chipv), confirm sheets (.sht), log entries
   (.lg), draft pins, and the one-shot cut/reveal/token FX. */

.mb {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 30px;
  padding: 0 10px;
  border: 2.5px solid var(--ink);
  border-radius: 8px;
  background: var(--yellow);
  font-weight: 800;
  font-size: 11.5px;
  box-shadow: 2px 2px 0 var(--ink);
  white-space: nowrap;
  cursor: pointer;
}
.mb.sel { background: var(--cream); }
.mb.hot { outline: 3px solid var(--blue); outline-offset: 2px; }
.mb.red { background: var(--red); color: #fff; }
.mb.off { background: #d9d6cc; color: #5b5d66; border-color: #6b6d76; box-shadow: none; }

.value-btn.chipv {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 34px;
  width: 34px;
  height: 34px;
  padding: 0;
  border: 3px solid var(--ink);
  border-radius: 8px;
  background: var(--cream);
  font-family: var(--bb-font-display);
  font-size: 19px;
  font-weight: 700;
}
.value-btn.chipv.on { background: var(--yellow); box-shadow: 2px 2px 0 var(--ink); }
.value-btn.chipv.on .ysq { background: var(--cream); }
.value-btn.yellow.chipv { background: var(--cream); }
.chipv .ysq { display: block; width: 16px; height: 16px; background: var(--yellow); border: 2.5px solid var(--ink); border-radius: 3px; }

.sht {
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 12px;
  box-shadow: 3px 3px 0 var(--ink);
  padding: 10px 12px;
}
.sht .q { font-family: var(--bb-font-display); text-transform: uppercase; letter-spacing: 0.03em; font-size: 17px; }
.sht p { margin: 4px 0 0; font-size: 11px; color: #3a3c45; }

/* Log entries get the P10b .lg card look. */
.log li {
  background: #fff;
  border: 2px solid #b9b5a9;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 11px;
}
.log li b { font-weight: 800; }

/* Draft pins above the selected wires. */
.wire-pin {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 6;
  line-height: 0;
  pointer-events: none;
}
.wire-pin svg { display: block; width: 19px; height: auto; filter: drop-shadow(0 2px 1px rgba(30, 31, 36, 0.4)); }
.wire.super-sel { outline: 3px dashed var(--yellow); outline-offset: 2px; }

/* One-shot FX. Cut: lift out then lay flat (120ms + 320ms). Reveal red: face
   flip (220ms). Info token: drop with a small squash (140ms). */
@keyframes fx-lift {
  0% { transform: translateY(0) rotate(0deg); }
  30% { transform: translateY(-13px) rotate(-4deg); }
  100% { transform: translateY(0) rotate(0deg); }
}
.wire.fx-lift { animation: fx-lift 440ms var(--bb-ease-out) 1; z-index: 5; }
@keyframes fx-flip {
  0%, 100% { transform: scaleX(1); }
  50% { transform: scaleX(0.1); }
}
.wire.fx-flip { animation: fx-flip 220ms ease-in-out 1; }
@keyframes fx-drop {
  0% { transform: translateY(-9px) scale(1.15); }
  70% { transform: translateY(2px) scale(0.92); }
  100% { transform: translateY(0) scale(1); }
}
.wire.fx-drop .wire-tokens { animation: fx-drop 140ms var(--bb-ease-snap) 1; }

@media (prefers-reduced-motion: reduce) {
  .mb, .shk, .ban, .wire.fx-lift, .wire.fx-flip, .wire.fx-drop .wire-tokens { animation: none; }
}
body.reduce-motion .mb, body.reduce-motion .shk, body.reduce-motion .ban,
body.reduce-motion .wire.fx-lift, body.reduce-motion .wire.fx-flip,
body.reduce-motion .wire.fx-drop .wire-tokens { animation: none; }

.mb:focus-visible, .value-btn.chipv:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }


/* P5 board: captain ribbon, equipment slots, number track, danger mode */
.board-center > .board-captain, .board-center > .board-slots-row, .board-center > .board-track { grid-column: 1 / -1; }
.board-captain { justify-self: center; display: inline-flex; align-items: center; gap: 6px; background: var(--ink); color: var(--cream); border-radius: 99px; padding: 3px 16px; font-size: 12px; font-weight: 700; margin-top: -4px; }
.board-captain b { color: var(--yellow); }
.eq-slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.eq-slot { position: relative; aspect-ratio: 5 / 6; max-height: 96px; width: 100%; border: 3px solid var(--ink); border-radius: 10px; background: #eee9dc repeating-linear-gradient(135deg, transparent 0 7px, rgba(30,31,36,.06) 7px 8px); display: flex; align-items: center; justify-content: center; padding: 0; cursor: default; overflow: hidden; font: inherit; }
.eq-slot.empty { border-style: dashed; border-color: rgba(30,31,36,.45); background: rgba(255,255,255,.35); }
.eq-slot.empty.beyond { opacity: .45; }
.eq-pip { position: absolute; bottom: 4px; right: 5px; font: 800 11px/1 system-ui, sans-serif; font-style: normal; background: var(--ink); color: var(--cream); border-radius: 99px; padding: 2px 6px; }
.eq-slot .eq-art { display: flex; align-items: center; justify-content: center; }
.eq-slot .eq-art svg { max-height: 76px; width: auto; }
.eq-slot.locked .eq-art { filter: blur(2px) grayscale(.5); opacity: .7; }
.eq-slot.unlocked { cursor: pointer; outline: 3px solid var(--valid, #3fbf5e); outline-offset: 1px; box-shadow: 0 0 12px rgba(63,191,94,.7); }
.eq-slot.used { opacity: .45; filter: grayscale(1); cursor: pointer; }
.eq-slot .eq-no { position: absolute; top: 3px; left: 4px; background: var(--ink); color: var(--cream); font: 800 10px/1 system-ui, sans-serif; border-radius: 5px; padding: 2px 5px; }
.eq-flag { position: absolute; top: 2px; right: 5px; font-weight: 900; font-size: 13px; }
.eq-slot.unlocked .eq-flag { color: var(--valid, #3fbf5e); }
.eq-slot.locked .eq-flag { color: var(--red); }
.board-track { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; padding: 6px; background: rgba(30,31,36,.1); border: 3px solid var(--ink); border-radius: 10px; }
.tk-cell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 40px; background: var(--cream); border: 2px solid var(--ink); border-radius: 7px; }
.tk-cell b { font: 400 18px/1 Impact, 'Arial Narrow Bold', sans-serif; }
.tk-cell.done { background: var(--valid, #3fbf5e); }
.tk-check { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 900; font-size: 22px; color: #fff; background: rgba(30,100,50,.82); border-radius: 5px; }
.tk-mark { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); font: 800 9px/9px system-ui, sans-serif; font-style: normal; text-align: center; color: var(--ink); }
.tk-mark.yellow { background: var(--yellow); }
.tk-mark.red { background: var(--red); color: #fff; }
.board-center.danger { box-shadow: var(--shadow), inset 0 0 28px rgba(215,38,61,.55); border-color: var(--red); }
.board-center.danger .dial-svg-box { animation: danger-pulse 1.1s ease-in-out infinite; }
@keyframes danger-pulse { 0%,100% { filter: drop-shadow(0 0 0 rgba(215,38,61,0)); } 50% { filter: drop-shadow(0 0 12px rgba(215,38,61,.95)); } }
html.reduced-motion .board-center.danger .dial-svg-box { animation: none; }
@media (max-width: 699px) { .eq-slot .eq-art svg { max-height: 54px; } .tk-cell { min-height: 34px; } .tk-cell b { font-size: 15px; } }

.wire.solo-target { outline: 3px dashed var(--valid, #3fbf5e); outline-offset: 3px; border-radius: 6px; }
@media (max-width: 699px) {
  .action-dock .action-panel.draft,
  .action-dock .action-panel.pending {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0;
    border-radius: 22px 22px 0 0; border-width: 4px 0 0; box-shadow: 0 -4px 0 rgba(30,31,36,.25);
    max-height: 44vh; overflow: auto; padding: 12px 14px 16px;
  }
  .action-dock .action-panel.draft .draft-actions { position: sticky; bottom: -16px; padding-bottom: 8px; background: var(--cream); z-index: 2; }
  .action-dock .action-panel.draft > .muted { display: none; }
}


/* P2: cut strip under the rack, yellow bracket for two-stand hands, turn arrow */
.cutstrip-live { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; min-height: 22px; margin-top: 6px; padding: 3px 8px; border: 2px solid rgba(30,31,36,.35); border-radius: 8px; background: rgba(30,31,36,.12); }
.cutstrip-live .wire { width: auto; }
.cutstrip-live .wire .wire-art svg { width: calc(var(--ww, 28px) * 1.2); height: auto; }
.stands.multi { position: relative; padding-left: 12px; }
.stands.multi::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 6px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 6px; }
.turn-arrow { display: inline-flex; align-items: center; line-height: 0; }
.player.is-active .turn-arrow svg { animation: arrow-nudge 1s ease-in-out infinite; }
@keyframes arrow-nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
html.reduced-motion .player.is-active .turn-arrow svg { animation: none; }

/* P3: = and != token art, marker art */
.tk-mark { width: auto; height: auto; border: 0; background: none !important; border-radius: 0; line-height: 0; }
.tk-mark svg { display: block; }
.label-chip svg { display: block; }
.label-chip.eq, .label-chip.neq { background: none; border: 0; padding: 0; box-shadow: none; line-height: 0; }

/* P3 trays: framed slot grids with ghost numbers, validation stamp + ring */
.tray-grid { display: grid; gap: 4px; padding: 6px; border-radius: 8px; border: 3px solid var(--ink); }
.tray-info .tray-grid { background: #17365a; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.tray-valid .tray-grid { background: #1d5a2f; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.tray-slot { position: relative; display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 6px; line-height: 0; }
.tray-info .tray-slot { background: #0f2742; border: 2px solid #2d5b94; }
.tray-valid .tray-slot { background: #134321; border: 2px solid #3a8c55; min-height: 52px; }
.tray-slot .ghost-no { font: 400 20px/1 Impact, 'Arial Narrow Bold', sans-serif; opacity: .5; }
.tray-info .ghost-no { color: #4b7fb8; }
.tray-valid .ghost-no { color: #6fd08a; }
.tray-slot svg { max-width: 100%; height: auto; }
.tray-slot.stamp svg { animation: bb-stamp .45s cubic-bezier(.34,1.56,.64,1) 1; }
.tray-slot.stamp::after { content: ""; position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border: 4px solid var(--valid, #3fbf5e); border-radius: 50%; animation: bb-ring .9s ease-out 1 forwards; pointer-events: none; }
@keyframes bb-stamp { 0% { transform: scale(1.3); opacity: 0; } 45% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes bb-ring { from { transform: scale(.8); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
html.reduced-motion .tray-slot.stamp svg, html.reduced-motion .tray-slot.stamp::after { animation: none; }
@media (max-width: 699px) { .tray-slot { min-height: 38px; } .tray-slot .ghost-no { font-size: 16px; } }
.tray-grid { flex: 1 1 100%; width: 100%; max-width: 460px; }


/* P6: phone tap targets, safe area, collapsible log */
.log-toggle { display: none; }
@media (max-width: 699px) {
  .log-toggle { display: inline-flex; }
  .log-panel .log-head { gap: 8px; }
  .log-panel:not(.open) { max-height: none; overflow: hidden; }
  .log-panel:not(.open) .log li:not(:first-child) { display: none; }
  .log-panel.open { max-height: 40vh; overflow: auto; }
  .btn, .target-btn, .choice, .equip-card, .value-btn, .toggle { min-height: 44px; }
  .action-dock .action-buttons .btn { min-height: 48px; }
  .btn.small, .btn.ghost.small { min-height: 40px; }
  .action-dock { padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  .action-dock .action-panel.draft, .action-dock .action-panel.pending { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
}


/* How to play: larger layout and type */
.help-card { width: min(1180px, 100%); max-width: min(1180px, 100%); max-height: 94vh; }
.help-scroll { padding: 18px 24px 8px; }
.help-hero { grid-template-columns: minmax(0, 1fr) 270px; padding: 16px 20px; gap: 20px; }
.help-hero-copy p { font-size: 16px; line-height: 1.5; }
.help-figure figcaption { max-width: 260px; font-size: 13px; }
.help-blocks { gap: 16px; }
.help-block { padding: 14px 16px; }
.help-block h4 { font-size: 16px; margin-bottom: 8px; }
.help-block p { font-size: 15px; line-height: 1.5; }
.help-caption { font-size: 13px !important; }
.help-legend-item figcaption { font-size: 12.5px; }
.help-token-row .help-figure figcaption { max-width: 150px; font-size: 12.5px; }
.help-special p { font-size: 14px; }
.help-special-art { min-height: 104px; }
.help-eq-wrap { width: 214px; height: 300px; }
.help-eq-wrap .eqc { transform: scale(0.85); }
.help-crew-item { width: 80px; }
.help-crew-item figcaption { font-size: 12px; }
.help-first { font-size: 15px; padding: 10px 14px; }
.help-list { margin: 0 0 10px; padding-left: 20px; font-size: 15px; line-height: 1.5; }
.help-list li { margin-bottom: 4px; }
.help-head h3 { font-size: 22px; }
@media (max-width: 699px) {
  .help-hero { grid-template-columns: minmax(0, 1fr); }
  .help-blocks { grid-template-columns: minmax(0, 1fr); }
  .help-block p, .help-hero-copy p, .help-list { font-size: 14px; }
  .help-legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .help-special-grid { grid-template-columns: minmax(0, 1fr); }
}


/* P7: equipment on the board */
.equip-all { margin-top: 10px; font-size: 13px; }
.equip-all summary { cursor: pointer; font-weight: 700; padding: 6px 0; }
.equip-bar .value-row, .equip-bar .target-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
@media (max-width: 699px) {
  .action-dock .action-panel.equip-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0;
    border-radius: 22px 22px 0 0; border-width: 4px 0 0; box-shadow: 0 -4px 0 rgba(30,31,36,.25);
    max-height: 44vh; overflow: auto; padding: 12px 14px calc(16px + env(safe-area-inset-bottom, 0px));
  }
}

/* ============================================================= P10a pregame */
/* Ported from Spec/WireSquad_design_handoff/generators/ui.py + p9.py.
   Components: welcome wordmark, create/join cards, lobby list, mission grid,
   mission card, error cards, toast, step strip. */

.pregame {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  color: var(--ink);
  background-color: var(--desk);
  background-image: radial-gradient(rgba(30, 31, 36, 0.13) 1.2px, transparent 1.5px);
  background-size: 8px 8px;
}

.wm {
  font-family: var(--bb-font-display);
  text-transform: uppercase;
  color: var(--cream);
  letter-spacing: 0.04em;
  line-height: 0.95;
  transform: rotate(-2deg);
  text-shadow:
    4px 4px 0 var(--ink),
    -2px -2px 0 var(--ink),
    2px -2px 0 var(--ink),
    -2px 2px 0 var(--ink),
    2px 2px 0 var(--ink);
}

.wm-sm { font-size: 22px; }

.disp {
  font-family: var(--bb-font-display);
  text-transform: uppercase;
  letter-spacing: 0.03em;
  line-height: 1.1;
}

.cap {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--muted);
}

.pregame-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px clamp(14px, 3vw, 40px);
  flex-wrap: wrap;
}

.pregame-topbar .topbar-title {
  font-family: var(--bb-font-display);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 20px;
  margin-left: 6px;
}

.pregame-topbar .topbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.pregame-main {
  width: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding: 8px clamp(14px, 3vw, 40px) 48px;
  display: grid;
  gap: 20px;
  align-items: start;
}

.setup-main,
.mission-main,
.create-main,
.lobby-main {
  grid-template-columns: minmax(0, 1.45fr) minmax(300px, 1fr);
}

.join-main {
  grid-template-columns: minmax(0, 440px) minmax(260px, 1fr);
  justify-content: center;
}

.card2 {
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 16px;
  box-shadow: 5px 5px 0 var(--ink);
  padding: 20px;
}

.card2 h2,
.card2 h3 { margin-top: 0; }

.pregame-aside { display: flex; flex-direction: column; gap: 10px; }
.pregame-aside .trust-note { margin-top: auto; }

/* Welcome --------------------------------------------------------------- */
.welcome-hero { flex: 1; }
.welcome-name { width: min(360px, 100%); margin: 0 auto; }
.welcome-center .btn.big { width: min(360px, 100%); margin-top: 0; }
.welcome-center .btn.small { margin-top: 2px; }
.welcome-links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

/* Inputs ---------------------------------------------------------------- */
.inp-field {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 14px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: #fff;
  box-shadow: inset 0 3px 0 rgba(30, 31, 36, 0.08);
  color: var(--ink);
}

.inp-field:focus-within { outline: 4px solid var(--blue); outline-offset: 2px; }

.inp-field input {
  flex: 1;
  min-width: 0;
  border: none;
  background: transparent;
  font: inherit;
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
  min-height: 42px;
}

.inp-field input:focus { outline: none; }

.field-block { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }

.field-label {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
}

.field-title { font-size: 18px; margin-bottom: 8px; }

.join-code {
  width: 100%;
  min-height: 58px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: #fff;
  text-align: center;
  font-family: var(--bb-font-display);
  font-size: 30px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--ink);
  box-shadow: inset 0 3px 0 rgba(30, 31, 36, 0.08);
}

.join-code:focus { outline: 4px solid var(--blue); outline-offset: 2px; }

/* Segmented control ----------------------------------------------------- */
.seg { display: flex; gap: 8px; flex-wrap: wrap; }

.seg-btn {
  flex: 1;
  min-width: 56px;
  min-height: 52px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  font-family: var(--bb-font-display);
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  box-shadow: 0 0 0 var(--ink);
}

.seg-btn span {
  font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.seg-btn.on { background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); }
.seg-btn:hover:not(.on) { transform: translateY(-1px); }
.seg-btn:active { transform: translate(2px, 2px); box-shadow: none; }

.seg-sm .seg-btn { min-height: 40px; min-width: 44px; font-size: 18px; }

/* Create / join --------------------------------------------------------- */
.create-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 28px;
  align-items: center;
}

.create-left { display: flex; flex-direction: column; gap: 20px; }
.create-dial { text-align: center; }
.create-dial svg { max-width: 100%; height: auto; }
.create-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.create-bottom { display: flex; gap: 12px; margin-top: 18px; }
.create-bottom .btn.primary { flex: 1; }

.code-row { display: flex; gap: 6px; margin: 8px 0 12px; flex-wrap: wrap; }

.code-tile {
  width: 54px;
  height: 68px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
  color: var(--cream);
  border: 3px solid #0b0b0e;
  border-radius: 8px;
  font-family: var(--bb-font-display);
  font-size: 42px;
  line-height: 1;
}

/* Lobby ----------------------------------------------------------------- */
.share-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--ink);
  border-radius: 12px;
  padding: 8px 12px;
  color: var(--cream);
  flex-wrap: wrap;
}

.share-bar .share-label { font-size: 14px; }
.share-bar .btn { margin-left: auto; min-height: 40px; padding: 0 12px; font-size: 14px; }

.code-big {
  font-family: var(--bb-font-display);
  font-size: 26px;
  letter-spacing: 0.1em;
}

.lobby-head h2 { margin-bottom: 2px; }
.lobby-target { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.lobby-target .seg { flex: 0 0 auto; min-width: 220px; }

.li-list { list-style: none; margin: 10px 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.li {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 56px;
  padding: 6px 12px;
  background: #fff;
  border: 3px solid var(--ink);
  border-radius: 12px;
  font-weight: 700;
  flex-wrap: wrap;
}

.li.me { background: #fff8dc; }
.li.muted { color: var(--muted); font-weight: 500; }

.av {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: var(--av, var(--yellow));
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--bb-font-display);
  font-size: 18px;
  flex: none;
}

.li-name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; }
.li-state { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #3a3c45; }

.cd {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2.5px solid var(--ink);
  flex: none;
}

.cd.ok { background: var(--green); }
.cd.bad { background: var(--red); }
.cd.wait { background: var(--yellow); }

.tg-btn {
  border: none;
  background: none;
  padding: 0;
  min-width: 56px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  cursor: pointer;
}

.tg {
  width: 56px;
  height: 30px;
  border-radius: 16px;
  border: 3px solid var(--ink);
  background: #d9d6cc;
  position: relative;
  flex: none;
}

.tg::after {
  content: "";
  position: absolute;
  left: 2px;
  top: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  border: 2.5px solid var(--ink);
  transition: left 160ms var(--bb-ease-out);
}

.tg.on { background: var(--green); }
.tg.on::after { left: 28px; }

.pill.cap { background: var(--yellow); }
.pill.you { background: var(--green); }
.pill.host { background: #fff; }

.captain-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }

.ready-note {
  margin: 8px 0;
  background: #fff4c9;
  border: 2px dashed #b8921c;
  border-radius: 9px;
  padding: 8px 10px;
  font-size: 12px;
}

.mission-pick-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: #fff;
  border: 3px solid var(--ink);
  border-radius: 12px;
  padding: 10px 12px;
  margin: 14px 0;
}

.mission-pick-box strong { display: block; }

.start-box { margin: 14px 0; }
.start-box .btn.big { margin-top: 0; }

.lobby-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  border-top: 2px dashed #c9c3b4;
  padding-top: 10px;
}

.lobby-foot .conn { color: var(--ink); }
.lobby-foot .conn::before { background: var(--green); }
.lobby-foot .conn.offline::before { background: var(--red); }

/* Mission picker -------------------------------------------------------- */
.mission-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}

.mtile {
  position: relative;
  min-height: 76px;
  border: 3px solid var(--ink);
  border-radius: 12px;
  background: var(--cream);
  color: var(--ink);
  padding: 6px 8px;
  text-align: left;
  cursor: pointer;
  font: inherit;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.mtile .tn {
  font-family: var(--bb-font-display);
  font-size: 30px;
  line-height: 1;
}

.mtile .mt { font-size: 12px; font-weight: 800; line-height: 1.2; }
.mtile .mm { font-size: 10.5px; line-height: 1.25; color: #3a3c45; }
.mtile.on { background: var(--yellow); box-shadow: 4px 4px 0 var(--ink); }
.mtile:hover:not(.locked) { transform: translateY(-1px); }

.mtile.locked {
  background: #d9d6cc;
  border-style: dashed;
  border-color: #6b6d76;
  color: #4a4c57;
  cursor: not-allowed;
}

.mtile .mlock { position: absolute; top: 6px; right: 6px; color: #4a4c57; }

.mission-side { display: flex; flex-direction: column; gap: 16px; }
.mission-side .btn.big { margin-top: 0; }

.mission-detail-title { font-size: 20px; margin-bottom: 8px; }
.pillrow { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.pill.yellow { background: #ffe9a8; }

.two-note {
  background: var(--ink);
  color: var(--cream);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 12.5px;
  line-height: 1.35;
  margin: 8px 0;
}

.two-note b {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--bb-font-display);
  font-weight: 400;
  letter-spacing: 0.08em;
  font-size: 13px;
  margin-bottom: 2px;
}

.two-note.dim { opacity: 0.6; }

.flag-note {
  margin: 8px 0 0;
  font-size: 11px;
  font-weight: 700;
  color: #7a1020;
  background: #fdeaed;
  border: 2px dashed #d7263d;
  border-radius: 8px;
  padding: 6px 8px;
}

/* Mission card (p9.py CSS9, unchanged geometry) ------------------------- */
.mc {
  position: relative;
  width: 300px;
  height: 440px;
  border-radius: 18px;
  border: 3px solid var(--ink);
  overflow: hidden;
  background: #cfdde6;
  box-shadow: 4px 4px 0 var(--ink);
  flex: none;
  font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
}

.mc::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(30, 31, 36, 0.1) 1.2px, transparent 1.5px);
  background-size: 8px 8px;
  pointer-events: none;
}

.mc > * { position: absolute; }
.mc .num::before { content: "#" attr(data-n); }
.mc .num { right: 16px; top: 6px; font-family: var(--bb-font-display); font-size: 58px; line-height: 1; color: var(--ink); }

.mc .tab {
  left: -10px;
  top: 16px;
  width: 200px;
  background: var(--cream);
  border: 3px solid var(--ink);
  padding: 8px 14px 8px 24px;
  transform: skewX(-10deg);
  font-family: var(--bb-font-display);
  font-size: 16px;
  line-height: 1.1;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.mc .tab span { display: block; transform: skewX(10deg); }
.mc .tag { left: 16px; right: 16px; top: 84px; font-style: italic; font-size: 13px; line-height: 1.35; }
.mc .setup { left: 12px; right: 12px; top: 140px; height: 196px; background: var(--ink); border-radius: 12px; padding: 10px 12px; color: var(--cream); }
.mc .setup h4 { margin: 0 0 6px; font-family: var(--bb-font-display); font-weight: 400; font-size: 15px; letter-spacing: 0.12em; color: var(--yellow); }
.mc .rw { display: flex; align-items: center; gap: 10px; height: 34px; font-size: 15px; font-weight: 700; }
.mc .rw .cnt { font-weight: 800; }
.mc .rw .sub { font-weight: 500; font-size: 11px; opacity: 0.8; margin-left: auto; }
.mc .two { left: 12px; right: 12px; bottom: 12px; height: 78px; background: var(--cream); border: 2.5px solid var(--ink); border-radius: 12px; padding: 8px 12px; font-size: 12.5px; line-height: 1.3; }
.mc .two b { font-family: var(--bb-font-display); font-weight: 400; font-size: 13px; letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
.mc .two.dim { opacity: 0.45; border-style: dashed; }

.mc-scale {
  --mc-s: 0.74;
  width: calc(300px * var(--mc-s));
  height: calc(440px * var(--mc-s));
  flex: none;
}

.mc-scale .mc { transform: scale(var(--mc-s)); transform-origin: top left; }

/* Error cards, toast, waiting ------------------------------------------- */
.net-modal {
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 16px;
  box-shadow: 5px 5px 0 var(--ink);
  padding: 18px 20px;
  text-align: center;
  max-width: 440px;
  margin: 12px auto;
}

.net-modal h3 {
  font-family: var(--bb-font-display);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  font-size: 22px;
  margin: 6px 0 4px;
}

.net-modal p { margin: 0 0 12px; font-size: 13.5px; color: #3a3c45; }
.modal-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

.modal-badge {
  display: inline-flex;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: #d9d6cc;
  border: 3px solid var(--ink);
  align-items: center;
  justify-content: center;
}

.modal-badge.wait { background: var(--yellow); }

.net-overlay { z-index: 60; }

.wait-modal {
  background: #fff8dc;
  border: 3px solid var(--ink);
  border-radius: 16px;
  box-shadow: 4px 4px 0 var(--ink);
  padding: 14px 16px;
  text-align: center;
  margin: 14px 0;
}

.wait-modal h3 { font-family: var(--bb-font-display); font-weight: 400; text-transform: uppercase; font-size: 19px; margin: 6px 0 4px; }
.wait-modal p { margin: 0 0 10px; font-size: 12.5px; color: #3a3c45; }

.toast-wrap {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 24px;
  display: flex;
  justify-content: center;
  padding: 0 16px;
  z-index: 70;
  pointer-events: none;
}

.toast {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--ink);
  color: var(--cream);
  border-radius: 12px;
  padding: 10px 16px;
  font-weight: 700;
  font-size: 14px;
  box-shadow: 3px 3px 0 rgba(30, 31, 36, 0.4);
  animation: bbtoast 180ms var(--bb-ease-out);
}

@keyframes bbtoast {
  from { transform: translateY(10px); opacity: 0; }
  to { transform: none; opacity: 1; }
}

/* Setup step strip (used by the deal screen) ---------------------------- */
.stp { display: flex; align-items: center; }
.stp div {
  flex: 1;
  padding: 8px 6px;
  text-align: center;
  font-weight: 800;
  font-size: 12px;
  border: 3px solid var(--ink);
  background: #fff;
  margin-left: -3px;
}
.stp div.done { background: var(--green); }
.stp div.cur { background: var(--yellow); }

.spin { animation: bbspin 1.2s linear infinite; transform-origin: 50% 50%; }
@keyframes bbspin { to { transform: rotate(360deg); } }

/* P10a responsive ------------------------------------------------------- */
@media (max-width: 980px) {
  .setup-main,
  .mission-main,
  .create-main,
  .lobby-main,
  .join-main {
    grid-template-columns: minmax(0, 1fr);
  }
  .mission-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mc-scale { --mc-s: 0.62; }
}

@media (max-width: 640px) {
  .pregame-topbar { padding: 10px 14px; }
  .pregame-main { padding: 4px 14px 40px; gap: 14px; }
  .card2 { padding: 14px; box-shadow: 4px 4px 0 var(--ink); }
  .create-layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .code-tile { width: 44px; height: 56px; font-size: 34px; }
  .mission-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mtile { min-height: 62px; }
  .mtile .tn { font-size: 24px; }
  .mc-scale { --mc-s: 0.55; }
  .seg-btn { min-height: 44px; }
  .share-bar .btn { margin-left: 0; width: 100%; }
  .li { gap: 8px; }
  .li-name { flex-basis: 100%; }
  .li-state { margin-left: auto; }
  .lobby-target .seg { min-width: 0; width: 100%; }
  .create-bottom { flex-direction: column-reverse; }
  .create-bottom .btn { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  .toast,
  .spin,
  .tg::after { animation: none; transition: none; }
}

.reduced-motion .toast,
.reduced-motion .spin,
.reduced-motion .tg::after { animation: none; transition: none; }



/* ======================================================= P6b phone layout
   Phone portrait: compact header, opponents strip, compact board, and a
   bottom dock that pins the viewer's own stand above the action bar. The
   dock wrapper does not exist on desktop (display: contents). */
.bottom-dock { display: contents; }
@media (max-width: 699px) {
  /* header: one line of chips, one scrolling row of small buttons */
  .game .topbar { padding: 6px 10px; gap: 4px 8px; border-bottom-width: 4px; }
  .game .topbar .logo { font-size: 18px; }
  .game .topbar .logo-sub { display: none; }
  .game .topbar-chips { flex: 1 1 auto; flex-wrap: nowrap; overflow: hidden; gap: 4px; justify-content: flex-end; }
  .game .topbar-chips span:nth-child(2), .game .topbar-chips span:nth-child(4) { display: none; }
  .game .topbar-right { flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 2px; scrollbar-width: none; }
  .game .topbar-right::-webkit-scrollbar { display: none; }
  .game .topbar-right .btn { flex: 0 0 auto; min-height: 34px; padding: 4px 10px; font-size: 13px; }
  .game .table { padding: 6px 8px 16px; }

  /* opponents strip */
  .opponents .player:not(.expanded) { flex-basis: min(150px, 42vw); padding: 6px 8px; }
  .opponents .player:not(.expanded) .wire-count { font-size: 11px; padding: 1px 7px; }
  .opponents .player:not(.expanded) .player-name { font-size: 14px; }
  .opponents .player:not(.expanded) .avatar { width: 28px; height: 28px; }

  /* compact board */
  .board-center { padding: 8px; gap: 8px; }
  .board-captain { font-size: 12px; padding: 3px 12px; }
  .board-slots-row .eq-slot { padding: 3px; }
  .board-slots-row .eq-slot .eq-art svg { max-height: 40px; }
  .board-track { padding: 4px; gap: 3px; }
  .tk-cell { min-height: 30px; }
  .tray-grid { padding: 4px; gap: 3px; }
  .tray-info .tray-grid { grid-template-columns: repeat(14, minmax(0, 1fr)); }
  .tray-valid .tray-grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .tray-slot, .tray-valid .tray-slot { min-height: 22px; border-width: 1px; }
  .tray-slot .ghost-no { font-size: 11px; }
  .board-dial { --dial-size: 76px; }
  .board-dial .dial-svg-box { flex-basis: 76px; width: 76px; height: 76px; }

  /* bottom dock: own stand above the action bar */
  .bottom-dock {
    display: flex; flex-direction: column; order: 3;
    position: sticky; bottom: 0; z-index: 25;
    margin: 0 -8px -16px; background: var(--cream);
    border-top: 4px solid var(--ink); box-shadow: 0 -4px 0 rgba(30,31,36,.18);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .bottom-dock .me-seat { order: 0; }
  .bottom-dock .action-dock { order: 1; position: static; margin: 0; padding: 4px 8px 8px; background: none; }
  .me-seat .player { border-width: 0; border-radius: 0; box-shadow: none; padding: 6px 8px 0; background: transparent; }
  .me-seat .badges { display: none; }
  .me-seat .player-head { gap: 6px; padding: 0; }
  .me-seat .player-name { font-size: 15px; }
  .me-seat .avatar { width: 26px; height: 26px; }
  .me-seat .personal-pill { font-size: 10px; padding: 1px 6px; }
  .me-seat .stands { gap: 2px; }
  .me-seat .stand { --lab: 10px; --ww: min(23px, max(9px, calc((100cqw - var(--lab) - 4px * var(--u, 8)) / var(--u, 8)))); }
  .me-seat .stand-label { display: none; }
  .me-seat .stand .rk-row { min-height: 0; }
  .me-seat .rack { padding: 0 4px; }
  .me-seat .stand .rk-lip { height: 8px; }
  .me-seat .cutstrip-live { margin-top: 3px; min-height: 16px; padding: 2px 6px; }

  /* action bar: header chip, one row of big buttons, one row of equipment chips */
  .bottom-dock .action-panel:not(.draft):not(.pending):not(.equip-bar) { border-width: 0; box-shadow: none; padding: 0; background: none; max-height: none; overflow: visible; display: block; }
  .bottom-dock .action-panel:not(.draft):not(.pending):not(.equip-bar) > .muted,
  .bottom-dock .action-panel:not(.draft):not(.pending):not(.equip-bar) > h4,
  .bottom-dock .action-panel:not(.draft):not(.pending):not(.equip-bar) .muted.small { display: none; }
  .bottom-dock .action-panel:not(.draft):not(.pending):not(.equip-bar) .action-head { display: none; }
  .bottom-dock .action-buttons { flex-wrap: nowrap; gap: 6px; }
  .bottom-dock .action-buttons .mb, .bottom-dock .action-buttons .btn { flex: 1 1 0; min-width: 0; min-height: 48px; padding: 4px 6px; font-size: 14px; }
  .bottom-dock .equip-row { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; margin-top: 6px; scrollbar-width: none; }
  .bottom-dock .equip-row::-webkit-scrollbar { display: none; }
  .bottom-dock .equip-card { flex: 0 0 auto; flex-direction: row; align-items: center; gap: 6px; min-height: 38px; padding: 4px 10px; }
  .bottom-dock .equip-card .equip-state { font-size: 9px; }
  .me-seat .stand .wire:not(.cut) { width: auto; height: auto; }
  /* sheets: the base rule wraps flex items, which turned the 44vh column into several columns */
  .bottom-dock .action-panel.draft, .bottom-dock .action-panel.pending, .bottom-dock .action-panel.equip-bar { flex-wrap: nowrap; display: flex; flex-direction: column; align-items: stretch; }

  /* opponents stay readable when collapsed: a mini rack (tile backs, tokens) instead of hiding the stand */
  .opponents .player:not(.expanded) { flex-basis: min(200px, 58vw); }
  .opponents .player:not(.expanded) .stands { display: flex; gap: 3px; pointer-events: none; }
  .opponents .player:not(.expanded) .stand { --lab: 8px; --ww: min(12px, max(7px, calc((100cqw - var(--lab) - 2px * var(--u, 8)) / var(--u, 8)))); }
  .opponents .player:not(.expanded) .stand-label, .opponents .player:not(.expanded) .cutstrip-live { display: none; }
  .opponents .player:not(.expanded) .stand .rk-row { min-height: 0; gap: 2px; }
  .opponents .player:not(.expanded) .stand .rack { padding: 0 2px; }
  .opponents .player:not(.expanded) .stand .rk-lip { height: 5px; border-width: 1.5px; }
  .opponents .player:not(.expanded) .stand .wire { width: auto; height: auto; }
  .opponents .player:not(.expanded) .stands.multi { padding-left: 8px; }
  .opponents .player:not(.expanded) .stands.multi::before { width: 4px; border-width: 1.5px; }
  .opponents .player:not(.expanded) .player-head { gap: 5px; flex-wrap: wrap; }

  .opponents .player:not(.expanded) .player-head { flex-wrap: nowrap; }
  .opponents .player:not(.expanded) .seat-tag { display: none; }
  .opponents .player:not(.expanded) .wire-count { margin-left: auto; font-size: 10px; padding: 1px 6px; white-space: nowrap; }
  .opponents .player:not(.expanded) .player-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  /* expanded opponent: wire width 26px, so two stands do not fill the screen */
  .opponents .player.expanded .stand { --ww: min(26px, max(9px, calc((100cqw - var(--lab) - 4px * var(--u, 8)) / var(--u, 8)))); }
  .opponents .player.expanded .stand .rk-row { min-height: 0; }
  .opponents .player.expanded .stand .wire:not(.cut) { width: auto; height: auto; }
  .opponents .player.expanded .stands { gap: 4px; }

  .me-seat .stands.multi .stand { --ww: min(17px, max(9px, calc((100cqw - var(--lab) - 4px * var(--u, 8)) / var(--u, 8)))); }
}
/* landscape phones are too short to pin anything: the dock scrolls with the page */
@media (max-width: 960px) and (max-height: 500px) {
  .bottom-dock { position: static; margin-bottom: 0; }
}

/* ===================================== P2 zoom + P6b "you hold" + P10a phone */
.hold-row, .zoom-wrap { display: none; }
@media (max-width: 699px) {
  .me-seat .hold-row { display: flex; align-items: center; gap: 6px; padding: 4px 8px 6px; }

  .zoom-sheet .stand-label { display: block; }

/* P10a on phones: one-line lobby rows, primary actions pinned to the bottom */
@media (max-width: 640px) {
  .li { flex-wrap: nowrap; }
  .li-name { flex: 1 1 auto; flex-basis: auto; font-size: 15px; }
  .li-name .pill { font-size: 10px; padding: 1px 6px; }
  .li-state { margin-left: 0; }
  .li-state .cd-label { display: none; }
  .create-dial svg, .create-dial .dial-art { width: 150px; height: auto; }

.mission-info-card { max-width: 520px; width: calc(100vw - 24px); max-height: 86dvh; overflow-y: auto; }

.seq-title { font-weight: 900; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.seq-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; min-width: 0; }
.seq-card { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 4px 4px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; line-height: 1.1; }
.seq-card b { font-size: 24px; font-family: var(--display, inherit); }
.seq-card small { font-size: 11px; font-weight: 800; text-align: center; overflow-wrap: anywhere; }
.seq-card.open { background: var(--green, #8fd694); }
.seq-card.locked { background: #d8d8de; color: #4a4c55; border-style: dashed; }
.seq-arrow { font-weight: 900; font-size: 20px; }
.seq-strip.compact { padding: 4px 6px; }
.seq-strip.compact .seq-card b { font-size: 18px; }
.seq-strip.compact .seq-card small { font-size: 10px; }
.value-btn.seq-locked { opacity: .45; border-style: dashed; cursor: not-allowed; }
