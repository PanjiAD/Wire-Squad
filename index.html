.seq-strip.special { margin-top: 6px; }
.seq-strip.special .seq-title em { font-style: normal; font-weight: 600; opacity: .75; margin-left: 4px; }
.ox-row { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ox-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #1E1F24; background: transparent; display: inline-block; opacity: .45; }
.ox-dot.full { background: #7CC8F0; opacity: 1; box-shadow: inset -2px -2px 0 rgba(30,31,36,.25); }
.timer-clock { font-family: var(--bb-font-display); font-size: 26px; font-weight: 800; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.seq-strip.timer.hurry { background: #f6c9c2; border-color: #b4321f; }
.seq-strip.timer.hurry .timer-clock { color: #b4321f; animation: timer-pulse 1s steps(2) infinite; }
@keyframes timer-pulse { 50% { opacity: .55; } }
.ox-cost { font-style: normal; font-size: 10px; font-weight: 800; margin-left: 4px; padding: 0 4px; border-radius: 8px; background: #7CC8F0; color: #1E1F24; vertical-align: super; }
.value-btn:disabled .ox-cost { opacity: .5; }
.turn-banner.open { background: #F2C230; color: #1E1F24; }
.snip-btn { width: 100%; min-height: 64px; font-size: 22px; }
.snip-target { margin: 4px; }
.open-turn .target-row { flex-wrap: wrap; }

.agent .picked { font-weight: 700; margin: 6px 0; }

.mission-card .mlock { margin-left: auto; align-self: center; color: #4a4c57; }

.name-row { display: flex; gap: 6px; align-items: stretch; }

.log-panel:not(.open) .log { display: none; }

@media (max-width: 699px) {
  .game .table { width: 100%; box-sizing: border-box; }
  .game .table-main { flex: 1 1 100%; width: 100%; }
}

/* ---------------------------------------------------------------------------
   Phone fill: one screen, no page scroll, bigger opponent racks.
   - body used 100vh (the tall viewport on Chrome Android), which made the page
     scroll by the height of the address bar. dvh is the visible height.
   - Opponent mini racks grow to use the free middle space; with two opponents
     they stack so each rack gets the full width. */
@supports (height: 100dvh) {
  body { min-height: 100dvh; }
}
@media (max-width: 699px) {
  .game .table-main { justify-content: flex-start; }
  .game .arena { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
  .game .opponents { flex: 0 0 auto; align-content: center; align-items: center; }
  .game .phone-mid { margin-top: 0; }

  .opponents .player:not(.expanded) { flex-basis: min(300px, 84vw); padding: 8px 10px; }
  .opponents .player:not(.expanded) .stand { --lab: 8px; --ww: min(20px, max(8px, calc((100cqw - var(--lab) - 2px * var(--u, 8)) / var(--u, 8)))); }
  .opponents .player:not(.expanded) .player-name { font-size: 15px; }
  .opponents .player:not(.expanded) .avatar { width: 32px; height: 32px; }
  .opponents .player:not(.expanded) .wire-count { font-size: 12px; }

  /* two opponents: stack them, full width each */
  .game .opponents[data-n="2"]:not(:has(.player.expanded)) { flex-direction: column; overflow: visible; align-items: stretch; gap: 8px; }
  .game .opponents[data-n="2"]:not(:has(.player.expanded)) .player:not(.expanded) { flex: 0 0 auto; width: 100%; box-sizing: border-box; }
  .game .opponents[data-n="2"] .player:not(.expanded) .wire-count { display: inline-flex; }
}
@media (max-width: 699px) and (max-height: 700px) {
  .opponents .player:not(.expanded) .stand { --ww: min(14px, max(7px, calc((100cqw - var(--lab) - 2px * var(--u, 8)) / var(--u, 8)))); }
}

/* Phone: rack size follows the free height (dvh), capped by the width. */
@media (max-width: 699px) {
  .game .opponents[data-n="1"] { flex-direction: column; overflow: visible; align-items: stretch; }
  .game .opponents[data-n="1"] .player:not(.expanded) { flex: 0 0 auto; width: 100%; box-sizing: border-box; }
  .game .opponents[data-n="1"] .player:not(.expanded) .stand {
    --ww: min(clamp(14px, calc((100dvh - 650px) / 6.4), 38px), max(8px, calc((100cqw - var(--lab) - 2px * var(--u, 8)) / var(--u, 8))));
  }
  .game .opponents[data-n="2"] .player:not(.expanded) .stand {
    --ww: min(clamp(12px, calc((100dvh - 730px) / 6.4), 26px), max(8px, calc((100cqw - var(--lab) - 2px * var(--u, 8)) / var(--u, 8))));
  }
}

@media (max-width: 699px) {

  .pb-mission { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pb-captain { display: inline-flex; align-items: center; gap: 4px; flex: none; font-weight: 700; }
  .pb-captain .crown { width: 16px; height: 16px; }
  .phone-board .dial-container { flex-direction: row; align-items: center; gap: 10px; }
  .phone-board .dial { flex: 1 1 auto; min-width: 0; }
  .phone-board .dial-track { flex-wrap: wrap; }
}
@media (max-width: 699px) and (max-height: 780px) { .phone-board .pb-head { display: none; } .phone-board { padding: 6px 10px; margin-bottom: 6px; } }
@media (max-width: 699px) and (max-height: 700px) { .phone-board { display: none; } }

@media (max-width: 699px) {
  .game .opponents .player.cleared .stands,

}
@media (max-width: 699px) {
  .me-seat .cutstrip-live { align-self: flex-start; align-content: flex-start; max-height: 64px; overflow: auto; }

class  IllegalAction extends Error {
  constructor(reason) {

  }
}

function  illegal(reason) {

const  clone = (value) => JSON.parse(JSON.stringify(value));

function  isOnStand(wire) {

}

function  wireValueKey(wire) {
  if (wire.kind === 'blue') return `n${wire.value}`;
  if (wire.kind === 'yellow') return 'Y';
  return 'R';
}

function  getWire(state, wireId) {
  const wire = state.wires[wireId];
  if (!wire) illegal(`unknown wire: ${wireId}`);
  return wire;
}

function  standWires(state, player, stand) {
  return state.stands[player][stand].map((id) => state.wires[id]);
}

function  handWires(state, player) {
  return state.stands[player]
    .flat()
    .map((id) => state.wires[id])
    .filter(isOnStand);
}

function  playerHasWires(state, player) {
  return handWires(state, player).length > 0;
}

function  cutBlueCount(state, value) {
  let count = 0;
  for (const wire of Object.values(state.wires)) {
    if (wire.kind === 'blue' && wire.value === value && wire.cut) count += 1;
  }
  return count;
}

// Mission 9 style ordering: Number card i+1 stays locked until enough wires of
// card i are cut. Returns the blue values that cannot be named or cut yet.
function  lockedValues(state) {
  const locked = [];
  const seq = state.sequence;
  if (seq) {
    for (let index = 1; index < seq.cards.length; index += 1) {
      const before = seq.cards[index - 1];
      if (cutBlueCount(state, before) < seq.required || locked.includes(before)) {
        locked.push(seq.cards[index]);
      }
    }
  }
  // Mission 46: the final value stays locked until every other wire is gone.
  if (state.finalValue) {
    const otherLeft = Object.values(state.wires).some(
      (wire) => isOnStand(wire) && !(wire.kind === 'blue' && wire.value === state.finalValue),
    );
    if (otherLeft) locked.push(state.finalValue);
  }
  return locked;
}

// Mission 46: a player who holds nothing but the final-value wires.
function  holdsOnlyFinal(state, player) {
  if (!state.finalValue) return false;
  const hand = handWires(state, player);
  return hand.length > 0 && hand.every(
    (wire) => wire.kind === 'blue' && wire.value === state.finalValue,
  );
}

// Mission 44: oxygen cost of cutting a value (yellow counts as 1).
function  oxygenCost(value) {
  if (value === 'yellow') return 1;
  if (value <= 4) return 1;
  if (value <= 8) return 2;
  return 3;
}

function  isLockedWire(state, wire) {
  return wire.kind === 'blue' && lockedValues(state).includes(wire.value);
}

// The player about to act holds nothing but locked blue wires (and maybe red
// ones), so no cut is possible and the bomb goes off.
function  checkStuck(state) {

  const hand = handWires(state, state.activeIndex);
  if (hand.length === 0) return false;
  const locked = lockedValues(state);
  const stuck = hand.some((wire) => wire.kind === 'blue' && locked.includes(wire.value))
    && hand.every((wire) => wire.kind === 'red' || (wire.kind === 'blue' && locked.includes(wire.value)));

  state.phase = 'lost';
  state.lossReason = 'locked';
  state.pending = null;
  logEvent(state, { type: 'lost', reason: 'locked', player: state.activeIndex });

}

function  sortStand(state, player, stand) {

    if (wa.order !== wb.order) return wa.order - wb.order;
    return a < b ? -1 : a > b ? 1 : 0;

}

function  ownsValue(state, player, value) {

    return wire.kind === 'blue' && wire.value === value;

function  ownWireForValue(state, player, value) {
  const candidates = handWires(state, player).filter((wire) => {
    if (value === 'yellow') return wire.kind === 'yellow';
    return wire.kind === 'blue' && wire.value === value;
  });
  if (candidates.length === 0) return null;
  candidates.sort((a, b) => a.order - b.order || (a.id < b.id ? -1 : 1));
  return candidates[0];
}

function  matchesValue(wire, value) {
  if (value === 'yellow') return wire.kind === 'yellow';
  return wire.kind === 'blue' && wire.value === value;

function  logEvent(state, entry) {

    && !token.improvised
    && (state.wires[token.wireId].cut || state.wires[token.wireId].revealed)

  if (index === -1) return false;
  const [token] = state.tokens.splice(index, 1);
  const wire = state.wires[token.wireId];
  wire.info = wire.info.filter((id) => id !== token.id);
  return true;

// Places an Info token on a wire. Kind is derived from the wire unless forced.
// When the supply is empty, a token already sitting on a cut/revealed wire is

function  placeInfoToken(state, wireId, owner, forcedKind = null) {
  const wire = getWire(state, wireId);
  if (!isOnStand(wire)) illegal('cannot mark a wire that is already gone');
  const kind = forcedKind || (wire.kind === 'yellow' ? 'yellow' : 'number');
  if (kind === 'number' && wire.kind !== 'blue') illegal('number tokens only mark blue wires');

  let improvised = false;
  if (kind === 'yellow') {
    if (state.infoSupply.yellow > 0) state.infoSupply.yellow -= 1;
    else if (!reclaimToken(state, 'yellow', null)) improvised = true;
  } else {
    const value = wire.value;
    if (state.infoSupply[value] > 0) state.infoSupply[value] -= 1;
    else if (!reclaimToken(state, 'number', value)) improvised = true;
  }

  const id = `t${String(state.counters.token).padStart(3, '0')}`;
  state.counters.token += 1;
  const token = {
    id,
    kind,
    value: kind === 'yellow' ? null : wire.value,
    wireId: wire.id,
    owner,
    improvised,
  };
  state.tokens.push(token);
  wire.info.push(id);
  return token;
}

function  refreshUnlocks(state) {
  for (const card of state.equipment) {
    if (card.used) continue;
    const needs = card.tape ? [card.number, card.tape] : [card.number];
    if (!card.usable && needs.every((value) => cutBlueCount(state, value) >= EQUIP_UNLOCK_AT)) {
      card.usable = true;
      logEvent(state, { type: 'equipmentUnlocked', card: card.number });
    }
  }
  for (let value = 1; value <= 12; value += 1) {
    if (cutBlueCount(state, value) >= VALIDATION_AT && !state.validation.includes(value)) {
      state.validation.push(value);
      state.validation.sort((a, b) => a - b);
      logEvent(state, { type: 'validation', value });
    }
  }

function  cutWire(state, wireId) {
  const wire = getWire(state, wireId);
  if (!isOnStand(wire)) illegal('wire is already gone');
  wire.cut = true;
  refreshUnlocks(state);
}

function  advanceDial(state, steps = 1) {
  state.dial.zone = Math.min(DIAL.zoneCount, state.dial.zone + steps);
  if (state.dial.zone >= state.dial.skullAt) {
    state.phase = 'lost';
    state.lossReason = 'dial';
    state.pending = null;
    return true;
  }
  return false;

function  checkWin(state) {

  const allGone = Object.values(state.wires).every((wire) => wire.cut || wire.revealed);
  if (allGone) {
    state.phase = 'won';
    state.pending = null;
    logEvent(state, { type: 'won' });
    return true;
  }

    const others = [];
    for (let seat = 0; seat < count; seat += 1) {
      if (seat !== state.activeIndex && playerHasWires(state, seat)) others.push(seat);
    }
    if (others.length > 0) {
      state.lastActive = state.activeIndex;
      state.openTurn = true;
      logEvent(state, { type: 'turnOpen', after: state.activeIndex });
      return;
    }
    if (playerHasWires(state, state.activeIndex)) {
      logEvent(state, { type: 'turn', player: state.activeIndex });
      return;
    }
    checkWin(state);
    return;
  }

  for (let step = 1; step <= count; step += 1) {
    const player = (state.activeIndex + step) % count;
    if (playerHasWires(state, player)) {

      // Mission 44: the Captain's turn hands every Oxygen token back.
      if (state.oxygen && player === state.captainIndex) {

function normalizePlayers(input) {
  if (Number.isInteger(input)) {
    if (input < MIN_PLAYERS || input > MAX_PLAYERS) {
      throw new Error(`player count must be between ${MIN_PLAYERS} and ${MAX_PLAYERS}`);
    }
    return Array.from({ length: input }, (_, index) => ({
      id: `p${index}`,
      name: `Player ${index + 1}`,
      characterId: index === 0 ? 'captain' : null,
    }));
  }
  if (Array.isArray(input) && input.length > 0) {
    if (input.length < MIN_PLAYERS || input.length > MAX_PLAYERS) {
      throw new Error(`player count must be between ${MIN_PLAYERS} and ${MAX_PLAYERS}`);
    }
    const seen = new Set();
    return input.map((player, index) => {
      const id = String(player.id || `p${index}`);
      if (seen.has(id)) throw new Error(`duplicate player id: ${id}`);
      seen.add(id);
      return {
        id,
        name: String(player.name || `Player ${index + 1}`),
        characterId: player.characterId || (index === 0 ? 'captain' : null),
      };
    });
  }
  throw new Error('players must be a count or an array of players');
}

function range(from, to) {
  const out = [];
  for (let value = from; value <= to; value += 1) out.push(value);
  return out;
}

function blueValuesFor(setup) {
  if (setup.blue.values === 'all') return range(1, 12);
  const [from, to] = setup.blue.values;
  return range(from, to);
}

function standCountFor(playerCount, seat, captainIndex) {
  if (playerCount === 2) return 2;
  if (playerCount === 3) return seat === captainIndex ? 2 : 1;
  return 1;
}

// Draws yellow/red values and returns both the values that actually enter the
// game and the markers the board shows. "X out of Y" marks every candidate
// with the question side up and discards the unused ones unseen.
function drawColour(rng, spec) {
  const count = spec.count || 0;
  if (count === 0) return { values: [], markers: [] };

  if (spec.hiddenDraw) {
    const candidates = spec.candidates;
    if (!Number.isInteger(candidates) || candidates < count) {
      throw new Error('hiddenDraw needs candidates >= count');
    }
    const pool = range(1, 11);
    rng.shuffle(pool);
    const marked = pool.slice(0, candidates).sort((a, b) => a - b);
    const kept = rng.sample(marked, count).sort((a, b) => a - b);
    return {
      values: kept,
      markers: marked.map((value) => ({ value, hidden: true })),
    };
  }

  const [from, to] = spec.valueRange || [1, 11];
  const pool = range(from, to);
  if (count > pool.length) throw new Error('not enough colour values to draw');
  rng.shuffle(pool);
  const values = pool.slice(0, count).sort((a, b) => a - b);
  return {
    values,
    markers: values.map((value) => ({ value, hidden: false })),
  };
}

function splitInto(list, parts) {
  const out = [];
  const base = Math.floor(list.length / parts);
  const extra = list.length % parts;
  let cursor = 0;
  for (let index = 0; index < parts; index += 1) {
    const size = base + (index < extra ? 1 : 0);
    out.push(list.slice(cursor, cursor + size));
    cursor += size;
  }
  return out;
}

function dealEquipment(state, setup, rng) {
  if (setup.equipment === 'none') return [];
  const banned = new Set(setup.reroll || []);
  const pool = EQUIPMENT_CARDS.filter((card) => !banned.has(card.number));
  rng.shuffle(pool);
  return pool.slice(0, state.playerCount).map((card) => ({
    number: card.number,
    id: card.id,
    name: card.name,
    timing: card.timing,
    effect: card.effect,
    text: card.text,
    usable: false,
    used: false,
  }));
}

function  newGame(options = {}) {
  const players = normalizePlayers(options.players);
  const playerCount = players.length;
  const mission = getMission(options.missionId);
  const setup = resolveSetup(mission, playerCount);
  const seed = Number.isFinite(options.seed) ? Number(options.seed) >>> 0 : 1;
  const captainIndex = Number.isInteger(options.captainIndex) ? options.captainIndex : 0;
  if (captainIndex < 0 || captainIndex >= playerCount) {
    throw new Error('captainIndex is out of range');

  const rng = createRng(seed);

  const yellow = drawColour(rng, setup.yellow || { count: 0 });
  const red = drawColour(rng, setup.red || { count: 0 });

  // Number cards come last so earlier missions keep their exact seeded deals.
  let sequence = null;
  if (mission.sequence) {
    const deck = range(1, 12);
    rng.shuffle(deck);
    sequence = {
      cards: deck.slice(0, mission.sequence.cards),
      required: mission.sequence.required,
