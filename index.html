<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wire Squad - local demo</title>
<style>
:root {
  /* P0 design tokens */
  --bb-wire-blue: #2f6fb5;
  --bb-wire-yellow: #f2c230;
  --bb-wire-red: #d7263d;
  --bb-ink: #1e1f24;
  --bb-desk: #9fb4c2;
  --bb-equip: #f28c28;
  --bb-valid: #3fbf5e;
  --bb-cream: #f6f1e7;
  --bb-purple: #6b3fa0;
  --bb-outline: 3px;
  --bb-shadow-offset: 4px;
  --bb-r-sm: 6px;
  --bb-r-md: 12px;
  --bb-r-lg: 20px;
  --bb-dur-1: 120ms;
  --bb-dur-2: 220ms;
  --bb-dur-3: 380ms;
  --bb-ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --bb-ease-snap: cubic-bezier(0.34, 1.56, 0.64, 1);
  --bb-font-display: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;

  /* App aliases kept so the existing UI and tests do not change. */
  --ink: var(--bb-ink);
  --cream: var(--bb-cream);
  --paper: #fffdf7;
  --desk: var(--bb-desk);
  --blue: var(--bb-wire-blue);
  --yellow: var(--bb-wire-yellow);
  --red: var(--bb-wire-red);
  --orange: var(--bb-equip);
  --green: var(--bb-valid);
  --purple: var(--bb-purple);
  --muted: #62656f;
  --line: var(--bb-outline) solid var(--ink);
  --shadow: var(--bb-shadow-offset) var(--bb-shadow-offset) 0 var(--ink);
  --radius: var(--bb-r-md);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background-color: var(--desk);
  background-image: radial-gradient(rgba(30, 31, 36, 0.12) 1.2px, transparent 1.5px);
  background-size: 9px 9px;
  color: var(--ink);
  font: 14px/1.45 system-ui, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}

button { font: inherit; color: inherit; }

h2, h3, h4 { margin: 0 0 8px; }

h2 { font-size: 26px; letter-spacing: 0.01em; text-transform: uppercase; }
h3 { font-size: 16px; text-transform: uppercase; letter-spacing: 0.05em; }
h4 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; margin-top: 14px; }

.muted { color: var(--muted); }
.small { font-size: 12px; }

.panel {
  background: var(--paper);
  border: var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

/* ---------------------------------------------------------------- buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 18px;
  border: var(--line);
  border-radius: 10px;
  background: var(--yellow);
  color: var(--ink);
  font-weight: 800;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.06s ease, box-shadow 0.06s ease;
}

.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled, .btn.off { background: #d9d6cc; color: #6b6d76; box-shadow: none; cursor: not-allowed; }
.btn.ghost { background: var(--paper); }
.btn.danger { background: var(--red); color: #fff; }
.btn.big { min-height: 52px; font-size: 17px; width: 100%; margin-top: 18px; }
.btn.small { min-height: 32px; padding: 0 12px; font-size: 12px; box-shadow: 2px 2px 0 var(--ink); }
.btn:disabled { box-shadow: none; }

.choice, .target-btn, .value-btn, .toggle, .crew-btn {
  border: 2px solid var(--ink);
  border-radius: 9px;
  background: var(--paper);
  cursor: pointer;
  padding: 7px 10px;
  font-weight: 700;
  box-shadow: 2px 2px 0 var(--ink);
  transition: background 0.08s ease, transform 0.06s ease;
}

.choice:hover, .target-btn:hover, .value-btn:hover, .toggle:hover, .crew-btn:hover { background: #fff4c9; }
.choice:active, .target-btn:active, .value-btn:active, .toggle:active, .crew-btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.selected { background: var(--yellow) !important; }
button:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

/* ------------------------------------------------------------------ setup */

.setup { min-height: 100vh; display: flex; flex-direction: column; }

.hero {
  background: var(--ink);
  color: var(--cream);
  border-bottom: 6px solid var(--yellow);
  padding: 22px clamp(16px, 4vw, 48px);
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}

.brand-mark { display: flex; flex-direction: column; gap: 2px; }
.logo { font: 400 34px/1 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
.logo-sub { font-size: 12px; color: #ddd6c6; letter-spacing: 0.06em; text-transform: uppercase; }
.hero-note { max-width: 420px; margin: 0; font-size: 12px; color: #d8d2c3; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.setup-main {
  display: grid;
  grid-template-columns: minmax(0, 1.8fr) minmax(260px, 1fr);
  gap: 20px;
  padding: 22px clamp(16px, 4vw, 48px) 48px;
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  align-items: start;
}

.section-title { margin: 20px 0 8px; color: var(--muted); letter-spacing: 0.08em; }

.mission-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }

.mission-card {
  position: relative;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  text-align: left;
  padding: 10px;
  border: 2px solid var(--ink);
  border-radius: 10px;
  background: var(--cream);
  cursor: pointer;
  box-shadow: 2px 2px 0 var(--ink);
}
.mission-card:hover { background: #fff6d8; }
.mission-card.selected { background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); }
.mission-no {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  height: 30px;
  border: 2px solid var(--ink);
  border-radius: 999px;
  background: var(--ink);
  color: var(--cream);
  font-weight: 800;
}
.mission-card.selected .mission-no { background: var(--red); }
.mission-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mission-body strong { font-size: 13px; }
.mission-lesson { font-size: 11px; color: #3a3c45; }
.mission-meta { font-size: 10px; color: var(--muted); }
.flag {
  position: absolute;
  top: 6px;
  right: 8px;
  width: 18px;
  height: 18px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--orange);
  border: 2px solid var(--ink);
  font-size: 11px;
  font-weight: 800;
}

.crew-row { display: flex; gap: 8px; flex-wrap: wrap; }
.crew-btn { min-width: 72px; display: flex; flex-direction: column; align-items: center; font-size: 20px; line-height: 1.1; padding: 6px 10px; }
.crew-btn span { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }

.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 14px; }
.name-field { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.name-field input {
  border: 2px solid var(--ink);
  border-radius: 8px;
  background: var(--paper);
  padding: 8px 10px;
  font: 700 15px system-ui, sans-serif;
  color: var(--ink);
}

.setup-help { position: sticky; top: 16px; }
.mission-help-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.rules { margin: 8px 0; padding-left: 18px; }
.rules li { margin-bottom: 4px; font-size: 12px; }

/* ------------------------------------------------------------------- game */

.topbar {
  background: var(--ink);
  color: var(--cream);
  border-bottom: 6px solid var(--yellow);
  padding: 10px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.topbar-brand { display: flex; align-items: baseline; gap: 10px; }
.topbar-brand .logo { font-size: 24px; }
.topbar-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
.topbar-chips span { background: #2c2e36; border-radius: 999px; padding: 3px 9px; }
.topbar-chips .chip-strong { background: var(--yellow); color: var(--ink); font-weight: 800; }
.topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

.dial-container {
  display: flex;
  align-items: center;
  gap: 10px;
}
.dial-svg-box {
  flex: 0 0 68px;
  width: 68px;
  height: 68px;
  line-height: 0;
}
.dial-svg-box svg {
  width: 100%;
  height: 100%;
  display: block;
}
.bb-needle {
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.dial { display: flex; flex-direction: column; gap: 3px; min-width: 210px; }
.dial-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #c9c3b4; }
.dial-track { display: flex; gap: 3px; }
.dial-cell {
  width: 28px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid #000;
  border-radius: 6px;
  background: #3a3d47;
  color: #cfc9bb;
  font-weight: 800;
  font-size: 12px;
}
.dial-cell.passed { background: #6d3a44; }
.dial-cell.now { background: var(--yellow); color: var(--ink); transform: translateY(-2px); box-shadow: 0 0 0 2px var(--cream); }
.dial-cell.skull { background: var(--red); color: #fff; min-width: 46px; font-size: 9px; letter-spacing: 0.04em; }
.dial-cell.skull.now { background: var(--red); box-shadow: 0 0 0 2px var(--cream); }
.dial-cell.special { background: var(--purple); color: #fff; min-width: 46px; font-size: 8px; letter-spacing: 0.03em; }
.dial-start { font-size: 10px; color: #c9c3b4; }

.statusbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  align-items: flex-start;
  justify-content: space-between;
  padding: 8px 16px;
}
.supply, .valid { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.supply-title, .valid-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: #37424a; }
.supply-chips { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.supply-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 6px;
  padding: 2px 4px;
  font-weight: 800;
  font-size: 11px;
  box-shadow: 1px 1px 0 var(--ink);
}
.supply-token-art { display: flex; align-items: center; line-height: 0; }
.supply-count { font-size: 11px; color: var(--ink); }
.supply-chip.empty { opacity: 0.35; }
.supply-chip.yellow { background: var(--yellow); }

.valid-tokens { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.valid-token-badge {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  background: rgba(63, 191, 94, 0.2);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 1px 6px 1px 2px;
  box-shadow: 1px 1px 0 var(--ink);
}
.valid-badge-val { font-weight: 800; font-size: 12px; color: var(--ink); }
.valid-chip {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--green);
  border: 2px solid var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 11px;
}

.board {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 370px;
  gap: 14px;
  padding: 4px 16px 24px;
  align-items: start;
}
.players { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px; }

.player {
  background: var(--paper);
  border: var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 10px;
  min-width: 0;
}
.player.is-active { outline: 4px solid var(--yellow); outline-offset: -1px; }
.player.is-target { outline: 4px dashed var(--orange); outline-offset: -1px; }
.player-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.seat-tag {
  background: var(--ink);
  color: var(--cream);
  border-radius: 6px;
  padding: 1px 6px;
  font-size: 11px;
  font-weight: 800;
}
.player-name { font-size: 15px; }
.wire-count {
  margin-left: auto;
  background: var(--cream);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 0 8px;
  font-size: 11px;
  font-weight: 800;
}
.personal-pill { font-size: 9px; font-weight: 800; letter-spacing: 0.04em; background: #efe9dc; border-radius: 999px; padding: 1px 6px; color: var(--muted); }
.personal-pill.spent { background: #eadfe0; color: #8a4650; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }
.badges:empty { display: none; }
.badge { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; border: 2px solid var(--ink); border-radius: 999px; padding: 0 7px; }
.badge.captain { background: var(--yellow); }
.badge.active { background: var(--green); }
.badge.badge-setup { background: var(--orange); }
.badge.pending { background: var(--red); color: #fff; }

.stands { display: flex; flex-direction: column; gap: 10px; }
.stand {
  display: flex;
  gap: 8px;
  align-items: center;
}
.stand-label {
  flex: 0 0 48px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
  align-self: center;
}
.empty { color: var(--muted); font-size: 12px; align-self: center; padding: 20px; }

.stand .rack {
  --bb-tile-w: 32px;
  display: inline-block;
  position: relative;
  padding: 0 8px;
  max-width: 100%;
}
.stand .rk-row {
  display: flex;
  gap: 4px;
  align-items: flex-end;
  min-height: 124px;
  padding-bottom: 2px;
  overflow-x: auto;
  overflow-y: visible;
}
.stand .rk-lip {
  position: relative;
  height: 12px;
  margin-top: -3px;
  background: var(--ink);
  border: 2.5px solid #0b0b0e;
  border-radius: 4px 4px 10px 10px;
  box-shadow: 2px 2px 0 rgba(30, 31, 36, 0.35);
}
.stand .rk-lip:before {
  content: '';
  position: absolute;
  left: 6px;
  right: 6px;
  top: 2px;
  height: 2px;
  border-radius: 2px;
  background: #3d3f4a;
}

.wire {
  position: relative;
  border: none;
  background: transparent;
  padding: 0;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  cursor: pointer;
  transition: transform 0.08s ease, filter 0.08s ease;
  vertical-align: bottom;
  outline: none;
}
.wire .wire-art {
  display: block;
  line-height: 0;
}
.wire .wire-art svg {
  display: block;
}

/* Fit every stand inside its player card. The card is a size container; --u
   (set in app.js) is the number of tile slots on the stand. 72px covers the
   stand label and rack padding, 4px is the gap between tiles. */
.player { container-type: inline-size; }
.stand { min-width: 0; }
.stand .rack { min-width: 0; }
.stand {
  --lab: 72px;
  --ww: min(39.1px, max(9px, calc((100cqw - var(--lab) - 4px * var(--u, 8)) / var(--u, 8))));
}
/* Narrow cards put the stand label above the rack to win back its width. */
@container (max-width: 440px) {
  .stand { --lab: 28px; flex-direction: column; align-items: flex-start; gap: 2px; }
}
.stand .wire:not(.cut) .wire-art svg { width: var(--ww); height: auto; }
.stand .wire.cut .wire-art svg { width: calc(var(--ww) * 1.45); height: auto; }
.wire:hover:not(:disabled) {
  transform: translateY(-4px);
}
.wire.selected .wire-art svg {
  filter: drop-shadow(0 0 6px rgba(63, 191, 94, 0.9));
}
.wire.candidate .wire-art svg {
  filter: drop-shadow(0 0 6px rgba(242, 140, 40, 0.9));
  animation: pulse 1s ease-in-out infinite;
}
.wire.pickable .wire-art svg {
  filter: drop-shadow(0 0 4px rgba(242, 140, 40, 0.7));
}
.wire.unavailable {
  opacity: 0.35;
  filter: grayscale(0.8);
  cursor: not-allowed;
}
.wire.markable .wire-art svg {
  filter: drop-shadow(0 0 4px rgba(185, 179, 165, 0.7));
}
.wire.inspected .wire-art svg {
  filter: drop-shadow(0 0 5px var(--ink));
}
.wire.cut {
  opacity: 0.72;
}

.wire-tokens {
  position: absolute;
  bottom: -14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 2px;
  z-index: 3;
  pointer-events: none;
}
.wire-token-chip svg {
  filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35));
}

.label-chip {
  align-self: center;
  min-width: 18px;
  height: 18px;
  border-radius: 999px;
  background: var(--paper);
  border: 2px solid var(--ink);
  color: var(--ink);
  font: 800 10px/1 system-ui, sans-serif;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 1px 1px 0 var(--ink);
}
.label-chip.eq { background: var(--blue); color: #fff; }

@keyframes pulse {
  0%, 100% { outline-color: var(--orange); }
  50% { outline-color: rgba(242, 140, 40, 0.25); }
}

/* --------------------------------------------------------------- actions */

.action-panel { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow: auto; }
.action-panel.draft { overflow: hidden; }
.draft-scroll { display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto; min-height: 0; overflow: auto; }
.action-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.action-head h3 { margin: 0; }
.pill { font-size: 11px; font-weight: 700; background: var(--cream); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 9px; }
.action-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.setup-callout { background: #fdeccb; border: 2px solid var(--ink); border-radius: 9px; padding: 8px 10px; font-weight: 700; font-size: 13px; }
.setup-callout.pending { background: #f8d9dd; }
.armed { background: #dff7e3; border: 2px solid var(--ink); border-radius: 9px; padding: 6px 10px; font-weight: 700; margin: 0; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
.choice-main { font-size: 12px; }
.choice-sub { font-size: 10px; font-weight: 500; color: var(--muted); }
.choice.tiny { padding: 4px 7px; box-shadow: 1px 1px 0 var(--ink); }
.choice.tiny .choice-main { font-size: 10px; }
.target-row, .value-row, .toggle-row { display: flex; flex-wrap: wrap; gap: 6px; }
.value-btn { min-width: 40px; font-size: 15px; }
.value-btn.yellow { background: var(--yellow); }
.toggle { font-size: 11px; }
.toggle.on { background: var(--green); }
.draft-steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: flex; gap: 8px; align-items: flex-start; }
.step-no { flex: 0 0 20px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--cream); font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; margin-top: 1px; }
.step > div { min-width: 0; }
.picked { margin: 3px 0 0; font-size: 11px; font-weight: 700; color: #37424a; min-height: 14px; }
.draft-actions { display: flex; justify-content: space-between; gap: 8px; flex: 0 0 auto; margin-top: 0; padding-top: 8px; border-top: 2px solid var(--ink); background: var(--paper); }
.confirm-box { display: flex; flex-direction: column; gap: 6px; background: #fdeccb; border: 2px solid var(--ink); border-radius: 9px; padding: 8px 10px; }
.confirm-box p { margin: 0; font-size: 12px; }
.error-box { background: #f8d9dd; border: 2px solid var(--red); border-radius: 9px; padding: 7px 10px; font-size: 12px; }

.equip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.equip-card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
  border: 2px solid var(--ink);
  border-radius: 8px;
  background: #efe9dc;
  padding: 4px 8px;
  cursor: pointer;
  min-width: 90px;
  box-shadow: 2px 2px 0 var(--ink);
}
.equip-card.ready { background: var(--orange); color: #fff; }
.equip-card.used { opacity: 0.45; text-decoration: line-through; }
.equip-no { font-size: 9px; font-weight: 800; }
.equip-name { font-size: 11px; font-weight: 700; }
.equip-state { font-size: 9px; text-transform: uppercase; letter-spacing: 0.05em; }

.dev { margin-top: 6px; }
.dev summary { cursor: pointer; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.dev-list { max-height: 180px; overflow: auto; }

/* ------------------------------------------------------------------- log */

.log-panel { max-height: 30vh; overflow: auto; }
.log-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.log-head h3 { margin: 0; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.log li { font-size: 11px; padding-bottom: 3px; border-bottom: 1px dashed #ddd6c6; }
.log-lost { color: var(--red); font-weight: 700; }
.log-won { color: #1d7c36; font-weight: 700; }

/* ------------------------------------------------------------ modal/overlay */

.modal, .overlay {
  position: fixed;
  inset: 0;
  background: rgba(30, 31, 36, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px;
  z-index: 40;
}
.modal-card {
  width: min(560px, 100%);
  max-height: 86vh;
  overflow: auto;
  background: var(--paper);
  border: var(--line);
  border-radius: var(--radius);

  padding: 18px;
}
.modal-card.modal-card-equip {
  width: min(720px, 100%);
}
.equip-sheet-layout {
  display: flex;

  margin-top: 10px;
}
.equip-sheet-card-preview {
  flex: 0 0 210px;
}
.equip-sheet-card-preview .eqc {

}
.equip-sheet-panel {
  flex: 1;
