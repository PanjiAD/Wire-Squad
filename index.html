  const sizes = ['S', 'M', 'L'].map((size) => `<button class="size-btn${UI.settings.textSize === size ? ' on' : ''}" data-act="set-text" data-v="${size}">${size}</button>`).join('');
  return `
    <div class="modal" data-act="settings-close">
      <div class="modal-card settings-card" data-act="noop">
        <div class="sheet-head"><h3>${esc(t('settings'))}</h3><button class="btn small ghost" data-act="settings-close" aria-label="${esc(t('close'))}">X</button></div>
        <div class="set-row"><span>${esc(t('reducedMotion'))}</span>
          <button class="switch${UI.settings.reducedMotion ? ' on' : ''}" data-act="set-motion" role="switch" aria-checked="${UI.settings.reducedMotion ? 'true' : 'false'}"><i></i></button></div>
        <div class="set-row"><span>${esc(t('textSize'))}</span><span class="size-row">${sizes}</span></div>
        <div class="set-row"><span>${esc(t('colorblindSetting'))}<small class="set-sub">${esc(t('colorblindHint'))}</small></span>
          <button class="switch${UI.settings.colorblind ? ' on' : ''}" data-act="set-colorblind" role="switch" aria-checked="${UI.settings.colorblind ? 'true' : 'false'}"><i></i></button></div>
        <div class="set-row"><span>${esc(t('orderHintSetting'))}<small class="set-sub">${esc(t('orderHintHint'))}</small></span>
          <button class="switch${UI.settings.orderHint !== false ? ' on' : ''}" data-act="set-ordhint" role="switch" aria-checked="${UI.settings.orderHint !== false ? 'true' : 'false'}"><i></i></button></div>
      </div>
    </div>`;
}

function rulesSheet(view) {
  if (!UI.rulesOpen) return '';
  return `
    <div class="modal" data-act="rules-close">
      <div class="modal-card settings-card" data-act="noop">
        <div class="sheet-head"><h3>${esc(t('missionRules'))}</h3><button class="btn small ghost" data-act="rules-close" aria-label="${esc(t('close'))}">X</button></div>
        <div class="mission-rules-card">
          ${(() => {
            const mission = MISSIONS.find((candidate) => candidate.id === view.missionId);
            if (!mission) return selectedMissionHelp(view.missionId);
            const back = UI.cardSide !== 'front';
            return `<div class="mc-scale card-pop">${back ? artMissionCardBack(mission) : artMissionCard(mission)}</div>
              <button class="btn small" data-act="card-flip">${esc(t(back ? 'cardShowSetup' : 'cardShowRules'))}</button>`;
          })()}
        </div>
      </div>
    </div>`;
}

const SEAT_MASCOTS = [['Ollie', 'owl'], ['Fenn', 'fox'], ['Otta', 'otter'], ['Hedda', 'hedgehog'], ['Gus', 'goat']];

function characterSheet(view) {
  if (UI.charSeat === null || !view.players[UI.charSeat]) return '';
  const seat = UI.charSeat;
  const player = view.players[seat];
  const [mascot, animal] = SEAT_MASCOTS[seat % 5];
  const captain = seat === UI.state.captainIndex;
  const used = player.personal.used;
  const item = PERSONAL_ITEM_TEXT[player.personal.id] || '';
  return `
    <div class="modal" data-act="char-close">
      <div class="char-wrap" data-act="noop">
        <article class="char-card${used ? ' used' : ''}${captain ? ' captain' : ''}">
          <div class="char-art">${artCharacter(animal, 190)}</div>
          <div class="char-ribbon">${esc(player.name)}</div>
          ${captain ? `<span class="char-captain">${CROWN} ${esc(t('captain'))}</span>` : ''}
          <div class="char-item">
            <small>${esc(t('personalEquipment'))}</small>
            <strong>${esc(player.personal.name)}</strong>
            ${used ? `<span class="char-used">${esc(t('spent'))}</span>` : ''}
          </div>
        </article>
        <p class="char-text"><b>${esc(mascot)}</b>, ${esc(animal)}. ${esc(item)}</p>
        <button class="btn" data-act="char-close">${esc(t('close'))}</button>
      </div>
    </div>`;
}

// Seat shown at the bottom ("you"). Online it is the viewer's own seat. In
// hotseat every hand is open and the layout must not jump between turns, so
// seat 0 stays at the bottom.
function meSeat(view) {
  const seat = view.players.findIndex((player) => player.id === view.you);
  return seat >= 0 ? seat : 0;
}

function turnBanner(view) {
  const state = UI.state;
  let actorId;
  let key;
  if (state.phase === 'setup' && state.setupSeat !== null) {
    actorId = state.players[state.setupSeat].id;
    key = 'setup';
  } else if (state.phase !== 'playing') {
    return '';
  } else if (state.openTurn) {
    return `<div class="turn-banner mine open">${esc(t('turnOpenBanner'))}</div>`;
  } else {
    actorId = state.pending ? view.pending.actorId : state.players[state.activeIndex].id;
    key = 'play';
  }
  const mine = actorId === view.you;
  const name = playerName(view, actorId);
  const text = mine
    ? (key === 'setup' ? t('setupTurn', { name }) : 'YOUR TURN')
    : (key === 'setup' ? t('setupWaiting', { name }) : `${name}'s turn`);
  return `<div class="turn-banner${mine ? ' mine' : ''}">${esc(text)}</div>`;
}

function boardSlots(view) {
  const slots = [];
  for (let index = 0; index < 5; index += 1) {
    const card = view.equipment[index];
    if (!card) {
      const beyond = index + 1 > view.playerCount;
      slots.push(`<span class="eq-slot empty${beyond ? ' beyond' : ''}" title="${esc(beyond ? t('slotBeyond', { count: index + 1 }) : t('slotEmpty'))}">${beyond ? `<i class="eq-pip">${index + 1}</i>` : ''}</span>`);
      continue;
    }
    const state = card.used ? 'used' : card.usable ? 'unlocked' : 'locked';
    const status = card.used ? t('used') : card.usable ? t('ready') : t('locked');
    slots.push(`<button class="eq-slot ${state}" data-act="equip" data-card="${card.number}" title="${esc(card.name)} - ${esc(status)}">
      <span class="eq-art">${artEquipment(card.number, 60)}</span>
      <span class="eq-no">#${card.number}</span>
      ${card.tape ? `<span class="eq-tape" title="${esc(t('tapeNeeds', { n: card.tape }))}">${card.tape}</span>` : ''}
      <span class="eq-flag" aria-hidden="true">${state === 'unlocked' ? '\u2713' : state === 'locked' ? '\u2715' : ''}</span>
    </button>`);
  }
  return `<div class="eq-slots" aria-label="${esc(t('equipment'))}">${slots.join('')}</div>`;
}

function boardTrack(view) {
  const yellow = (view.markers && view.markers.yellow) || [];
  const red = (view.markers && view.markers.red) || [];
  const cells = [];
  for (let value = 1; value <= 12; value += 1) {
    const done = view.validation.includes(value);
    const marks = [];
    yellow.filter((marker) => marker.value === value).forEach((marker) => {
      marks.push(`<i class="tk-mark yellow">${artMarker('yellow', marker.hidden, 22)}</i>`);
    });
    red.filter((marker) => marker.value === value).forEach((marker) => {
      marks.push(`<i class="tk-mark red">${artMarker('red', marker.hidden, 22)}</i>`);
    });
    cells.push(`<span class="tk-cell${done ? ' done' : ''}" title="${esc(t('validation'))} ${value}">
      <b>${value}</b>${marks.join('')}${done ? '<em class="tk-check">\u2713</em>' : ''}
    </span>`);
  }
  return `<div class="board-track" aria-label="${esc(t('track'))}">${cells.join('')}</div>`;
}

function boardCenter(view) {
  const danger = view.dial.zone >= view.dial.skullAt - 1 && view.phase === 'playing';
  const captain = view.players.find((player) => player.id === view.captainId);
  return `
    <section class="board-center${danger ? ' danger' : ''}" aria-label="Board">
      <div class="board-captain">${CROWN}<span>${esc(t('captain'))}: <b>${esc(captain ? captain.name : '')}</b></span></div>
      ${view.equipment.length ? `<div class="board-slots-row">${boardSlots(view)}</div>` : ''}
      ${boardTrack(view)}
      <div class="board-col">
        ${sequenceStrip(view)}
        ${missionStrip(view)}
        ${supplyStrip(view)}
        ${validationStrip(view)}
      </div>
      <div class="board-col board-dial">
        <div class="board-mission" data-act="rules-open">
          <b>#${view.missionId}</b> ${esc(view.mission.title)}
          <small>${esc(missionSummary(view.mission))}</small>
        </div>
        <div class="board-mission-card" data-act="rules-open" role="button" tabindex="0" aria-label="${esc(t('missionRules'))}">
          <div class="mc-scale compact">${artMissionCardBack(MISSIONS.find((candidate) => candidate.id === view.missionId))}</div>
        </div>
        ${dialTrack(view, 104)}
      </div>
    </section>`;
}

function curtainNeeded(view) {
  return !isOnline()
    && (UI.state.phase === 'setup' || UI.state.phase === 'playing')
    && UI.ackViewer !== view.you;
}

function curtainScreen(view) {
  const state = UI.state;
  const seat = meSeat(view);
  const name = view.players[seat].name;
  const why = state.phase === 'setup'
    ? t('curtainSetup')
    : state.pending
      ? t('curtainPending')
      : t('curtainTurn');
  return `
    <div class="game curtain">
      <div class="curtain-card">
        <span class="avatar xl" style="--av:${SEAT_COLORS[seat % 5]}">${artCharacter(SEAT_AVATARS[seat % 5], 90)}</span>
        <h2>${esc(t('curtainTitle', { name }))}</h2>
        <p class="curtain-why">${esc(why)}</p>
        <p class="muted">${esc(t('curtainHint', { name }))}</p>
        <button class="btn big primary" data-act="ack-viewer">${esc(t('curtainButton', { name }))}</button>
      </div>
      ${settingsSheet()}
    </div>`;
}

function setupDealScreen(view) {
  const state = UI.state;
  const seat = state.setupSeat;
  const actor = view.players[seat];
  const mine = canSetup(view);
  const meSeatIndex = isOnline() ? meSeat(view) : seat;
  const stageSeat = mine ? seat : meSeatIndex;
  const pickWire = UI.setupPick ? state.wires[UI.setupPick] : null;
  const pick = pickWire && pickWire.owner === seat && state.phase === 'setup' ? pickWire : null;
  const order = [];
  for (let step = 0; step < view.players.length; step += 1) order.push((state.captainIndex + step) % view.players.length);
  const chips = order.map((index) => {
    const player = view.players[index];
    const placed = view.tokens.some((token) => token.owner === player.id && token.kind === 'number');
    return `<span class="deal-chip${index === seat ? ' active' : ''}${placed ? ' done' : ''}">
      <span class="avatar sm" style="--av:${SEAT_COLORS[index % 5]}">${artCharacter(SEAT_AVATARS[index % 5], 22)}</span>
      ${esc(player.name)}${placed ? ' &#10003;' : ''}</span>`;
  }).join('');
  const tray = pick
    ? `<span class="deal-token">${artInfoToken(pick.value, 56)}</span><span>${esc(t('infoSupply'))} ${esc(valueLabel(pick.value))}</span>`
    : `<span class="muted">${esc(mine ? t('setupHint') : t('setupWaiting', { name: actor.name }))}</span>`;
  return `
    <div class="game setup-deal">
      ${phoneBar(view)}
      <header class="topbar">
        <div class="topbar-brand"><span class="logo">${esc(t('appTitle'))}</span><span class="logo-sub">SETUP</span></div>
        <div class="topbar-right">
          <button class="btn ghost small" data-act="settings-open">${esc(t('settings'))}</button>
          <button class="btn ghost small" data-act="help-open">?</button>
          ${isOnline()
            ? `<button class="btn ghost small" data-act="leave-room">${esc(t('leaveRoom'))}</button>`
            : `<button class="btn ghost small" data-act="setup">${esc(t('changeMission'))}</button>`}
        </div>
      </header>
      ${isOnline() ? onlineStrip(view) : ''}
      <main class="deal-main">
        <div class="deal-row">
          <div class="deal-card">
            <strong class="setup-callout">${esc(mine ? t('setupBannerMine', { name: actor.name }) : t('setupWaiting', { name: actor.name }))}</strong>
          </div>
          <div class="deal-chips">${chips}</div>
        </div>
        ${errorBox()}
        <div class="deal-stage">${playerPanel(view, view.players[stageSeat], stageSeat)}</div>
        <p class="swipe-hint phone-only">${esc(t('swipeHint'))}</p>
        <div class="deal-foot${pick && mine ? '' : ' no-pick'}">
          <div class="deal-tray">${tray}</div>
          <button class="btn primary big" data-act="setup-confirm" ${pick && mine ? '' : 'disabled'}>${esc(pick ? `Confirm wire ${valueLabel(pick.value)}` : 'Confirm wire')}</button>
        </div>
      </main>
      ${characterSheet(view)}
      ${rulesSheet(view)}
      ${settingsSheet()}
      ${phoneSheets(view)}
      ${overlay(view)}
    </div>`;
}

// ---------------------------------------------------------------------------
// Phone shell (rev 2): slim top bar, one-line table summary, and three sheets
// (Menu, More, Table). Every piece is hidden on tablet and desktop by CSS.
const PHONE_CLOSE = new Set(['rules-open', 'settings-open', 'help-open', 'leave-room', 'leave-ask',
  'setup', 'pause-room', 'resume-room', 'equip', 'reveal', 'coffee-target', 'dual',
  'solo-confirm', 'solo-cancel', 'log-toggle', 'zoom-open']);

const PHONE_ICON = (() => {
  const svg = (body) => `<svg class="pico" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  return {
    cut: svg('<circle cx="6" cy="7" r="3"/><circle cx="6" cy="17" r="3"/><path d="M8.5 8.5L20 18M8.5 15.5L20 6"/>'),
    book: svg('<path d="M4 5h7v14H4zM13 5h7v14h-7z"/>'),
    gear: svg('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>'),
    help: svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5"/>'),
    pause: svg('<path d="M8 5v14M16 5v14"/>'),
    play: svg('<path d="M7 5l12 7-12 7z"/>'),
    leave: svg('<path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/>'),
    eye: svg('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
    cup: svg('<path d="M5 8h11v7a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4zM16 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/>'),
    tool: svg('<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M9 12h6M12 9v6"/>'),
    dots: svg('<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>'),
    list: svg('<path d="M5 7h14M5 12h14M5 17h9"/>'),
    chev: svg('<path d="M9 5l7 7-7 7"/>'),
  };
})();

function moreRow(act, icon, title, sub, attrs = '', cls = '') {
  return `<button class="more-row${cls}" data-act="${act}"${attrs}>${PHONE_ICON[icon]}<span class="more-text"><b>${esc(title)}</b><small>${esc(sub)}</small></span></button>`;
}

function turnInfo(view) {
  const state = UI.state;
  if (state.phase === 'setup' && state.setupSeat !== null) return { mine: canSetup(view), text: t('phoneSetup') };
  if (state.phase !== 'playing') return { mine: false, text: '' };
  if (state.openTurn) return { mine: true, text: t('turnOpenShort') };
  const actorId = state.pending ? view.pending.actorId : state.players[state.activeIndex].id;
  const mine = actorId === view.you;
  return { mine, text: mine ? t('yourTurnShort') : t('turnOf', { name: playerName(view, actorId) }) };
}

function phoneBar(view) {
  const info = turnInfo(view);
  const dial = view.dial;
  const danger = dial.zone >= dial.skullAt - 1 && view.phase === 'playing';
  const dot = isOnline()
    ? `<span class="pconn ${UI.online.connection === 'offline' ? 'offline' : 'online'}" title="${esc(t(UI.online.connection === 'offline' ? 'offline' : 'connected'))}"></span>`
    : '';
  return `<header class="phone-bar phone-only">
      <span class="phone-turn${info.mine ? ' mine' : ''}">${esc(info.text)}</span>${dot}
      <button class="phone-dial${danger ? ' danger' : ''}" data-act="psheet-open" data-v="table" aria-label="${esc(t('dial'))} ${dial.zone}/${dial.skullAt}">
        <span class="phone-dial-art">${artDial(dial.zone, 44)}</span>
        <span class="phone-dial-num"><b>${dial.zone}</b>/${dial.skullAt}</span>
      </button>
      <button class="phone-menu" data-act="psheet-open" data-v="menu" aria-label="${esc(t('menuTitle'))}">${PHONE_ICON.dots}</button>
    </header>`;
}

function eventLine(view) {
  const last = UI.state.log[UI.state.log.length - 1];
  const text = last ? logText(view, last) : '';
  if (!text) return '';
  return `<button class="event-line phone-only" data-act="psheet-open" data-v="log">${PHONE_ICON.list}<span>${esc(text)}</span></button>`;
}

// Phone: the free middle of the screen shows the mission, captain and the dial.
function phoneBoard(view) {
  const captain = view.players.find((player) => player.id === view.captainId);
  return `<section class="phone-board phone-only" aria-label="Board">
      <div class="pb-head" data-act="rules-open" role="button" tabindex="0" aria-label="${esc(t('missionRules'))}">
        <span class="pb-mission"><b>#${view.missionId}</b> ${esc(view.mission.title)}</span>
        <span class="pb-captain">${CROWN}<span>${esc(captain ? captain.name : '')}</span></span>
      </div>
      ${dialTrack(view, 56)}
    </section>`;
}

function tableSummary(view) {
  const done = view.validation.length;
  const cells = Array.from({ length: 12 }, (_, index) => {
    const value = index + 1;
    const ok = view.validation.includes(value);
    return `<span class="vm-cell${ok ? ' done' : ''}" title="${esc(t('validation'))} ${value}">${ok ? '✓' : ''}</span>`;
  }).join('');
  return `<div class="table-sum phone-only" role="button" tabindex="0" data-act="psheet-open" data-v="table" aria-label="${esc(t('openTable'))}">
      <span class="ts-head"><span>${esc(t('track'))}</span><span class="ts-open">${esc(t('openTable'))}${PHONE_ICON.chev}</span></span>
      ${boardTrack(view)}
      ${sequenceStrip(view, true)}
      ${missionStrip(view, true)}
      <span class="ts-head"><span>${esc(t('validation'))} <em>${esc(t('validatedCount', { done, total: 12 }))}</em></span></span>
      <span class="vm-row">${cells}</span>
    </div>`;
}

function menuRows(view) {
  const row = (act, icon, label, cls = '') => `<button class="menu-row${cls}" data-act="${act}">${PHONE_ICON[icon]}<span>${esc(label)}</span></button>`;
  const online = isOnline();
  const status = online ? roomStatusLabel(UI.online.room || {}) : '';
  const rows = [];
  if (UI.state.phase === 'playing') rows.push(row('rules-open', 'book', t('missionRules')));
  rows.push(`<button class="menu-row" data-act="psheet-open" data-v="log">${PHONE_ICON.list}<span>${esc(t('log'))}</span></button>`);
  rows.push(row('settings-open', 'gear', t('settings')));
  rows.push(row('help-open', 'help', t('howToPlay')));
  if (online && UI.online.isHost && status === 'playing') rows.push(row('pause-room', 'pause', t('pauseRoom')));
  if (online && UI.online.isHost && status === 'paused') rows.push(row('resume-room', 'play', t('resumeRoom')));
  rows.push(online ? row('leave-ask', 'leave', t('leaveRoom'), ' danger') : row('setup', 'leave', t('changeMission'), ' danger'));
  return rows.join('');
}

function psheet(title, body, cls) {
  return `<div class="psheet-wrap phone-only" data-act="psheet-close">
      <section class="psheet ${cls}" role="dialog" aria-label="${esc(title)}">
        <span class="psheet-grip"></span>
        <header class="psheet-head"><strong>${esc(title)}</strong><button class="psheet-x" data-act="psheet-close" aria-label="${esc(t('close'))}">&times;</button></header>
        <div class="psheet-body">${body}</div>
      </section>
    </div>`;
}

function phoneSheets(view) {
  const kind = UI.phoneSheet;
  if (!kind) return '';
  if (kind === 'menu') return psheet(t('menuTitle'), menuRows(view), 'ps-menu');
  if (kind === 'more') {
    if (!(UI.cache.moreCount > 0 || UI.soloConfirm || UI.coffeeOpen)) { UI.phoneSheet = null; return ''; }
    return psheet(t('moreTitle'), UI.cache.moreHtml || '', 'ps-more');
  }
  if (kind === 'log') {
    const lines = UI.state.log.slice(-40).reverse().map((entry) => `<li class="log-${esc(entry.type)}">${esc(logText(view, entry))}</li>`).join('');
    return psheet(t('log'), `<ol class="log log-sheet">${lines}</ol><button class="btn ghost small" data-act="export-log">${esc(t('exportLog'))}</button>`, 'ps-log');
  }
  if (kind === 'table') {
    const m = view.markers || {};
    const hasMarkers = ((m.yellow || []).length + (m.red || []).length) > 0;
    const legend = hasMarkers ? `<p class="more-note">${esc(t('helpMarkerCaption'))} ${esc(t('helpMarkerQCaption'))}</p>` : '';
    return psheet(t('tableTitle'), boardCenter(view) + legend, 'ps-table');
  }
  return '';
}

// P6b / P2 phone helpers: the numbers you hold as a row of chips, and a zoom
// sheet that shows your own stands with large tiles. Both are hidden on
// desktop by CSS.
function holdRow(view, seat) {
  return `<div class="hold-row">
      <button class="hold-zoom" data-act="zoom-open" aria-label="${esc(t('zoomOpen'))}">${artIcon('eye', 18, 'currentColor', 2.2)}<span class="zt">${esc(t('zoomOpen'))}</span></button>
    </div>`;
}

function zoomSheet(view, seat) {
  return `<div class="zoom-wrap" data-act="zoom-close">
      <section class="zoom-sheet" role="dialog" aria-label="${esc(t('zoomTitle'))}">
        <header class="zoom-head">
          <strong>${esc(t('zoomTitle'))}</strong>
          <button class="btn small" data-act="zoom-close">${esc(t('zoomClose'))}</button>
        </header>
        ${playerPanel(view, view.players[seat], seat)}
      </section>
    </div>`;
}

// Mission 10 on one device: pass the phone to whoever says Snip first.
function snipScreen(view) {
  const eligible = view.players.filter((player, seat) => (
    player.id !== view.lastActiveId
    && UI.state.stands[seat].flat().some((id) => !UI.state.wires[id].cut && !UI.state.wires[id].revealed)
  ));
  const remaining = timerRemaining(view);
  return `
    <div class="game curtain snip-screen">
      <div class="curtain-card">
        <h2>${esc(t('snipWho'))}</h2>
        <p class="curtain-why">${esc(t('openTurnHelp'))}</p>
        ${remaining !== null ? `<div class="seq-strip special timer${remaining < 60000 ? ' hurry' : ''}"><span class="seq-title">${esc(t('timerTitle'))}</span><span class="timer-clock" data-timer>${esc(clockText(remaining))}</span></div>` : ''}
        <div class="target-row">${eligible.filter((player) => !isBotId(player.id)).map((player) => `<button class="btn big primary snip-target" data-act="snip" data-id="${esc(player.id)}">${esc(t('snipButton'))} ${esc(player.name)}</button>`).join('')}</div>
        <p class="muted small">${esc(t('snipWhoHelp'))}</p>
        ${errorBox()}
      </div>
      ${overlay(view)}
    </div>`;
}

function gameScreen(view) {
  if (!isOnline() && view.openTurn && view.phase === 'playing') return snipScreen(view);
  if (curtainNeeded(view)) { UI.zoom = false; return curtainScreen(view); }
  if (UI.state.phase === 'setup') return setupDealScreen(view);
  const me = meSeat(view);
  const others = [];
  for (let step = 1; step < view.players.length; step += 1) {
    others.push((me + step) % view.players.length);
  }
  // Where each opponent sits around the board (clockwise from "you" at the
  // bottom). Four and five players get a left and a right seat.
  const SLOTS = {
    1: ['top'],
    2: ['topL', 'topR'],
    3: ['left', 'top', 'right'],
    4: ['left', 'topL', 'topR', 'right'],
  };
  const slots = SLOTS[others.length] || others.map(() => 'top');
  const hasSides = slots.includes('left');
  return `
    <div class="game">
      ${phoneBar(view)}
      <header class="topbar">
        ${logoRow(view)}
        <div class="topbar-right">
          <button class="btn ghost small" data-act="rules-open">${esc(t('missionRules'))}</button>
          <button class="btn ghost small" data-act="settings-open" aria-label="${esc(t('settings'))}">${esc(t('settings'))}</button>
          <button class="btn ghost small" data-act="help-open">${esc(t('howToPlay'))}</button>
          ${isOnline()
            ? `<button class="btn ghost small" data-act="leave-room">${esc(t('leaveRoom'))}</button>`
            : `<button class="btn ghost small" data-act="setup">${esc(t('changeMission'))}</button>`}
        </div>
      </header>
      ${isOnline() ? onlineStrip(view) : ''}
      <main class="table">
        <div class="table-main">
          ${turnBanner(view)}
          <div class="arena${hasSides ? ' has-sides' : ''} facing">
            <div class="opponents${others.length > 2 ? ' scrolls' : ''}" data-n="${others.length}" style="--opps:${Math.max(1, others.length)}">
              ${others.map((seat, index) => playerPanel(view, view.players[seat], seat, slots[index])).join('')}
            </div>
            ${boardCenter(view)}
          </div>
          <div class="phone-mid">${UI.draft ? '' : phoneBoard(view)}${tableSummary(view)}</div>
          <div class="bottom-dock">
            <div class="action-dock">${actionPanel(view)}</div>
            <div class="me-seat">${playerPanel(view, view.players[me], me)}${holdRow(view, me)}</div>
          </div>
          ${UI.zoom ? zoomSheet(view, me) : ''}
          <button class="log-fab" data-act="log-toggle" aria-label="${esc(t('logShow'))}">${esc(t('log'))}</button>
        </div>
        <aside class="side">
          ${logPanel(view)}
        </aside>
      </main>
      ${equipmentSheet(view)}
      ${characterSheet(view)}
      ${rulesSheet(view)}
      ${settingsSheet()}
      ${phoneSheets(view)}
      ${overlay(view)}
    </div>`;
}

// Rows that scroll sideways on a phone get an edge shadow and a hint line while
// there is more to see (CSS reads data-over="l", "r" or "lr").
function updateScrollHints() {
  document.querySelectorAll('.deal-stage').forEach((el) => {
    const left = el.scrollLeft > 4;
    const right = el.scrollLeft + el.clientWidth < el.scrollWidth - 4;
    const value = `${left ? 'l' : ''}${right ? 'r' : ''}`;
    if (value) el.setAttribute('data-over', value);
    else el.removeAttribute('data-over');
  });
}

function render() {
  applySettings();
  const root = document.getElementById('app');
  if (!root) return;
  // Re-rendering replaces the nodes, which resets inner scroll. Keep the
  // Dual Cut panel where it was so the Confirm button never jumps out of view.
  const keepDraftScroll = Boolean(UI.draft);
  const previous = {
    panel: keepDraftScroll ? (root.querySelector('.action-panel')?.scrollTop || 0) : 0,
    draft: keepDraftScroll ? (root.querySelector('.draft-scroll')?.scrollTop || 0) : 0,
    log: root.querySelector('.log-panel')?.scrollTop || 0,
    stage: root.querySelector('.deal-stage')?.scrollLeft || 0,
    opps: root.querySelector('.opponents')?.scrollLeft || 0,
    racks: [...root.querySelectorAll('.player[data-seat] .rack')].map((el) => [el.closest('.player').dataset.seat, el.scrollLeft]),
    sheet: root.querySelector('.psheet-body')?.scrollTop || 0,
  };
  const oldNeedle = root.querySelector('.bb-needle');
  const oldAngle = oldNeedle ? oldNeedle.style.transform : '';
  const paint = (html) => {
    root.innerHTML = html;
    const needle = root.querySelector('.bb-needle');
    if (needle && oldAngle && oldAngle !== needle.style.transform) {
      const target = needle.style.transform;
      needle.style.transition = 'none';
      needle.style.transform = oldAngle;
      void needle.getBoundingClientRect();
      needle.style.transition = 'transform 380ms cubic-bezier(.34,1.56,.64,1)';
      needle.style.transform = target;
    }
    const panel = root.querySelector('.action-panel');
    if (panel && previous.panel) panel.scrollTop = previous.panel;
    const draftScroll = root.querySelector('.draft-scroll');
    if (draftScroll && previous.draft) draftScroll.scrollTop = previous.draft;
    const log = root.querySelector('.log-panel');
    if (log && previous.log) log.scrollTop = previous.log;
    const stage = root.querySelector('.deal-stage');
    if (stage && previous.stage) stage.scrollLeft = previous.stage;
    // Re-rendering rebuilds the nodes; put every horizontal scroller back so a
    // swipe to the next opponent stays put while a Dual Cut is being built.
    const opps = root.querySelector('.opponents');
    if (opps && previous.opps) {
      const snap = opps.style.scrollSnapType;
      opps.style.scrollSnapType = 'none';
      opps.scrollLeft = previous.opps;
      opps.style.scrollSnapType = snap;
    }
    const rackNow = [...root.querySelectorAll('.player[data-seat] .rack')];
    for (const [seat, left] of previous.racks) {
      if (!left) continue;
      const el = rackNow.find((node) => node.closest('.player').dataset.seat === seat);
      if (el) el.scrollLeft = left;
    }
    const sheetBody = root.querySelector('.psheet-body');
    if (sheetBody && previous.sheet) sheetBody.scrollTop = previous.sheet;
    updateScrollHints();
  };
  if (UI.screen === 'home') {
    paint(homeScreen() + helpSheet());
    return;
  }
  if (UI.screen === 'create') {
    paint(createRoomScreen() + helpSheet() + toastMarkup());
    return;
  }
  if (UI.screen === 'join' || UI.screen === 'online') {
    paint(joinRoomScreen() + helpSheet());
    return;
  }
  if (UI.screen === 'mission') {
    paint(missionPickerScreen() + helpSheet() + toastMarkup());
    return;
  }
  if (UI.screen === 'lobby') {
    paint(lobbyScreen() + leaveModal() + helpSheet());
    return;
  }
  if (UI.screen === 'setup' || !UI.state) {
    paint(setupScreen() + helpSheet() + toastMarkup());
    return;
  }
  const view = openView(UI.state);
  if (UI.equip && (UI.state.phase === 'won' || UI.state.phase === 'lost' || UI.state.pending)) UI.equip = null;
  UI.equipNeed = UI.equip ? equipNeedFor(view) : null;
  UI.viewPendingCandidates = view.pending && view.pending.candidates
    ? view.pending.candidates.map((entry) => (typeof entry === 'string' ? entry : entry.wireId))
    : [];
  const selected = UI.draft
    ? UI.draft.values.map(valueLabel).join('/')
    : '';
  UI.selectedText = selected;
  if (!curtainNeeded(view)) collectBanners(view);
  paint(gameScreen(view) + bannerStack() + leaveModal() + helpSheet() + toastMarkup() + onlineStatusModal());
  if (UI.draft && UI.draft.targetId && window.innerWidth < 700 && UI.draftScrolled !== UI.draft.targetId) {
    UI.draftScrolled = UI.draft.targetId;
    const seat = root.querySelector('.player.is-target');
    if (seat) seat.scrollIntoView({ block: 'start', behavior: 'auto' });
  }
  if (!UI.draft) UI.draftScrolled = null;
  scheduleBot();
}

// ---------------------------------------------------------------------------
// Bots (level 2). In hotseat the browser plays for them; online the host does.

function stopBotTimer() {
  if (UI.botTimer) clearTimeout(UI.botTimer);
  UI.botTimer = null;
  UI.botTimerKey = null;
}

function botView(state, id) {
  return publicView(state, id);
}

function botWaitMs(state, botId) {
  const view = publicView(state, botId);
  if (view.openTurn) return 1800 + Math.random() * 4200; // a "Snip!" race
  return 900 + Math.random() * 700;
}

function botStoreKey(code) {
  return `ws-bots-${code}`;
}

function loadOnlineBots(code) {
  try {
    const raw = typeof localStorage === 'undefined' ? null : localStorage.getItem(botStoreKey(code));
    const list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list.filter((id) => typeof id === 'string') : [];
  } catch {
    return [];
  }
}

function saveOnlineBots() {
  const online = UI.online;
  if (!online) return;
  try {
    if (typeof localStorage !== 'undefined') localStorage.setItem(botStoreKey(online.code), JSON.stringify(online.botIds));
  } catch {
    // ignore
  }
}

function touchOnlineBots() {
  const online = UI.online;
  if (!online || !online.isHost) return;
  for (const id of online.botIds) {
    touchPlayer(online.client, { code: online.code, playerId: id }).catch(() => {});
  }
}

async function addOnlineBot() {
  const online = UI.online;
  if (!online || !online.isHost || online.busy || online.addingBot) return;
  const players = online.players || [];
  if (players.length >= onlineTargetPlayers()) return;
  // The server gives the lowest free seat, so name the bot after that seat's
  // mascot: five bots always get five different names.
  const seats = new Set(players.map((player) => player.seat));
  let seat = 0;
  while (seats.has(seat) && seat < 4) seat += 1;
  const used = new Set(players.map((player) => player.name));
  let name = botNameForSeat(seat);
  for (let step = 1; used.has(name) && step < 5; step += 1) name = botNameForSeat(seat + step);
  const id = newPlayerId();
  online.addingBot = true;
  try {
    await joinRoom(online.client, { code: online.code, playerId: id, name });
    online.botIds = online.botIds.concat(id);
    saveOnlineBots();
    if (onlineReadySupport()) {
      await setPlayerReady(online.client, { code: online.code, playerId: id, ready: true }).catch(() => {});
    }
    await refreshOnline(true);
  } catch (error) {
    UI.error = netErrorText(error);
    render();
  } finally {
    online.addingBot = false;
  }
}

async function removeOnlineBot(id) {
  const online = UI.online;
  if (!online || !online.isHost || !online.botIds.includes(id)) return;
  try {
    await leaveRoom(online.client, { code: online.code, playerId: id });
    online.botIds = online.botIds.filter((botId) => botId !== id);
    saveOnlineBots();
    await refreshOnline(true);
  } catch (error) {
    UI.error = netErrorText(error);
    render();
  }
}

// Online the host's browser plays every bot it added. When the host leaves or
// goes away nothing drives the bots, so they stop with the room.
function scheduleOnlineBot() {
  const online = UI.online;
  const state = UI.state;
  if (!online || !online.isHost || online.botIds.length === 0 || !state
    || online.status !== 'playing' || UI.screen !== 'game'
    || (state.phase !== 'setup' && state.phase !== 'playing')) { stopBotTimer(); return; }
  const botId = botToAct(publicView(state, online.playerId), online.botIds);
  if (!botId) { stopBotTimer(); return; }
  const seq = online.seq;
  const key = `${state.gameId}|${seq}|${botId}`;
  if (UI.botTimer && UI.botTimerKey === key) return;
  stopBotTimer();
  UI.botTimerKey = key;
  UI.botTimer = setTimeout(function fire() {
    UI.botTimer = null;
    UI.botTimerKey = null;
    const live = UI.online;
    if (!live || !UI.state) return;
    if (live.seq !== seq) { scheduleOnlineBot(); return; }
    if (live.busy) { UI.botTimer = setTimeout(fire, 500); UI.botTimerKey = key; return; }
    try {
      const action = chooseBotAction(botView(UI.state, botId), botId);
      if (action) submitOnline(action, botId);
    } catch (error) {
      UI.error = error.message || String(error);
      render();
    }
  }, botWaitMs(state, botId));
}

function scheduleBot() {
  if (isOnline()) { scheduleOnlineBot(); return; }
  const state = UI.state;
  if (!state || UI.screen !== 'game' || UI.botIds.length === 0) { stopBotTimer(); return; }
  if (state.phase !== 'setup' && state.phase !== 'playing') { stopBotTimer(); return; }
  const view = publicView(state, state.players[0].id);
  const botId = botToAct(view, UI.botIds);
  if (!botId) { stopBotTimer(); return; }
  if (curtainNeeded(openView(state))) { stopBotTimer(); return; }
  const key = `${state.gameId}|${state.log.length}|${botId}|${state.turnNumber}`;
  if (UI.botTimer && UI.botTimerKey === key) return;
  stopBotTimer();
  UI.botTimerKey = key;
  UI.botTimer = setTimeout(() => {
    UI.botTimer = null;
    UI.botTimerKey = null;
    if (UI.state !== state) return;
    try {
      const action = chooseBotAction(botView(state, botId), botId);
      if (action) apply(action);
    } catch (error) {
      UI.error = error.message || String(error);
      render();
    }
  }, botWaitMs(state, botId));
}

function boot() {
  const root = document.getElementById('app');
  if (!root) return;
  document.addEventListener('scroll', (event) => {
    if (event.target && event.target.classList && event.target.classList.contains('deal-stage')) updateScrollHints();
  }, true);
  UI.savedSession = readSession();
  if (UI.savedSession && !UI.onlineName) UI.onlineName = UI.savedSession.name;
  root.addEventListener('click', onClick);
  setInterval(tickTimer, 1000);
  root.addEventListener('dblclick', (event) => {
    if (window.innerWidth >= 700 || UI.zoom || !UI.state || UI.screen !== 'game') return;
    if (event.target.closest('.me-seat .stands')) { UI.zoom = true; render(); }
  });
  root.addEventListener('input', (event) => {
    const input = event.target.closest('[data-name-input]');
    if (input) {
      const index = Number(input.dataset.nameInput);
      UI.names[index] = input.value;
      return;
    }
    const onlineName = event.target.closest('[data-online-name]');
    if (onlineName) {
      UI.onlineName = onlineName.value;
      return;
    }
    const onlineCode = event.target.closest('[data-online-code]');
    if (onlineCode) {
      UI.onlineCode = onlineCode.value.toUpperCase();
      return;
    }
  });
  root.addEventListener('keydown', (event) => {
    if (event.key !== 'Enter') return;
    if (event.target.closest('[data-online-code]')) joinOnlineRoom();
    else if (event.target.closest('[data-online-name]')) {
      if (UI.screen === 'join' && UI.onlineCode) joinOnlineRoom();
      else if (UI.screen === 'create') createOnlineRoom();
      else if (UI.screen === 'online') {
        if (UI.onlineCode) joinOnlineRoom();
        else createOnlineRoom();
      }
    }
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (UI.helpOpen) { UI.helpOpen = false; render(); }
      else if (UI.sheet) { UI.sheet = null; render(); }
      else if (UI.draft) { UI.draft = null; render(); }
      else if (UI.coffeeOpen) { UI.coffeeOpen = false; render(); }
    }
  });
  render();
}

// Demo-only handle for manual testing from the browser console: inspect the
// local UI state or inject a prepared engine state to preview later missions.
if (typeof globalThis !== 'undefined') {
  globalThis.WS_DEBUG = {
    get state() {
      return isOnline() && UI.state ? publicView(UI.state, UI.online.playerId) : UI.state;
    },
    set state(value) {
      UI.mode = 'local';
      UI.state = value;
      UI.screen = 'game';
      UI.draft = null;
      UI.sheet = null;
      UI.error = '';
      render();
    },
    apply(action) {
      apply(action);
    },
    online: {
      create: createOnlineRoom,
      join: joinOnlineRoom,
      refresh: refreshOnline,
      leave: leaveOnline,
    },
    ui: UI,
    render,
  };
}

if (typeof document !== 'undefined') {
  boot();
}

globalThis.WS = { newGame, applyAction, legalActions, publicView, IllegalAction,
  MISSIONS, EQUIPMENT_CARDS, CHARACTERS, DIAL, INFO, createRng };
})();
</script>
