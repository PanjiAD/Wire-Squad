  // Mission 11: one more Number card, drawn last so other seeds stay unchanged.
  const deadlyValue = mission.deadlyValue ? rng.int(12) + 1 : null;

  const specs = [];
  for (const value of blueValues) {
    for (let copy = 0; copy < BLUE_COPIES; copy += 1) {
      if (value === deadlyValue) {
        specs.push({ kind: 'red', value: null, order: value, tileValue: value, deadly: true });
      } else {
        specs.push({ kind: 'blue', value, order: value, tileValue: value });
      }
    }
  }
  for (const value of yellow.values) {
    specs.push({ kind: 'yellow', value: null, order: value + 0.1, tileValue: value });
  }
  for (const value of red.values) {
    specs.push({ kind: 'red', value: null, order: value + 0.5, tileValue: value });
  }

  const state = {
    schema: SCHEMA,
    gameId: options.gameId || `g${seed}-${mission.id}-${playerCount}`,
    seed,
    rng: 0,
    missionId: mission.id,
    mission: missionSnapshot(mission),
    playerCount,
    captainIndex,
    activeIndex: captainIndex,
    turnNumber: 0,
    turn: { stabilizer: null },
    players: players.map((player, seat) => ({
      id: player.id,
      name: player.name,
      seat,
      characterId: player.characterId,
      standCount: standCountFor(playerCount, seat, captainIndex),
      personal: { id: 'doubleDetector', used: false },
      connected: true,
    })),
    wires: {},
    stands: players.map((_, seat) => Array.from(
      { length: standCountFor(playerCount, seat, captainIndex) },
      () => [],
    )),
    dial: {
      zone: DIAL.startZone[playerCount],
      startZone: DIAL.startZone[playerCount],
      skullAt: DIAL.skullAt,
    },
    markers: { yellow: yellow.markers, red: red.markers },
    sequence,
    deadlyValue,
    finalValue: mission.secretAgent ? mission.secretAgent.finalValue : null,
    oxygen: mission.oxygen
      ? { supply: mission.oxygen.perPlayer * playerCount, total: mission.oxygen.perPlayer * playerCount }
      : null,
    openTurn: false,
    lastActive: null,
    equipment: [],
    infoSupply: {},
    tokens: [],
    labels: { neq: [], eq: [] },
    validation: [],
    phase: 'setup',
    setupSeat: captainIndex,
    pending: null,
    lossReason: null,
    actionCount: 0,
    counters: { token: 1 },
    log: [],
  };

  for (let value = 1; value <= 12; value += 1) {
    state.infoSupply[value] = INFO.numberedPerValue;
  }
  state.infoSupply.yellow = INFO.yellow;

  // Shuffle once, then deal one at a time clockwise from the captain.
  rng.shuffle(specs);
  const hands = Array.from({ length: playerCount }, () => []);
  specs.forEach((spec, index) => {
    const player = (captainIndex + index) % playerCount;
    hands[player].push(spec);
  });

  let wireCounter = 1;
  players.forEach((_, seat) => {
    hands[seat].sort((a, b) => a.order - b.order);
    const parts = splitInto(hands[seat], state.players[seat].standCount);
    parts.forEach((part, stand) => {
      for (const spec of part) {
        const id = `w${String(wireCounter).padStart(3, '0')}`;
        wireCounter += 1;
        state.wires[id] = {
          id,
          kind: spec.kind,
          value: spec.value,
          order: spec.order,
          tileValue: spec.tileValue,
          owner: seat,
          stand,
          cut: false,
          revealed: false,
          info: [],
          ...(spec.deadly ? { deadly: true } : {}),
        };
        state.stands[seat][stand].push(id);
      }
      sortStand(state, seat, stand);
    });
  });

  state.equipment = dealEquipment(state, setup, rng);

  // Mission 12: a Number card lies on every Equipment card.
  if (mission.redTape) {
    const deck = range(1, 12);
    rng.shuffle(deck);
    state.equipment.forEach((card, index) => { card.tape = deck[index]; });
  }

  state.rng = rng.state;
  state.turnNumber = 1;

  // First setup decision: first player from the captain with a blue wire.
  let setupSeat = null;
  for (let step = 0; step < playerCount; step += 1) {
    const candidate = (captainIndex + step) % playerCount;
    if (handWires(state, candidate).some((wire) => wire.kind === 'blue')) {
      setupSeat = candidate;
      break;
    }
  }
  state.setupSeat = setupSeat;

  logEvent(state, {
    type: 'setup',
    missionId: mission.id,
    playerCount,
    wireCount: Object.keys(state.wires).length,
    equipment: state.equipment.map((card) => card.number),
    dial: state.dial.zone,
  });

  if (setupSeat === null) {
    state.phase = 'playing';
    state.setupSeat = null;
    state.activeIndex = captainIndex;
    state.openTurn = Boolean(mission.freeTurns);
    logEvent(state, { type: 'playing', player: state.activeIndex });
  }

  return state;
}
// ---- engine/actions.js ----
const ANY_VALUES = Array.from({ length: 12 }, (_, index) => index + 1);

// ---------------------------------------------------------------------------
// Small validators

function readValues(action) {
  if (!Array.isArray(action.values) || action.values.length === 0) {
    illegal('values must be a non-empty array');
  }
  const values = action.values.map((value) => {
    if (value === 'yellow') return 'yellow';
    if (!Number.isInteger(value) || value < 1 || value > 12) {
      illegal('values must be 1-12 or "yellow"');
    }
    return value;
  });
  if (new Set(values).size !== values.length) illegal('values must be distinct');
  return values;
}

function usableCard(state, number) {
  const card = state.equipment.find((candidate) => candidate.number === number);
  if (!card || !card.usable || card.used) return null;
  return card;
}

function requireCard(state, number) {
  const card = state.equipment.find((candidate) => candidate.number === number);
  if (!card) illegal(`equipment ${number} is not in this mission`);
  if (!card.usable) illegal(`equipment ${number} is still locked`);
  if (card.used) illegal(`equipment ${number} was already used`);
  return card;
}

function useCard(state, card) {
  card.used = true;
  card.usable = false;
}

function selectedWires(state, action, target) {
  const ids = action.wireIds;
  if (!Array.isArray(ids) || ids.length === 0) illegal('wireIds must be a non-empty array');
  if (new Set(ids).size !== ids.length) illegal('wireIds must be distinct');
  const wires = ids.map((id) => getWire(state, id));
  for (const wire of wires) {
    if (wire.owner !== target) illegal('every wire must belong to the target');
    if (!isOnStand(wire)) illegal('wire is already gone');
  }
  const stand = wires[0].stand;
  if (wires.some((wire) => wire.stand !== stand)) illegal('every wire must be on the same stand');
  return { wires, stand };
}

// ---------------------------------------------------------------------------
// Setup

function canPlaceSetupToken(state, seat) {
  return handWires(state, seat).some(
    (wire) => wire.kind === 'blue' && state.infoSupply[wire.value] > 0,
  );
}

function finishSetup(state) {
  state.phase = 'playing';
  state.setupSeat = null;
  state.activeIndex = state.captainIndex;
  state.turnNumber = 1;
  state.openTurn = Boolean(state.mission.freeTurns);
  state.lastActive = null;
  // Store the starter on the log entry. The log must not be re-rendered from
  // the live active player, or older entries change as turns pass.
  logEvent(state, { type: 'playing', player: state.activeIndex });
}

// Setup ends after every player placed exactly one token, so the count of
// setup tokens is the source of truth (not the seat number, which wraps).
function advanceSetup(state) {
  const count = state.playerCount;
  if (state.tokens.length >= count) {
    finishSetup(state);
    return;
  }
  const placed = new Set(state.tokens.map((token) => token.owner));
  for (let step = 1; step <= count; step += 1) {
    const candidate = (state.setupSeat + step) % count;
    if (placed.has(candidate)) continue;
    if (canPlaceSetupToken(state, candidate)) {
      state.setupSeat = candidate;
      return;
    }
  }
  finishSetup(state);
}

function applySetupInfo(state, action) {
  if (state.phase !== 'setup') illegal('setup tokens are already placed');
  const player = playerIndex(state, action.playerId);
  if (player !== state.setupSeat) illegal('not your setup token');
  const wire = getWire(state, action.wireId);
  if (wire.owner !== player) illegal('choose one of your own wires');
  if (wire.kind !== 'blue') illegal('setup tokens only mark blue wires');
  if (!isOnStand(wire)) illegal('wire is already gone');
  if (!(state.infoSupply[wire.value] > 0)) illegal('no info token left for that value');

  const token = placeInfoToken(state, wire.id, player);
  logEvent(state, {
    type: 'setupInfo',
    player,
    wire: wire.id,
    value: token.value,
  });
  advanceSetup(state);
}

// ---------------------------------------------------------------------------
// Dual Cut

function applyDualCut(state, player, action) {
  if (player !== state.activeIndex) illegal('not your turn');
  const target = playerIndex(state, action.targetId);
  if (target === player) illegal('choose a teammate');
  if (!playerHasWires(state, target)) illegal('the target has no wires');

  const values = readValues(action);
  const detector = action.detector || null;
  const ray = Boolean(action.ray);
  if (![null, 'personal', 'triple', 'super'].includes(detector)) illegal('unknown detector');

  if (ray ? values.length !== 2 : values.length !== 1) {
    illegal(ray ? 'X or Y Ray needs exactly two values' : 'announce exactly one value');
  }
  if (detector === 'triple' && action.ray && values.length !== 2) illegal('ray needs two values');

  // Item availability is checked before the announced values so a spent
  // personal detector reports itself instead of a missing wire value.
  let detectorCard = null;
  if (detector === 'personal' && state.players[player].personal.used) {
    illegal('personal item was already used');
  }
  if (detector === 'triple') detectorCard = requireCard(state, 3);
  if (detector === 'super') detectorCard = requireCard(state, 5);
  const rayCard = ray ? requireCard(state, 10) : null;

  const locked = lockedValues(state);
  for (const value of values) {
    if (locked.includes(value)) illegal('that value is still locked by the Number cards');
  }
  for (const value of values) {
    if (!ownsValue(state, player, value)) illegal('you must hold the value you announce');
  }
  if (detector && values.includes('yellow')) illegal('detectors cannot announce yellow');

  const { wires, stand } = selectedWires(state, action, target);
  if (detector === null && wires.length !== 1) illegal('a plain Dual Cut points at one wire');
  if (detector === 'personal' && wires.length !== 2) illegal('Double Detector points at two wires');
  if (detector === 'triple' && wires.length !== 3) illegal('Triple Detector points at three wires');
  if (detector === 'super') {
    const all = standWires(state, target, stand).filter(isOnStand);
    if (all.length !== wires.length) illegal('Super Detector points at the whole stand');
  }

  const oxygenSpent = checkOxygen(state, values);

  // Pay for the action only after every check passed.
  if (state.oxygen) state.oxygen.supply -= oxygenSpent;
  if (detector === 'personal') state.players[player].personal.used = true;
  if (detectorCard) useCard(state, detectorCard);
  if (rayCard) useCard(state, rayCard);

  const stabilized = state.turn.stabilizer === player;
  state.turn.stabilizer = null;

  logEvent(state, {
    type: 'dualCut',
    player,
    target,
    values,
    wires: wires.map((wire) => wire.id),
    detector,
    ray,
  });

  const matches = wires
    .map((wire) => {
      const value = values.find((candidate) => matchesValue(wire, candidate));
      return value === undefined ? null : { wire, value };
    })
    .filter(Boolean);

  if (matches.length === 0) {
    const reds = wires.filter((wire) => wire.kind === 'red');
    if (reds.length === wires.length) {
      if (stabilized) {
        logEvent(state, { type: 'stabilized', player, reason: 'red' });
        finishTurnAction(state);
        return;
      }
      state.phase = 'lost';
      state.lossReason = 'red';
      state.pending = null;
      logEvent(state, { type: 'lost', reason: 'red' });
      return;
    }

    const candidates = wires.filter((wire) => wire.kind !== 'red').map((wire) => wire.id);
    if (!stabilized && advanceDial(state, 1)) {
      logEvent(state, { type: 'lost', reason: 'dial' });
      return;
    }
    state.pending = { kind: 'placeToken', actor: target, candidates };
    logEvent(state, { type: 'dualCutFailed', player, target, stabilized });
    return;
  }

  if (matches.length === 1) {
    cutPair(state, player, matches[0].wire, matches[0].value);
    logEvent(state, { type: 'dualCutSuccess', player, target, value: matches[0].value });
    finishTurnAction(state);
    return;
  }

  state.pending = {
    kind: 'chooseCut',
    actor: target,
    candidates: matches.map((match) => ({ wireId: match.wire.id, value: match.value })),
  };
  logEvent(state, { type: 'dualCutAmbiguous', player, target });
}

function cutPair(state, active, targetWire, value) {
  cutWire(state, targetWire.id);
  const own = ownWireForValue(state, active, value);
  if (!own) illegal('you no longer hold a matching wire');
  cutWire(state, own.id);
}

// ---------------------------------------------------------------------------
// Solo Cut / Reveal

function applySoloCut(state, player, action) {
  if (player !== state.activeIndex) illegal('not your turn');
  const kind = action.kind;
  if (kind !== 'blue' && kind !== 'yellow') illegal('solo cut kind must be blue or yellow');

  let group;
  if (kind === 'blue') {
    if (!Number.isInteger(action.value) || action.value < 1 || action.value > 12) {
      illegal('solo cut needs a blue value');
    }
    if (lockedValues(state).includes(action.value)) illegal('that value is still locked by the Number cards');
    group = [];
    for (let other = 0; other < state.playerCount; other += 1) {
      for (const wire of handWires(state, other)) {
        if (wire.kind === 'blue' && wire.value === action.value) group.push(wire);
      }
    }
  } else {
    group = [];
    for (let other = 0; other < state.playerCount; other += 1) {
      for (const wire of handWires(state, other)) {
        if (wire.kind === 'yellow') group.push(wire);
      }
    }
  }

  if (group.length !== 2 && group.length !== 4) illegal('solo cut needs exactly 2 or 4 wires');
  if (group.some((wire) => wire.owner !== player)) illegal('not every matching wire is yours');

  const soloCost = checkOxygen(state, [kind === 'blue' ? action.value : 'yellow']);
  if (state.oxygen) state.oxygen.supply -= soloCost;

  group.sort((a, b) => a.order - b.order || (a.id < b.id ? -1 : 1));
  for (const wire of group) cutWire(state, wire.id);
  logEvent(state, {
    type: 'soloCut',
    player,
    kind,
    value: kind === 'blue' ? action.value : null,
    count: group.length,
  });
  finishTurnAction(state);
}

function applyRevealRed(state, player) {
  if (player !== state.activeIndex) illegal('not your turn');
  const hand = handWires(state, player);
  if (hand.length === 0) illegal('your stand is empty');
  if (!hand.every((wire) => wire.kind === 'red')) illegal('only red wires can be revealed');
  for (const wire of hand) wire.revealed = true;
  logEvent(state, { type: 'revealRed', player, count: hand.length });
  finishTurnAction(state);
}

// ---------------------------------------------------------------------------
// Mission 44: Oxygen

function oxygenCostOf(values) {
  return values.reduce((sum, value) => sum + oxygenCost(value), 0);
}

function checkOxygen(state, values) {
  if (!state.oxygen) return 0;
  const cost = oxygenCostOf(values);
  if (cost > state.oxygen.supply) illegal('not enough Oxygen for that depth');
  return cost;
}

function applyPassTurn(state, player) {
  if (!state.oxygen) illegal('skipping a turn is only used in the Oxygen mission');
  if (player !== state.activeIndex) illegal('not your turn');
  logEvent(state, { type: 'passTurn', player });
  if (advanceDial(state, 1)) {
    logEvent(state, { type: 'lost', reason: 'dial' });
    return;
  }
  finishTurnAction(state);
}

// ---------------------------------------------------------------------------
// Mission 10: free turns and the timer

function applySnip(state, player) {
  if (!state.openTurn) illegal('the turn is not open');
  if (player === state.lastActive) illegal('nobody plays two turns in a row');
  if (!playerHasWires(state, player)) illegal('you have no wires left');
  state.openTurn = false;
  state.activeIndex = player;
  state.turn.stabilizer = null;
  logEvent(state, { type: 'snip', player });
}

function applyTimeUp(state) {
  if (!state.mission.timerMinutes) illegal('this mission has no timer');
  state.phase = 'lost';
  state.lossReason = 'time';
  state.pending = null;
  logEvent(state, { type: 'lost', reason: 'time' });
}

// ---------------------------------------------------------------------------
// Mission 46: all the final wires at once

function applySecretCut(state, player, action) {
  if (!state.finalValue) illegal('this mission has no final wires');
  if (player !== state.activeIndex) illegal('not your turn');
  if (!holdsOnlyFinal(state, player)) illegal('you still hold other wires');
  const need = Object.values(state.wires).filter(
    (wire) => isOnStand(wire) && wire.kind === 'blue' && wire.value === state.finalValue,
  ).length;
  const ids = action.wireIds;
  if (!Array.isArray(ids) || ids.length !== need) illegal(`point at exactly ${need} wires`);
  if (new Set(ids).size !== ids.length) illegal('wireIds must be distinct');
  const wires = ids.map((id) => getWire(state, id));
  if (wires.some((wire) => !isOnStand(wire))) illegal('wire is already gone');
  logEvent(state, { type: 'secretCut', player, wires: ids.slice() });
  const right = wires.every((wire) => wire.kind === 'blue' && wire.value === state.finalValue);
  if (!right) {
    state.phase = 'lost';
    state.lossReason = 'secret';
    state.pending = null;
    logEvent(state, { type: 'lost', reason: 'secret' });
    return;
  }
  for (const wire of wires) cutWire(state, wire.id);
  logEvent(state, { type: 'secretCutSuccess', player });
  finishTurnAction(state);
}

// ---------------------------------------------------------------------------
// Coffee Mug

function applyCoffeeMug(state, player, action) {
  if (player !== state.activeIndex) illegal('not your turn');
  const card = requireCard(state, 11);
  const target = playerIndex(state, action.targetId);
  if (!playerHasWires(state, target)) illegal('the target has no wires');
  useCard(state, card);
  state.activeIndex = target;
  state.turnNumber += 1;
  state.turn.stabilizer = null;
  logEvent(state, { type: 'coffeeMug', player, target });
  checkStuck(state);
}

// ---------------------------------------------------------------------------
// Equipment

function applyPlayEquipment(state, player, action) {
  const card = state.equipment.find((candidate) => candidate.number === action.card);
  if (!card) illegal('that equipment is not in this mission');
  if (!card.usable) illegal('that equipment is still locked');
  if (card.used) illegal('that equipment was already used');

  switch (card.number) {
    case 1:
    case 12: {
      const stand = action.stand;
      const index = action.index;
      if (!Number.isInteger(stand) || stand < 0 || stand >= state.players[player].standCount) {
        illegal('unknown stand');
      }
      const ids = state.stands[player][stand];
      if (!Number.isInteger(index) || index < 0 || index + 1 >= ids.length) {
        illegal('choose two adjacent wires');
      }
      const first = state.wires[ids[index]];
      const second = state.wires[ids[index + 1]];
      if (!isOnStand(first) && !isOnStand(second)) illegal('both wires are already gone');
      const same = wireValueKey(first) === wireValueKey(second);
      if (card.number === 1 && same) illegal('the two wires must have different values');
      if (card.number === 12 && !same) illegal('the two wires must have the same value');
      const bucket = card.number === 1 ? state.labels.neq : state.labels.eq;
      bucket.push({ player, stand, between: [first.id, second.id] });
      useCard(state, card);
      logEvent(state, { type: 'label', player, card: card.number, stand, between: [first.id, second.id] });
      return;
    }
    case 2: {
      const wire = getWire(state, action.wireId);
      if (wire.owner !== player) illegal('choose one of your own wires');
      if (!isOnStand(wire)) illegal('wire is already gone');
      const target = playerIndex(state, action.targetId);
      if (target === player) illegal('choose a teammate');
      if (!playerHasWires(state, target)) illegal('the target has no wires');
      state.pending = { kind: 'walkieReturn', actor: target, giver: player, sourceWireId: wire.id };
      useCard(state, card);
      logEvent(state, { type: 'walkie', player, target, wire: wire.id });
      return;
    }
    case 4: {
      const wire = getWire(state, action.wireId);
      if (wire.owner !== player) illegal('choose one of your own wires');
      if (!isOnStand(wire)) illegal('wire is already gone');
      if (wire.kind !== 'blue') illegal('Post-It only marks blue wires');
      useCard(state, card);
      const token = placeInfoToken(state, wire.id, player);
      logEvent(state, { type: 'postIt', player, wire: wire.id, token: token.id });
      return;
    }
    case 6: {
      if (state.dial.zone <= 1) illegal('the dial is already at the start');
      state.dial.zone -= 1;
      useCard(state, card);
      logEvent(state, { type: 'rewinder', player, zone: state.dial.zone });
      return;
    }
    case 7: {
      const ids = action.playerIds;
      if (!Array.isArray(ids) || ids.length < 1 || ids.length > 2) illegal('flip one or two characters');
      if (new Set(ids).size !== ids.length) illegal('choose different characters');
      const seats = ids.map((id) => playerIndex(state, id));
      for (const seat of seats) {
        if (!state.players[seat].personal.used) illegal('that personal item is not used');
      }
      for (const seat of seats) state.players[seat].personal.used = false;
      useCard(state, card);
      logEvent(state, { type: 'batteries', player, targets: seats });
      return;
    }
    case 8: {
      const value = action.value;
      if (!Number.isInteger(value) || value < 1 || value > 12) illegal('radar needs a number 1-12');
      const answers = state.players.map((_, seat) => ({
        player: seat,
        stands: state.stands[seat].map((__, stand) => standWires(state, seat, stand).some(
          (wire) => isOnStand(wire) && wire.kind === 'blue' && wire.value === value,
        )),
      }));
      useCard(state, card);
      logEvent(state, { type: 'radar', player, value, answers });
      return;
    }
    case 9: {
      if (player !== state.activeIndex) illegal('arm the Stabilizer on your own turn');
      state.turn.stabilizer = player;
      useCard(state, card);
      logEvent(state, { type: 'stabilizer', player });
      return;
    }
    case 3:
    case 5:
    case 10:
      illegal('use this card during a Dual Cut');
      return;
    case 11:
      illegal('use the Coffee Mug action');
      return;
    default:
      illegal('unknown equipment');
  }
}

// ---------------------------------------------------------------------------
// Pending decisions

function applyResolve(state, action) {
  const pending = state.pending;
  if (!pending) illegal('there is no pending decision');
  const player = playerIndex(state, action.playerId);
  if (player !== pending.actor) illegal('this decision belongs to another player');
  const wire = getWire(state, action.wireId);

  if (pending.kind === 'walkieReturn') {
    if (wire.owner !== player) illegal('choose one of your own wires');
    if (!isOnStand(wire)) illegal('wire is already gone');
    const source = getWire(state, pending.sourceWireId);
    if (!isOnStand(source)) illegal('the offered wire is gone');
    if (source.owner !== pending.giver) illegal('the offered wire moved');

    // Each player files the wire they receive into the stand they gave one
    // away from (FAQ: the destination stand is never chosen by the player).
    const giverStand = Math.min(source.stand, state.players[pending.giver].standCount - 1);
    const actorStand = Math.min(wire.stand, state.players[player].standCount - 1);
    state.pending = null;

    state.stands[source.owner][source.stand] = state.stands[source.owner][source.stand]
      .filter((id) => id !== source.id);
    state.stands[wire.owner][wire.stand] = state.stands[wire.owner][wire.stand]
      .filter((id) => id !== wire.id);

    source.owner = player;
    source.stand = actorStand;
    state.stands[player][actorStand].push(source.id);

    wire.owner = pending.giver;
    wire.stand = giverStand;
    state.stands[pending.giver][giverStand].push(wire.id);

    sortStand(state, player, actorStand);
    sortStand(state, pending.giver, giverStand);
    logEvent(state, {
      type: 'walkieSwap',
      giver: pending.giver,
      target: player,
      giverWire: wire.id,
      targetWire: source.id,
    });
    return;
  }

  if (pending.kind === 'chooseCut') {
    const candidate = pending.candidates.find((entry) => entry.wireId === action.wireId);
    if (!candidate) illegal('not one of the matching wires');
    state.pending = null;
    cutPair(state, state.activeIndex, wire, candidate.value);
    logEvent(state, { type: 'chooseCut', player, wire: wire.id, value: candidate.value });
    finishTurnAction(state);
    return;
  }

  if (pending.kind === 'placeToken') {
    if (!pending.candidates.includes(action.wireId)) illegal('not one of the marked wires');
    if (wire.kind === 'red') illegal('red wires cannot be marked');
    state.pending = null;
    const token = placeInfoToken(state, wire.id, player);
    logEvent(state, { type: 'infoToken', player, wire: wire.id, kind: token.kind, value: token.value });
    finishTurnAction(state);
    return;
  }

  illegal('unknown pending decision');
}

// ---------------------------------------------------------------------------
// Public entry points

function applyInPlace(state, action) {
  if (!action || typeof action !== 'object') illegal('action must be an object');
  if (state.phase === 'won' || state.phase === 'lost') illegal('the game is over');
  if (action.type === 'setupInfo') {
    applySetupInfo(state, action);
    return;
  }
  if (state.phase === 'setup') illegal('place the setup info tokens first');
  if (action.type === 'timeUp') {
    applyTimeUp(state);
    return;
  }
  if (action.type === 'resolve') {
    applyResolve(state, action);
    return;
  }
  if (state.pending) illegal('resolve the pending decision first');

  const player = playerIndex(state, action.playerId);
  if (action.type === 'snip') {
    applySnip(state, player);
    return;
  }
  if (state.openTurn && action.type !== 'playEquipment') {
    illegal('say Snip to take the turn first');
  }
  if (holdsOnlyFinal(state, player)
    && ['dualCut', 'revealRed', 'coffeeMug'].includes(action.type)) {
    illegal('you hold only the last wires: cut them all at once');
  }
  switch (action.type) {
    case 'passTurn':
      applyPassTurn(state, player);
      return;
    case 'secretCut':
      applySecretCut(state, player, action);
      return;
    case 'dualCut':
      applyDualCut(state, player, action);
      return;
    case 'soloCut':
      applySoloCut(state, player, action);
      return;
    case 'revealRed':
      applyRevealRed(state, player);
      return;
    case 'playEquipment':
      applyPlayEquipment(state, player, action);
      return;
    case 'coffeeMug':
      applyCoffeeMug(state, player, action);
      return;
    default:
      illegal(`unknown action type: ${action.type}`);
  }
}

function  applyAction(state, action) {
  const next = clone(state);
  applyInPlace(next, action);
  next.actionCount += 1;
  return next;
}

// ---------------------------------------------------------------------------
// Legal actions

function collectSoloGroups(state, player) {
  const groups = [];
  const locked = lockedValues(state);
  for (const value of ANY_VALUES) {
    if (locked.includes(value)) continue;
    if (state.oxygen && oxygenCost(value) > state.oxygen.supply) continue;
    const wires = [];
    for (let seat = 0; seat < state.playerCount; seat += 1) {
      for (const wire of handWires(state, seat)) {
        if (wire.kind === 'blue' && wire.value === value) wires.push(wire);
      }
    }
    if ((wires.length === 2 || wires.length === 4) && wires.every((wire) => wire.owner === player)) {
      groups.push({ type: 'soloCut', playerId: state.players[player].id, kind: 'blue', value });
    }
  }
  const yellow = [];
  for (let seat = 0; seat < state.playerCount; seat += 1) {
    for (const wire of handWires(state, seat)) {
      if (wire.kind === 'yellow') yellow.push(wire);
    }
  }
  const yellowOk = !state.oxygen || oxygenCost('yellow') <= state.oxygen.supply;
  if (yellowOk && (yellow.length === 2 || yellow.length === 4) && yellow.every((wire) => wire.owner === player)) {
    groups.push({ type: 'soloCut', playerId: state.players[player].id, kind: 'yellow' });
  }
  return groups;
}

// One representative per value on a stand (duplicates are interchangeable for
// a plain Dual Cut) and equivalence-class wire sets for detectors.
function representatives(wires) {
  const seen = new Set();
  const out = [];
  for (const wire of wires) {
    const key = wireValueKey(wire);
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(wire);
  }
  return out;
}

function wireSets(wires, size) {
  const groups = [];
  const index = new Map();
  for (const wire of wires) {
    const key = wireValueKey(wire);
    if (!index.has(key)) {
      index.set(key, groups.length);
      groups.push([]);
    }
    groups[index.get(key)].push(wire);
  }
  const sets = [];
  const walk = (groupIndex, chosen) => {
    if (chosen.length === size) {
      sets.push(chosen.slice());
      return;
    }
    if (groupIndex >= groups.length) return;
    const group = groups[groupIndex];
    const remaining = size - chosen.length;
    for (let take = 0; take <= Math.min(group.length, remaining); take += 1) {
      walk(groupIndex + 1, take === 0 ? chosen : chosen.concat(group.slice(0, take)));
    }
  };
  walk(0, []);
  return sets;
}

function pairs(values) {
  const out = [];
  for (let first = 0; first < values.length; first += 1) {
    for (let second = first + 1; second < values.length; second += 1) {
      out.push([values[first], values[second]]);
    }
  }
  return out;
}

function pushDualCuts(state, player, out, limit) {
  const hand = handWires(state, player);
  const ownValues = [];
  const locked = lockedValues(state);
  const affordable = (value) => !state.oxygen || oxygenCost(value) <= state.oxygen.supply;
  for (let value = 1; value <= 12; value += 1) {
    if (locked.includes(value)) continue;
    if (!affordable(value)) continue;
    if (hand.some((wire) => wire.kind === 'blue' && wire.value === value)) ownValues.push(value);
  }
  if (affordable('yellow') && hand.some((wire) => wire.kind === 'yellow')) ownValues.push('yellow');

  const numberValues = ownValues.filter((value) => value !== 'yellow');
  const ray = Boolean(usableCard(state, 10));
  const triple = Boolean(usableCard(state, 3));
  const superCard = Boolean(usableCard(state, 5));
  const personal = !state.players[player].personal.used;

  // Plain cuts announce one value; X/Y Ray announces two. A usable Ray card
  // must not hide the plain options, so both variants are generated.
  const plainValues = ownValues.map((value) => [value]);
  const pairOk = (pair) => !state.oxygen || oxygenCostOf(pair) <= state.oxygen.supply;
  const rayValues = ray ? pairs(ownValues).filter(pairOk) : [];
  const plainDetectorValues = numberValues.map((value) => [value]);
  const rayDetectorValues = ray ? pairs(numberValues).filter(pairOk) : [];

  for (let target = 0; target < state.playerCount; target += 1) {
    if (target === player) continue;
    if (!playerHasWires(state, target)) continue;
    for (let stand = 0; stand < state.players[target].standCount; stand += 1) {
      const wires = standWires(state, target, stand).filter(isOnStand);
      if (wires.length === 0) continue;

      const base = {
        type: 'dualCut',
        playerId: state.players[player].id,
        targetId: state.players[target].id,
      };

      for (const wire of representatives(wires)) {
        for (const values of plainValues) {
          if (out.length >= limit) return;
          out.push({ ...base, wireIds: [wire.id], values, detector: null, ray: false });
        }
        for (const values of rayValues) {
          if (out.length >= limit) return;
          out.push({ ...base, wireIds: [wire.id], values, detector: null, ray: true });
        }
      }
      if (triple) {
        for (const set of wireSets(wires, 3)) {
          for (const values of plainDetectorValues) {
            if (out.length >= limit) return;
            out.push({ ...base, wireIds: set.map((wire) => wire.id), values, detector: 'triple', ray: false });
          }
          for (const values of rayDetectorValues) {
            if (out.length >= limit) return;
            out.push({ ...base, wireIds: set.map((wire) => wire.id), values, detector: 'triple', ray: true });
          }
        }
      }
      if (personal) {
        for (const set of wireSets(wires, 2)) {
          for (const values of plainDetectorValues) {
            if (out.length >= limit) return;
            out.push({ ...base, wireIds: set.map((wire) => wire.id), values, detector: 'personal', ray: false });
          }
          for (const values of rayDetectorValues) {
            if (out.length >= limit) return;
            out.push({ ...base, wireIds: set.map((wire) => wire.id), values, detector: 'personal', ray: true });
          }
        }
      }
      if (superCard && wires.length > 0) {
        for (const values of plainDetectorValues) {
          if (out.length >= limit) return;
          out.push({
            ...base,
            wireIds: wires.map((wire) => wire.id),
            values,
            detector: 'super',
            ray: false,
          });
        }
        for (const values of rayDetectorValues) {
          if (out.length >= limit) return;
          out.push({
            ...base,
            wireIds: wires.map((wire) => wire.id),
            values,
            detector: 'super',
            ray: true,
          });
        }
      }
    }
  }
}

function pushEquipment(state, player, out, limit) {
  const playerId = state.players[player].id;
  const active = player === state.activeIndex;
  for (const card of state.equipment) {
    if (!card.usable || card.used) continue;
    switch (card.number) {
      case 1:
      case 12: {
        for (let stand = 0; stand < state.players[player].standCount; stand += 1) {
          const ids = state.stands[player][stand];
          for (let index = 0; index + 1 < ids.length; index += 1) {
            const first = state.wires[ids[index]];
            const second = state.wires[ids[index + 1]];
            if (!isOnStand(first) && !isOnStand(second)) continue;
            const same = wireValueKey(first) === wireValueKey(second);
            if (card.number === 1 && same) continue;
            if (card.number === 12 && !same) continue;
            if (out.length >= limit) return;
            out.push({ type: 'playEquipment', playerId, card: card.number, stand, index });
          }
        }
        break;
      }
      case 2: {
        for (const wire of handWires(state, player)) {
          for (let target = 0; target < state.playerCount; target += 1) {
            if (target === player) continue;
            if (!playerHasWires(state, target)) continue;
            if (out.length >= limit) return;
            out.push({
              type: 'playEquipment',
              playerId,
              card: 2,
              wireId: wire.id,
              targetId: state.players[target].id,
            });
          }
        }
        break;
      }
      case 4: {
        for (const wire of handWires(state, player)) {
          if (wire.kind !== 'blue') continue;
          if (out.length >= limit) return;
          out.push({ type: 'playEquipment', playerId, card: 4, wireId: wire.id });
        }
        break;
      }
      case 6: {
        if (state.dial.zone > 1 && out.length < limit) {
          out.push({ type: 'playEquipment', playerId, card: 6 });
        }
        break;
      }
      case 7: {
        const used = state.players
          .map((candidate, seat) => ({ candidate, seat }))
          .filter((entry) => entry.candidate.personal.used);
        for (const entry of used) {
          if (out.length >= limit) return;
          out.push({
            type: 'playEquipment',
            playerId,
            card: 7,
            playerIds: [entry.candidate.id],
          });
        }
        for (let first = 0; first < used.length; first += 1) {
          for (let second = first + 1; second < used.length; second += 1) {
            if (out.length >= limit) return;
            out.push({
              type: 'playEquipment',
              playerId,
              card: 7,
              playerIds: [used[first].candidate.id, used[second].candidate.id],
            });
          }
        }
        break;
      }
      case 8: {
        for (const value of ANY_VALUES) {
          if (out.length >= limit) return;
          out.push({ type: 'playEquipment', playerId, card: 8, value });
        }
        break;
      }
      case 9: {
        if (active && out.length < limit) {
          out.push({ type: 'playEquipment', playerId, card: 9 });
        }
        break;
      }
      default:
        break;
    }
  }
}

// Mission 46 forced cut: every group of wires that could be pointed at. The
// list is capped; the UI builds its own choice from the wires on screen.
function pushSecretCuts(state, player, out, limit) {
  const need = Object.values(state.wires).filter(
    (wire) => isOnStand(wire) && wire.kind === 'blue' && wire.value === state.finalValue,
  ).length;
  const ids = Object.values(state.wires)
    .filter(isOnStand)
    .map((wire) => wire.id)
    .sort();
  const picked = [];
  const walk = (from) => {
    if (out.length >= limit) return;
    if (picked.length === need) {
      out.push({ type: 'secretCut', playerId: state.players[player].id, wireIds: picked.slice() });
      return;
    }
    for (let index = from; index < ids.length; index += 1) {
      picked.push(ids[index]);
      walk(index + 1);
      picked.pop();
      if (out.length >= limit) return;
    }
  };
  walk(0);
}

function  legalActions(state, playerId, options = {}) {
  const player = findPlayerIndex(state, playerId);
  if (player === -1) return [];
  if (state.phase === 'won' || state.phase === 'lost') return [];
  const limit = Number.isInteger(options.maxActions) && options.maxActions > 0
    ? options.maxActions
    : 4000;
  const out = [];

  if (state.phase === 'setup') {
    if (player !== state.setupSeat) return [];
    for (const wire of handWires(state, player)) {
      if (wire.kind !== 'blue') continue;
      if (!(state.infoSupply[wire.value] > 0)) continue;
      out.push({ type: 'setupInfo', playerId, wireId: wire.id });
    }
    return out;
  }

  if (state.pending) {
    if (player !== state.pending.actor) return [];
    const pending = state.pending;
    if (pending.kind === 'walkieReturn') {
      for (const wire of handWires(state, player)) {
        out.push({ type: 'resolve', playerId, wireId: wire.id });
      }
      return out;
    }
    const candidates = pending.kind === 'chooseCut'
      ? pending.candidates.map((entry) => entry.wireId)
      : pending.candidates;
    for (const wireId of candidates) {
      out.push({ type: 'resolve', playerId, wireId });
    }
    return out;
  }

  pushEquipment(state, player, out, limit);

  // Mission 10: while the turn is open, the only way forward is "Snip!".
  if (state.openTurn) {
    if (player !== state.lastActive && playerHasWires(state, player)) {
      out.push({ type: 'snip', playerId });
    }
    return out;
  }

  if (player !== state.activeIndex) return out;

  if (state.oxygen) out.push({ type: 'passTurn', playerId });

  if (holdsOnlyFinal(state, player)) {
    out.push(...collectSoloGroups(state, player));
    pushSecretCuts(state, player, out, Math.min(limit, 60));
    return out;
  }

  const revealHand = handWires(state, player);
  if (revealHand.length > 0 && revealHand.every((wire) => wire.kind === 'red')) {
    out.push({ type: 'revealRed', playerId });
  }
  out.push(...collectSoloGroups(state, player));

  const coffee = usableCard(state, 11);
  if (coffee) {
    for (let target = 0; target < state.playerCount; target += 1) {
      if (!playerHasWires(state, target)) continue;
      if (out.length >= limit) break;
      out.push({ type: 'coffeeMug', playerId, targetId: state.players[target].id });
    }
  }

  pushDualCuts(state, player, out, limit);
  return out;
}
// ---- engine/view.js ----
function tokenSummary(state, wire) {
  return wire.info.map((id) => {
    const token = state.tokens.find((candidate) => candidate.id === id);
    return token
      ? { id: token.id, kind: token.kind, value: token.value, improvised: Boolean(token.improvised) }
      : null;
  }).filter(Boolean);
}

function wireView(state, wire, mine) {
  const info = tokenSummary(state, wire);
  if (mine) {
    return {
      id: wire.id,
      stand: wire.stand,
      kind: wire.kind,
      value: wire.value,
      order: wire.order,
      cut: wire.cut,
      revealed: wire.revealed,
      info,
      ...(wire.deadly ? { deadly: true } : {}),
    };
  }

  if (wire.cut || wire.revealed) {
    return {
      id: wire.id,
      stand: wire.stand,
      kind: wire.kind,
      value: wire.value,
      order: wire.order,
      cut: wire.cut,
      revealed: wire.revealed,
      hidden: false,
      info,
      ...(wire.deadly ? { deadly: true } : {}),
    };
  }

  const numberToken = info.find((token) => token.kind === 'number');
  if (numberToken) {
    return {
      id: wire.id,
      stand: wire.stand,
      kind: 'blue',
      value: numberToken.value,
      hidden: false,
      knownByToken: true,
      info,
    };
  }
  const yellowToken = info.find((token) => token.kind === 'yellow');
  if (yellowToken) {
    return {
      id: wire.id,
      stand: wire.stand,
      kind: 'yellow',
      value: null,
      hidden: false,
      knownByToken: true,
      info,
    };
  }

  // Hidden wires must not carry a value, an order, or a kind.
  return {
    id: wire.id,
    stand: wire.stand,
    hidden: true,
    cut: false,
    revealed: false,
    info,
  };
}

function  publicView(state, viewerId) {
  const viewer = state.players.findIndex((player) => player.id === viewerId);

  // The wire list behind a pending decision exposes which of the pointed wires
  // matched (or which of them were red), so it is shown to its actor only.
  let pending = null;
  if (state.pending) {
    const actor = state.players[state.pending.actor].id;
    const mine = viewer >= 0 && viewer === state.pending.actor;
    pending = {
      kind: state.pending.kind,
      actorId: actor,
      ...(state.pending.kind === 'walkieReturn'
        ? { sourceWireId: state.pending.sourceWireId }
        : {}),
      ...(mine && (state.pending.kind === 'chooseCut' || state.pending.kind === 'placeToken')
        ? { candidates: clone(state.pending.candidates) }
        : {}),
    };
  }

  return {
    schema: state.schema,
    gameId: state.gameId,
    missionId: state.missionId,
    mission: clone(state.mission),
    phase: state.phase,
    you: viewer >= 0 ? state.players[viewer].id : null,
    playerCount: state.playerCount,
    captainId: state.players[state.captainIndex].id,
    activeId: state.players[state.activeIndex].id,
    setupSeatId: state.phase === 'setup' && state.setupSeat !== null
      ? state.players[state.setupSeat].id
      : null,
    turnNumber: state.turnNumber,
    dial: clone(state.dial),
    markers: clone(state.markers),
    sequence: state.sequence
      ? {
        cards: state.sequence.cards.slice(),
        required: state.sequence.required,
        locked: lockedValues(state),
        cut: state.sequence.cards.map((value) => cutBlueCount(state, value)),
      }
      : null,
    setup: resolveSetup(getMission(state.missionId), state.playerCount),
    locked: lockedValues(state),
    deadlyValue: state.deadlyValue ?? null,
    finalValue: state.finalValue ?? null,
    oxygen: state.oxygen ? { supply: state.oxygen.supply, total: state.oxygen.total } : null,
    openTurn: Boolean(state.openTurn),
    lastActiveId: state.lastActive === null || state.lastActive === undefined
      ? null
      : state.players[state.lastActive].id,
    equipment: state.equipment.map((card) => ({
      ...(card.tape ? { tape: card.tape } : {}),
      number: card.number,
      id: card.id,
      name: card.name,
      timing: card.timing,
      effect: card.effect,
      text: card.text,
      usable: card.usable,
      used: card.used,
    })),
    validation: state.validation.slice(),
    infoSupply: clone(state.infoSupply),
    tokens: state.tokens.map((token) => ({
      id: token.id,
      kind: token.kind,
      value: token.value,
      wireId: token.wireId,
      owner: state.players[token.owner].id,
      improvised: Boolean(token.improvised),
    })),
    labels: clone(state.labels),
    players: state.players.map((player, seat) => ({
      id: player.id,
      name: player.name,
      seat: player.seat,
      standCount: player.standCount,
      characterId: player.characterId,
      connected: player.connected,
      personal: {
        id: player.personal.id,
        name: PERSONAL_ITEMS[player.personal.id]?.name || player.personal.id,
        used: player.personal.used,
      },
      hands: state.stands[seat].map((ids, stand) => ids.map(
        (id) => wireView(state, state.wires[id], seat === viewer),
      )),
    })),
    pending,
    lossReason: state.lossReason,
    result: state.phase === 'won' || state.phase === 'lost'
      ? { phase: state.phase, lossReason: state.lossReason }
      : null,
    log: clone(state.log),
  };
}
// ---- bot/bot.js ----
// Wire Squad bot, level 2 ("deduction").
//
// The bot is a pure function of ONE player's publicView. It never receives the
// engine state, so it cannot peek at hidden wires: everything it knows is what
// a person at the table could know (its own hand, cut wires, Info tokens, the
// markers on the board, and the public mission setup).
//
//   chooseBotAction(view, botId) -> action | null
//
// null means "nothing for this bot to do right now".

// Chance that a bot takes a wire that already carries an Info token.
const TOKEN_TAKE_CHANCE = 0.3;
const TOKEN_PENALTY = 0.4;

const SPEECH = ['Ollie', 'Fenn', 'Otta', 'Hedda', 'Gus'];

function  botNameForSeat(seat) {
  return `Bot ${SPEECH[seat % SPEECH.length]}`;
}

function  isBotName(name) {
  return typeof name === 'string' && /^Bot [A-Z]/.test(name);
}

// ---------------------------------------------------------------------------
// Small helpers

function bot_hash(text) {
  let h = 2166136261;
  for (let index = 0; index < text.length; index += 1) {
    h ^= text.charCodeAt(index);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

// Deterministic tie-breaker in [0, 1): same view, same answer.
function bot_jitter(view, salt) {
  return (bot_hash(`${view.gameId}|${view.log.length}|${salt}`) % 1000) / 1000;
}

function botOxygenCost(value) {
  if (value === 'yellow') return 1;
  if (value <= 4) return 1;
  if (value <= 8) return 2;
  return 3;
}

function bot_blueRange(view) {
  const setup = view.setup || { blue: { values: 'all' } };
  const spec = setup.blue ? setup.blue.values : 'all';
  const values = [];
  const [from, to] = spec === 'all' ? [1, 12] : spec;
  for (let value = from; value <= to; value += 1) values.push(value);
  return values;
}

function bot_isLive(wire) {
  return !wire.cut && !wire.revealed;
}

// ---------------------------------------------------------------------------
// Reading the table

function bot_readTable(view, seat) {
  const stands = []; // [{ seat, stand, wires: [entry] }]
  const known = []; // entries whose tile is known
  view.players.forEach((player, s) => {
    player.hands.forEach((hand, stand) => {
      const entries = hand.map((wire, index) => {
        const entry = {
          seat: s,
          stand,
          index,
          id: wire.id,
          cut: Boolean(wire.cut),
          revealed: Boolean(wire.revealed),
          hidden: Boolean(wire.hidden),
          kind: wire.kind || null,
          value: Number.isInteger(wire.value) ? wire.value : null,
          order: typeof wire.order === 'number' ? wire.order : null,
          deadly: Boolean(wire.deadly),
          token: Boolean(wire.knownByToken),
        };
        // A blue wire known by a token or by being cut sits at its own value.
        if (entry.kind === 'blue' && entry.order === null && entry.value !== null) {
          entry.order = entry.value;
        }
        return entry;
      });
      stands.push({ seat: s, stand, wires: entries });
      for (const entry of entries) if (!entry.hidden) known.push(entry);
    });
  });
  return { stands, known, seat };
}

function bot_countKnown(table, view) {
  const blue = {};
  let yellow = 0;
  let red = 0;
  let deadly = 0;
  const yellowOrders = [];
  const redOrders = [];
  for (const entry of table.known) {
    if (entry.deadly) {
      deadly += 1;
    } else if (entry.kind === 'blue') {
      blue[entry.value] = (blue[entry.value] || 0) + 1;
    } else if (entry.kind === 'yellow') {
      yellow += 1;
      if (entry.order !== null) yellowOrders.push(entry.order);
    } else if (entry.kind === 'red') {
      red += 1;
      if (entry.order !== null) redOrders.push(entry.order);
    }
  }
  return { blue, yellow, red, deadly, yellowOrders, redOrders };
}

// The pool of tiles a hidden wire could be, with a weight for each.
function bot_tilePool(view, table, known) {
  const setup = view.setup || {};
  const tiles = [];
  for (const value of bot_blueRange(view)) {
    if (view.deadlyValue === value) continue;
    const left = Math.max(0, 4 - (known.blue[value] || 0));
    if (left > 0) tiles.push({ type: 'blue', value, order: value, weight: left });
  }
  if (view.deadlyValue) {
    const left = Math.max(0, 4 - known.deadly);
    if (left > 0) tiles.push({ type: 'deadly', value: view.deadlyValue, order: view.deadlyValue, weight: left });
  }

  const colour = (type, count, markers, knownCount, knownOrders) => {
    const unknown = Math.max(0, count - knownCount);
    if (unknown === 0) return;
    const free = markers
      .map((marker) => marker.value + (type === 'yellow' ? 0.1 : 0.5))
      .filter((order) => !knownOrders.some((o) => Math.abs(o - order) < 1e-6));
    if (free.length === 0) return;
    const chance = Math.min(1, unknown / free.length);
    for (const order of free) tiles.push({ type, order, weight: chance });
  };
  const yellowSpec = setup.yellow || { count: 0 };
  const redSpec = setup.red || { count: 0 };
  colour('yellow', yellowSpec.count || 0, (view.markers && view.markers.yellow) || [], known.yellow, known.yellowOrders);
  colour('red', redSpec.count || 0, (view.markers && view.markers.red) || [], known.red, known.redOrders);
  return tiles;
}

// Probability table for one hidden wire, from the neighbours that are known.
function bot_slotChances(stand, index, tiles) {
  let low = -Infinity;
  for (let at = index - 1; at >= 0; at -= 1) {
    if (!stand.wires[at].hidden && stand.wires[at].order !== null) { low = stand.wires[at].order; break; }
  }
  let high = Infinity;
  for (let at = index + 1; at < stand.wires.length; at += 1) {
    if (!stand.wires[at].hidden && stand.wires[at].order !== null) { high = stand.wires[at].order; break; }
  }
  const feasible = tiles.filter((tile) => tile.order >= low - 1e-9 && tile.order <= high + 1e-9);
  const total = feasible.reduce((sum, tile) => sum + tile.weight, 0);
  const out = { blue: {}, yellow: 0, explode: 0, total };
  if (total <= 0) return out;
  for (const tile of feasible) {
    const share = tile.weight / total;
    if (tile.type === 'blue') out.blue[tile.value] = (out.blue[tile.value] || 0) + share;
    else if (tile.type === 'yellow') out.yellow += share;
    else out.explode += share; // red and deadly wires blow up when pointed at
  }
  return out;
}

// ---------------------------------------------------------------------------
// Choosing

// Monte Carlo over the unseen tiles: deal them into the hidden slots, one
// gap at a time, keeping every stand in ascending order. Falls back to the
// simple per-slot model when no full deal could be drawn.
function bot_sampleChances(view, table, known, tiles, trials = 160) {
  const result = new Map();
  const gaps = [];
  for (const stand of table.stands) {
    let at = 0;
    while (at < stand.wires.length) {
      if (!stand.wires[at].hidden) { at += 1; continue; }
      let end = at;
      while (end + 1 < stand.wires.length && stand.wires[end + 1].hidden) end += 1;
      let low = -Infinity;
      for (let k = at - 1; k >= 0; k -= 1) {
        if (!stand.wires[k].hidden && stand.wires[k].order !== null) { low = stand.wires[k].order; break; }
      }
      let high = Infinity;
      for (let k = end + 1; k < stand.wires.length; k += 1) {
        if (!stand.wires[k].hidden && stand.wires[k].order !== null) { high = stand.wires[k].order; break; }
      }
      gaps.push({ stand, from: at, to: end, low, high });
      at = end + 1;
    }
  }
  if (gaps.length === 0) return result;

  let seed = bot_hash(`${view.gameId}|${view.log.length}|mc`) || 1;
  const rand = () => {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  const base = [];
  const colourGroups = { yellow: [], red: [] };
  for (const tile of tiles) {
    if (tile.type === 'blue' || tile.type === 'deadly') {
      for (let n = 0; n < tile.weight; n += 1) base.push(tile);
    } else {
      colourGroups[tile.type].push(tile);
    }
  }
  const yellowUnknown = Math.max(0, ((view.setup && view.setup.yellow && view.setup.yellow.count) || 0) - known.yellow);
  const redUnknown = Math.max(0, ((view.setup && view.setup.red && view.setup.red.count) || 0) - known.red);

  const tally = new Map();
  const hiddenIds = [];
  for (const gap of gaps) for (let k = gap.from; k <= gap.to; k += 1) {
    const id = gap.stand.wires[k].id;
    hiddenIds.push(id);
    tally.set(id, { blue: {}, yellow: 0, explode: 0, n: 0 });
  }
  const pickSome = (list, count) => {
    const copy = list.slice();
    const out = [];
    for (let n = 0; n < count && copy.length; n += 1) {
      out.push(copy.splice(Math.floor(rand() * copy.length), 1)[0]);
    }
    return out;
  };

  let good = 0;
  for (let trial = 0; trial < trials; trial += 1) {
    const pool = base.slice();
    for (const tile of pickSome(colourGroups.yellow, yellowUnknown)) pool.push(tile);
    for (const tile of pickSome(colourGroups.red, redUnknown)) pool.push(tile);
    const order = gaps.map((_, i) => i).sort(() => rand() - 0.5);
    const deal = [];
    let ok = true;
    for (const gi of order) {
      const gap = gaps[gi];
      const size = gap.to - gap.from + 1;
      const feasible = [];
      for (let p = 0; p < pool.length; p += 1) {
        if (pool[p].order >= gap.low - 1e-9 && pool[p].order <= gap.high + 1e-9) feasible.push(p);
      }
      if (feasible.length < size) { ok = false; break; }
      const chosen = [];
      for (let n = 0; n < size; n += 1) {
        const at = Math.floor(rand() * feasible.length);
        chosen.push(feasible.splice(at, 1)[0]);
      }
      chosen.sort((a, b) => pool[a].order - pool[b].order);
      const tilesChosen = chosen.map((p) => pool[p]);
      deal.push({ gap, tilesChosen });
      chosen.sort((a, b) => b - a).forEach((p) => pool.splice(p, 1));
    }
    if (!ok) continue;
    good += 1;
    for (const { gap, tilesChosen } of deal) {
      tilesChosen.forEach((tile, i) => {
        const entry = tally.get(gap.stand.wires[gap.from + i].id);
        entry.n += 1;
        if (tile.type === 'blue') entry.blue[tile.value] = (entry.blue[tile.value] || 0) + 1;
        else if (tile.type === 'yellow') entry.yellow += 1;
        else entry.explode += 1;
      });
    }
  }
  if (good < 8) return result;
  for (const [id, entry] of tally) {
    const out = { blue: {}, yellow: entry.yellow / good, explode: entry.explode / good, total: good };
    for (const [value, count] of Object.entries(entry.blue)) out.blue[value] = count / good;
    result.set(id, out);
  }
  return result;
}

function bot_lockedList(view) {
  return view.locked || (view.sequence ? view.sequence.locked : []);
}

function bot_myLive(view, seat) {
  return view.players[seat].hands.flat().filter(bot_isLive);
}

function bot_holdsOnlyFinal(view, seat) {
  if (!view.finalValue) return false;
  const live = bot_myLive(view, seat);
  return live.length > 0 && live.every((wire) => wire.kind === 'blue' && wire.value === view.finalValue);
}

function bot_chooseSetup(view, me, seat) {
  const supply = view.infoSupply;
  const hand = view.players[seat].hands.flat();
  const live = hand.filter((wire) => bot_isLive(wire) && wire.kind === 'blue' && supply[wire.value] > 0);
  if (live.length === 0) return null;
  const counts = {};
  for (const wire of hand.filter(bot_isLive)) counts[wire.value] = (counts[wire.value] || 0) + 1;
  const middle = (hand.length - 1) / 2;
  let best = null;
  let bestScore = -Infinity;
  for (const wire of live) {
    const position = hand.indexOf(wire);
    // A token in the middle of a long stand, on a value held once, helps most.
    const score = -Math.abs(position - middle) + (counts[wire.value] === 1 ? 1.5 : 0)
      + bot_jitter(view, `s${wire.id}`) * 0.4;
    if (score > bestScore) { best = wire; bestScore = score; }
  }
  return { type: 'setupInfo', playerId: me, wireId: best.id };
}

function bot_choosePending(view, me, seat) {
  const pending = view.pending;
  if (pending.kind === 'chooseCut') {
    const list = pending.candidates || [];
    if (list.length === 0) return null;
    return { type: 'resolve', playerId: me, wireId: list[0].wireId };
  }
  if (pending.kind === 'placeToken') {
    const list = pending.candidates || [];
    if (list.length === 0) return null;
    return { type: 'resolve', playerId: me, wireId: list[0] };
  }
  if (pending.kind === 'walkieReturn') {
    const own = bot_myLive(view, seat).find((wire) => wire.kind !== 'red') || bot_myLive(view, seat)[0];
    return own ? { type: 'resolve', playerId: me, wireId: own.id } : null;
  }
  return null;
}

function bot_soloGroups(view, seat, known) {
  const out = [];
  const locked = bot_lockedList(view);
  const live = bot_myLive(view, seat);
  for (const value of bot_blueRange(view)) {
    if (value === view.deadlyValue || locked.includes(value)) continue;
    if (view.oxygen && botOxygenCost(value) > view.oxygen.supply) continue;
    const mine = live.filter((wire) => wire.kind === 'blue' && wire.value === value).length;
    const gone = (known.blue[value] || 0) - mine; // known elsewhere, cut or tokened
    const cut = view.players.flatMap((p) => p.hands.flat())
      .filter((wire) => wire.cut && wire.kind === 'blue' && wire.value === value).length;
    const left = 4 - cut;
    if (mine > 0 && mine === left && (left === 2 || left === 4)) out.push({ value, count: mine, gone });
  }
  const yellowCount = (view.setup && view.setup.yellow && view.setup.yellow.count) || 0;
  if (yellowCount > 0 && !(view.oxygen && view.oxygen.supply < 1)) {
    const cutYellow = view.players.flatMap((p) => p.hands.flat())
      .filter((wire) => wire.cut && wire.kind === 'yellow').length;
    const mine = live.filter((wire) => wire.kind === 'yellow').length;
    const left = yellowCount - cutYellow;
    if (mine > 0 && mine === left && (left === 2 || left === 4)) out.push({ value: 'yellow', count: mine });
  }
  return out;
}

function bot_chooseSecretCut(view, me, seat, table, tiles, chancesMap) {
  const finalValue = view.finalValue;
  const cutFinal = view.players.flatMap((p) => p.hands.flat())
    .filter((wire) => wire.cut && wire.kind === 'blue' && wire.value === finalValue).length;
  const need = 4 - cutFinal;
  const mine = bot_myLive(view, seat).filter((wire) => wire.kind === 'blue' && wire.value === finalValue);
  const ids = mine.map((wire) => wire.id);
  const others = [];
  for (const stand of table.stands) {
    if (stand.seat === seat) continue;
    stand.wires.forEach((wire, index) => {
      if (wire.cut || wire.revealed) return;
      let chance = 0;
      if (!wire.hidden) chance = wire.kind === 'blue' && wire.value === finalValue ? 1 : 0;
      else chance = (chancesMap.get(wire.id) || bot_slotChances(stand, index, tiles)).blue[finalValue] || 0;
      others.push({ id: wire.id, chance, tie: bot_jitter(view, `x${wire.id}`) });
    });
  }
  others.sort((a, b) => b.chance - a.chance || a.tie - b.tie);
  for (const entry of others) {
    if (ids.length >= need) break;
    ids.push(entry.id);
  }
  if (ids.length !== need) return null;
  return { type: 'secretCut', playerId: me, wireIds: ids };
}

function bot_chooseTurn(view, me, seat) {
  const table = bot_readTable(view, seat);
  const known = bot_countKnown(table, view);
  const tiles = bot_tilePool(view, table, known);
  const chancesMap = bot_sampleChances(view, table, known, tiles);
  const live = bot_myLive(view, seat);
  if (live.length === 0) return null;

  // 1. Reveal red wires when the whole hand is red (deadly wires count).
  if (live.every((wire) => wire.kind === 'red')) {
    return { type: 'revealRed', playerId: me };
  }

  const finalOnly = bot_holdsOnlyFinal(view, seat);
  const solos = bot_soloGroups(view, seat, known);
  if (finalOnly) {
    const group = solos.find((entry) => entry.value === view.finalValue);
    if (group) return { type: 'soloCut', playerId: me, kind: 'blue', value: group.value };
    return bot_chooseSecretCut(view, me, seat, table, tiles, chancesMap);
  }

  // 2. A Solo Cut is free and certain.
  if (solos.length > 0) {
    solos.sort((a, b) => b.count - a.count);
    const pick = solos[0];
    return pick.value === 'yellow'
      ? { type: 'soloCut', playerId: me, kind: 'yellow' }
      : { type: 'soloCut', playerId: me, kind: 'blue', value: pick.value };
  }

  // 3. The best Dual Cut by probability.
  const locked = bot_lockedList(view);
  const values = [];
  for (const wire of live) {
    if (wire.kind === 'blue' && !locked.includes(wire.value) && !values.includes(wire.value)) {
      values.push(wire.value);
    }
  }
  if (live.some((wire) => wire.kind === 'yellow')) values.push('yellow');
  const affordable = values.filter((value) => !view.oxygen || botOxygenCost(value) <= view.oxygen.supply);

  let best = null;
  let bestScore = -Infinity;
  for (const stand of table.stands) {
    if (stand.seat === seat) continue;
    stand.wires.forEach((wire, index) => {
      if (wire.cut || wire.revealed) return;
      let chances;
      if (!wire.hidden) {
        chances = { blue: {}, yellow: 0, explode: 0 };
        if (wire.kind === 'blue') chances.blue[wire.value] = 1;
        else if (wire.kind === 'yellow') chances.yellow = 1;
        else chances.explode = 1;
      } else {
        chances = chancesMap.get(wire.id) || bot_slotChances(stand, index, tiles);
      }
      for (const value of affordable) {
        const p = value === 'yellow' ? chances.yellow : (chances.blue[value] || 0);
        let score = p - 3 * chances.explode;
        if (view.oxygen) score -= 0.02 * botOxygenCost(value);
        // Prefer finishing the Number card that is open right now.
        if (view.sequence && value === view.sequence.cards[0]) score += 0.05;
        if (view.sequence) {
          const open = view.sequence.cards.find((card) => !locked.includes(card)
            && (view.sequence.cut[view.sequence.cards.indexOf(card)] || 0) < view.sequence.required);
          if (open === value) score += 0.08;
        }
        // Wires already marked with an Info token are the helpers people play
        // with. Taking them every time leaves the table without hints, so a
        // bot reaches for one only now and then (about one turn in four) and
        // otherwise prefers a good guess elsewhere.
        if (wire.token && !wire.cut && bot_jitter(view, `tok${wire.id}`) >= TOKEN_TAKE_CHANCE) {
          score -= TOKEN_PENALTY;
        }
        score += bot_jitter(view, `${wire.id}:${value}`) * 0.01;
        if (score > bestScore) {
          bestScore = score;
          best = { stand, wire, value };
        }
      }
    });
  }
  if (best) {
    return {
      type: 'dualCut',
      playerId: me,
      targetId: view.players[best.stand.seat].id,
      wireIds: [best.wire.id],
      values: [best.value],
      detector: null,
      ray: false,
    };
  }
  // Nothing affordable: with Oxygen the player skips the turn.
  if (view.oxygen) return { type: 'passTurn', playerId: me };
  return null;
}

function  chooseBotAction(view, botId) {
  if (!view || view.phase === 'won' || view.phase === 'lost') return null;
  const seat = view.players.findIndex((player) => player.id === botId);
  if (seat < 0) return null;

  if (view.phase === 'setup') {
    return view.setupSeatId === botId ? bot_chooseSetup(view, botId, seat) : null;
  }
  if (view.pending) {
    return view.pending.actorId === botId ? bot_choosePending(view, botId, seat) : null;
  }
  if (view.openTurn) {
    const eligible = view.lastActiveId !== botId && bot_myLive(view, seat).length > 0;
    return eligible ? { type: 'snip', playerId: botId } : null;
  }
  if (view.activeId !== botId) return null;
  return bot_chooseTurn(view, botId, seat);
}

// Which bot (if any) has something to do. Used by the table driver.
function  botToAct(view, botIds) {
  if (!view || view.phase === 'won' || view.phase === 'lost') return null;
  const ids = botIds instanceof Set ? botIds : new Set(botIds);
  if (view.phase === 'setup') return ids.has(view.setupSeatId) ? view.setupSeatId : null;
  if (view.pending) return ids.has(view.pending.actorId) ? view.pending.actorId : null;
  if (view.openTurn) {
    const eligible = view.players.filter((player, seat) => (
      ids.has(player.id)
      && player.id !== view.lastActiveId
      && view.players[seat].hands.flat().some(bot_isLive)
    ));
    return eligible.length ? eligible[0].id : null;
  }
  return ids.has(view.activeId) ? view.activeId : null;
}

const DEFAULT_TIMEOUT_MS = 15000;
const MAX_NAME = 24;
const MIN_NAME = 1;

const  ROOM_CODE_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const  ROOM_CODE_LENGTH = 5;
const  ROOM_MAX_PLAYERS = 5;

// Room codes avoid I, O, 0 and 1 so they can be read over voice chat.
function  makeRoomCode(random = Math.random, length = ROOM_CODE_LENGTH) {
  if (typeof random !== 'function') throw new TypeError('random must be a function');
  if (!Number.isInteger(length) || length < 4 || length > 8) {
    throw new RangeError('room code length must be 4-8');
  }
  let code = '';
  for (let index = 0; index < length; index += 1) {
    const pick = Math.floor(random() * ROOM_CODE_ALPHABET.length);
    // Math.random() is documented as < 1, but a bad stub could return 1.
    code += ROOM_CODE_ALPHABET[Math.min(pick, ROOM_CODE_ALPHABET.length - 1)];
  }
  return code;
}

function  isRoomCode(value) {
  return typeof value === 'string' && /^[A-Z0-9]{4,8}$/.test(value);
}

function  normalizeRoomCode(value) {
  return String(value || '').trim().toUpperCase();
}

// A per-browser identity. Stored by the caller (localStorage) so a reconnect
// or page reload rejoins the same seat instead of creating a new player.
function  newPlayerId(cryptoImpl = globalThis.crypto) {
  if (cryptoImpl && typeof cryptoImpl.randomUUID === 'function') {
    return cryptoImpl.randomUUID();
  }
  const hex = () => Math.floor(Math.random() * 16).toString(16);
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (mark) => {
    if (mark === 'x') return hex();
    return (Math.floor(Math.random() * 4) + 8).toString(16);
  });
}

function  isValidName(value) {
  if (typeof value !== 'string') return false;

function  makeClient(options = {}) {

      }
    }

    if (!response.ok) {
      const body = data && typeof data === 'object' ? data : {};
      throw new NetError(body.message || `request failed (${response.status})`, {
        status: response.status,
        code: body.code || String(response.status),
        details: data,
      });
    }
    return data;
  }

  return {
    url,
    key,
    request,
    rpc(name, args) {
      if (typeof name !== 'string' || !name) {
        throw new NetError('RPC name is required', { code: 'INVALID_RPC' });
      }
      return request(`/rest/v1/rpc/${name}`, { method: 'POST', body: args || {} });
    },
    select(table, query) {
      if (typeof table !== 'string' || !/^[a-z_]+$/.test(table)) {
        throw new NetError('invalid table name', { code: 'INVALID_TABLE' });
      }
      return request(`/rest/v1/${table}?${query || ''}`);
    },
  };
}

// Room calls

async function  createRoom(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  assertName(options.hostName, 'host name');
  if (!options.hostId) throw new NetError('host id is required', { code: 'NO_PLAYER' });
  return client.rpc('create_room', {
    p_code: code,
    p_host_id: options.hostId,
    p_host_name: options.hostName.trim(),
  });
}

async function  joinRoom(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  assertName(options.name, 'player name');
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  return client.rpc('join_room', {
    p_code: code,
    p_player_id: options.playerId,
    p_name: options.name.trim(),
  });
}

async function  startRoomGame(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  assertObject(options.state, 'game state');
  if (!Number.isInteger(options.missionId)) {
    throw new NetError('mission id is required', { code: 'INVALID_MISSION' });
  }
  if (!Number.isInteger(options.seed)) {
    throw new NetError('seed is required', { code: 'INVALID_SEED' });
  }
  return client.rpc('start_game', {
    p_code: code,
    p_player_id: options.playerId,
    p_state: options.state,
    p_mission_id: options.missionId,
    p_seed: options.seed,
  });
}

async function  submitAction(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  assertSeq(options.baseSeq);
  assertObject(options.action, 'action');
  assertObject(options.state, 'game state');
  try {
    return await client.rpc('submit_action', {
      p_code: code,
      p_player_id: options.playerId,
      p_base_seq: options.baseSeq,
      p_action: options.action,
      p_state: options.state,
    });
  } catch (error) {
    // A stale action comes back as HTTP 409 (the schema raises SQLSTATE
    // PT409). Callers refetch the room instead of retrying the same move.
    if (error instanceof NetError && (error.status === 409 || error.code === 'STALE')) {
      error.code = 'STALE';
    }
    throw error;
  }
}

async function  setRoomStatus(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  if (options.status !== 'playing' && options.status !== 'paused') {
    throw new NetError('status must be playing or paused', { code: 'INVALID_STATUS' });
  }
  return client.rpc('set_room_status', {
    p_code: code,
    p_player_id: options.playerId,
    p_status: options.status,
  });
}

async function  touchPlayer(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  return client.rpc('touch_player', {
    p_code: code,
    p_player_id: options.playerId,
  });
}

// Ready is optional so an older schema keeps working. Callers catch the
// missing-RPC error and fall back to presence (connected = ready).
async function  setPlayerReady(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  if (typeof options.ready !== 'boolean') {
    throw new NetError('ready must be a boolean', { code: 'INVALID_READY' });
  }
  return client.rpc('set_ready', {
    p_code: code,
    p_player_id: options.playerId,
    p_ready: options.ready,
  });
}

async function  setRoomMaxPlayers(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  if (!Number.isInteger(options.maxPlayers) || options.maxPlayers < 2 || options.maxPlayers > ROOM_MAX_PLAYERS) {
    throw new NetError('player count must be 2-5', { code: 'INVALID_PLAYER_COUNT' });
  }
  return client.rpc('set_max_players', {
    p_code: code,
    p_player_id: options.playerId,
    p_max_players: options.maxPlayers,
  });
}

async function  leaveRoom(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  return client.rpc('leave_room', {
    p_code: code,
    p_player_id: options.playerId,
  });
}

// After a won/lost mission the host can return the same room to the lobby so
// the crew can pick another mission without exchanging a new code.
async function  resetRoom(client, options) {
  const code = normalizeRoomCode(options.code);
  assertRoomCode(code);
  if (!options.playerId) throw new NetError('player id is required', { code: 'NO_PLAYER' });
  return client.rpc('reset_room', {
    p_code: code,
    p_player_id: options.playerId,
  });
}

async function  getRoom(client, code) {
  const normalized = normalizeRoomCode(code);
  assertRoomCode(normalized);
  const rows = await client.select(
    'rooms',
    `code=eq.${normalized}&select=*`,
  );
  return Array.isArray(rows) && rows.length > 0 ? rows[0] : null;
}

async function  listPlayers(client, code) {
  const normalized = normalizeRoomCode(code);
  assertRoomCode(normalized);
  // select=* keeps older projects (without the optional ready column) working.
  const rows = await client.select(
    'players',
    `room_code=eq.${normalized}&select=*&order=seat.asc`,
  );
  return Array.isArray(rows) ? rows : [];
}

async function  listActions(client, code, afterSeq = 0) {
  const normalized = normalizeRoomCode(code);
  assertRoomCode(normalized);
  assertSeq(afterSeq);
  const rows = await client.select(
    'action_log',
    `room_code=eq.${normalized}&seq=gt.${afterSeq}&select=seq,player_id,action,created_at&order=seq.asc`,
  );
  return Array.isArray(rows) ? rows : [];
}

// One poll: the room row, its seated players, and any actions past afterSeq.
async function  fetchSnapshot(client, code, options = {}) {
  const afterSeq = options.afterSeq || 0;
  const [room, players, actions] = await Promise.all([
    getRoom(client, code),
    listPlayers(client, code),
    listActions(client, code, afterSeq),
  ]);
  if (!room) throw new NetError('room not found', { code: 'NOT_FOUND' });
  return { room, players, actions };
}

// Players whose heartbeat is older than the threshold. The UI turns this into
// the "Waiting for <name>" pause screen; no bot ever takes their seat.
function  stalePlayers(players, nowMs, thresholdMs = 30000) {
  if (!Array.isArray(players)) return [];
  return players.filter((player) => {
    const seen = Date.parse(player.last_seen);
    return Number.isFinite(seen) && nowMs - seen > thresholdMs;
  });
}

function  roomStatusLabel(room) {
  if (!room) return 'missing';
  if (room.status === 'lobby') return 'lobby';
  if (room.status === 'paused') return 'paused';
  if (room.status === 'won') return 'won';
  if (room.status === 'lost') return 'lost';
  return room.state && room.state.phase === 'won' ? 'won' : 'playing';
}

// working offline.

  skull: '<path d="M12 3a8 8 0 00-5 14v3h10v-3a8 8 0 00-5-14z"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><path d="M10 20v-2M14 20v-2"/>',

  mug: '<path d="M4 8h12v8a4 4 0 01-4 4H8a4 4 0 01-4-4z"/><path d="M16 10h2a2 2 0 010 5h-2"/><path d="M7 3v2M11 3v2"/>',
